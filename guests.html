<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>✨ 06.08.26 ✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        /* ——— Базовые сбросы ——— */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #1a0e10;

            background-image:
                    radial-gradient(ellipse at 20% 50%, #3a1c1f 0%, transparent 60%),
                    radial-gradient(ellipse at 80% 80%, #2d1518 0%, transparent 50%),
                    linear-gradient(145deg, #1a0e10 0%, #2b171a 100%);
            position: relative;
            overflow: hidden;
            font-family: 'Pacifico', sans-serif;
        }

        /* ——— Тёплый свет камина (имитация) ——— */
        .fireplace-glow {
            position: fixed;
            inset: 0;
            background:
                    radial-gradient(ellipse at 50% 90%, rgba(255, 140, 60, 0.15) 0%, transparent 60%),
                    radial-gradient(ellipse at 30% 70%, rgba(255, 100, 40, 0.08) 0%, transparent 40%),
                    radial-gradient(ellipse at 70% 80%, rgba(200, 80, 30, 0.06) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
            animation: firePulse 4s ease-in-out infinite alternate;
        }

        @keyframes firePulse {
            0% { opacity: 0.5; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.08); }
            100% { opacity: 0.7; transform: scale(1.02); }
        }

        /* ——— Плавающие огоньки (светлячки) ——— */
        .firefly {
            position: fixed;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #ffd699, #ff8a4a);
            border-radius: 50%;
            filter: blur(3px) drop-shadow(0 0 20px #ff8a4a);
            pointer-events: none;
            z-index: 0;
            animation: fireflyFloat 12s ease-in-out infinite;
            opacity: 0;
        }
        .firefly:nth-child(2) { left: 10%; top: 20%; animation-delay: 0s; width: 10px; height: 10px; }
        .firefly:nth-child(3) { left: 25%; top: 60%; animation-delay: 2.5s; width: 6px; height: 6px; }
        .firefly:nth-child(4) { left: 45%; top: 10%; animation-delay: 5s; width: 12px; height: 12px; background: radial-gradient(circle, #ffb56b, #ff6a2a); }
        .firefly:nth-child(5) { left: 60%; top: 45%; animation-delay: 1.2s; width: 7px; height: 7px; }
        .firefly:nth-child(6) { left: 75%; top: 75%; animation-delay: 3.8s; width: 9px; height: 9px; }
        .firefly:nth-child(7) { left: 90%; top: 25%; animation-delay: 6.5s; width: 5px; height: 5px; }
        .firefly:nth-child(8) { left: 50%; top: 85%; animation-delay: 4.2s; width: 11px; height: 11px; background: radial-gradient(circle, #ffcc80, #ff7a3a); }
        .firefly:nth-child(9) { left: 5%; top: 80%; animation-delay: 7s; width: 7px; height: 7px; }
        .firefly:nth-child(10) { left: 85%; top: 5%; animation-delay: 1.8s; width: 8px; height: 8px; }

        @keyframes fireflyFloat {
            0% { opacity: 0; transform: translate(0, 0) scale(0) rotate(0deg); }
            10% { opacity: 0.9; transform: translate(30px, -20px) scale(1.2) rotate(20deg); }
            30% { opacity: 1; transform: translate(-20px, -50px) scale(1) rotate(-15deg); }
            50% { opacity: 0.8; transform: translate(40px, 30px) scale(0.8) rotate(30deg); }
            70% { opacity: 1; transform: translate(-30px, 10px) scale(1.1) rotate(-25deg); }
            90% { opacity: 0.6; transform: translate(20px, -30px) scale(0.9) rotate(10deg); }
            100% { opacity: 0; transform: translate(0, 0) scale(0) rotate(0deg); }
        }

        /* ——— Падающие звёзды ——— */
        .shooting-star {
            position: fixed;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            animation: shootingStar 8s linear infinite;
            opacity: 0;
        }
        .shooting-star::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 80px;
            height: 1px;
            background: linear-gradient(to left, rgba(255, 200, 150, 0.8), transparent);
            transform: rotate(-45deg);
            transform-origin: right center;
        }
        .shooting-star:nth-child(11) { left: 20%; top: 10%; animation-delay: 0s; }
        .shooting-star:nth-child(12) { left: 50%; top: 5%; animation-delay: 4s; }
        .shooting-star:nth-child(13) { left: 80%; top: 15%; animation-delay: 2.5s; }
        .shooting-star:nth-child(14) { left: 35%; top: 8%; animation-delay: 6s; }
        .shooting-star:nth-child(15) { left: 65%; top: 12%; animation-delay: 3.2s; }

        @keyframes shootingStar {
            0% { opacity: 0; transform: translate(0, 0) scale(0); }
            5% { opacity: 1; transform: translate(0, 0) scale(1); }
            20% { opacity: 0.8; transform: translate(-150px, 150px) scale(1); }
            40% { opacity: 0; transform: translate(-300px, 300px) scale(0.5); }
            100% { opacity: 0; transform: translate(-300px, 300px) scale(0); }
        }

        /* ——— Мерцание свечей (декор) ——— */
        .candle-light {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            pointer-events: none;
            z-index: 0;
            animation: candleFlicker 3.5s ease-in-out infinite alternate;
        }
        .candle-light:nth-child(16) {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255, 180, 100, 0.2), transparent 70%);
            bottom: 20px;
            left: -60px;
        }
        .candle-light:nth-child(17) {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(255, 140, 80, 0.15), transparent 70%);
            bottom: 40px;
            right: 20px;
            animation-delay: 1.8s;
        }
        .candle-light:nth-child(18) {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(200, 100, 60, 0.12), transparent 70%);
            top: -50px;
            right: -80px;
            animation-delay: 1s;
        }
        .candle-light:nth-child(19) {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(255, 160, 90, 0.1), transparent 70%);
            top: 20px;
            left: -40px;
            animation-delay: 2.5s;
        }

        @keyframes candleFlicker {
            0% { opacity: 0.3; transform: scale(0.8) rotate(-5deg); }
            30% { opacity: 0.8; transform: scale(1.2) rotate(3deg); }
            60% { opacity: 0.5; transform: scale(0.9) rotate(-2deg); }
            100% { opacity: 1; transform: scale(1.3) rotate(5deg); }
        }

        /* ——— Контейнер — тёплое матовое стекло ——— */
        .container {
            position: relative;
            z-index: 10;
            backdrop-filter: blur(18px) saturate(1.2);
            -webkit-backdrop-filter: blur(18px) saturate(1.2);
            background: rgba(40, 20, 25, 0.5);
            border-radius: 48px 48px 40px 40px;
            padding: 26px 28px 24px;
            max-width: 440px;
            width: 100%;
            box-shadow:
                    0 30px 70px rgba(0, 0, 0, 0.7),
                    0 0 0 1px rgba(255, 180, 130, 0.10),
                    inset 0 1px 0 rgba(255, 200, 150, 0.10),
                    inset 0 -1px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 180, 130, 0.06);
            transition: all 0.4s ease;
        }

        /* ——— Декоративные элементы углов (свечи и цветы) ——— */
        .corner-decor {
            position: absolute;
            font-size: 1.4rem;
            opacity: 0.5;
            filter: drop-shadow(0 0 20px rgba(255, 150, 80, 0.3));
            user-select: none;
            pointer-events: none;
            animation: decorFloat 6s ease-in-out infinite;
        }
        .corner-decor:nth-child(1) { top: 16px; left: 18px; animation-delay: 0s; }
        .corner-decor:nth-child(2) { top: 16px; right: 18px; animation-delay: 2s; }
        .corner-decor:nth-child(3) { bottom: 16px; left: 18px; animation-delay: 1s; }
        .corner-decor:nth-child(4) { bottom: 16px; right: 18px; animation-delay: 3s; }

        @keyframes decorFloat {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.4; }
            25% { transform: translateY(-8px) rotate(5deg) scale(1.05); opacity: 0.7; }
            50% { transform: translateY(0) rotate(-3deg) scale(0.95); opacity: 0.5; }
            75% { transform: translateY(-5px) rotate(8deg) scale(1.02); opacity: 0.6; }
        }

        /* ——— Основной экран ——— */
        .content-screen {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: center;
            animation: fadeRomance 1.4s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }

        @keyframes fadeRomance {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .emoji-big {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 4px;
            filter: drop-shadow(0 0 40px rgba(255, 150, 80, 0.2));
            animation: gentleFloat 7s ease-in-out infinite;
            line-height: 1.2;
            letter-spacing: 6px;
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0) scale(1) rotate(-1deg); }
            50% { transform: translateY(-10px) scale(1.03) rotate(1deg); }
        }

        .content-title {
            font-family: 'Great Vibes', cursive;
            font-size: 2.6rem;
            font-weight: 400;
            background: linear-gradient(135deg, #f5d6b8, #e8b08a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 60px rgba(255, 150, 80, 0.10);
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .message-text {
            font-size: 1rem;
            color: #f0e0d8;
            line-height: 1.7;
            max-width: 340px;
            margin: 0 auto;
            text-align: left;
            padding: 6px 8px;
            font-weight: 300;
            backdrop-filter: blur(4px);
            background: rgba(50, 25, 30, 0.35);
            border-radius: 28px;
            padding: 18px 22px 16px;
            border: 1px solid rgba(255, 180, 130, 0.06);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .message-text p {
            margin-bottom: 14px;
            font-weight: 300;
            color: #f0e0d8;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
            font-size: 0.95rem;
        }
        .message-text p:first-of-type {
            color: #fff0e8;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .message-text .highlight {
            color: #f5c8a8;
            font-weight: 500;
            background: rgba(255, 150, 80, 0.10);
            padding: 2px 14px;
            border-radius: 30px;
            display: inline-block;
            border: 1px solid rgba(255, 150, 80, 0.08);
            backdrop-filter: blur(4px);
        }

        .message-text .romantic-line {
            border-left: 3px solid #dba28a;
            padding-left: 18px;
            color: #e0c8be;
            font-style: italic;
            margin-top: 10px;
            font-weight: 300;
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .message-text ul, .message-text ol {
            list-style: none;
            padding: 0;
            margin-top: 6px;
        }

        .message-text ol li {
            padding: 10px 0 10px 40px;
            margin-bottom: 4px;
            color: #f0e0d8;
            font-weight: 300;
            position: relative;
            border-bottom: 1px solid rgba(255, 180, 130, 0.05);
            transition: all 0.2s;
            border-radius: 8px;
            font-size: 0.9rem;
            letter-spacing: 0.2px;
        }

        .message-text ol li::before {
            content: "🕯️";
            position: absolute;
            left: 4px;
            top: 10px;
            font-size: 1rem;
            filter: drop-shadow(0 0 12px rgba(255, 180, 100, 0.3));
        }

        .message-text ol li:last-child {
            border-bottom: none;
        }

        .message-text ol li:hover {
            background: rgba(255, 180, 130, 0.03);
        }

        /* ——— Подпись ——— */
        .signature {
            font-family: 'Great Vibes', cursive;
            font-size: 1.6rem;
            color: #dbb8a8;
            text-align: right;
            margin-top: 4px;
            padding-right: 12px;
            opacity: 0.5;
            text-shadow: 0 0 30px rgba(255, 150, 80, 0.08);
            letter-spacing: 1px;
        }

        /* ——— Адаптив ——— */
        @media (max-width: 420px) {
            .container { padding: 24px 16px 20px; border-radius: 36px; }
            .content-title { font-size: 2.2rem; }
            .message-text { font-size: 0.85rem; padding: 14px 16px; }
            .emoji-big { font-size: 2.2rem; }
            .message-text ol li { padding: 8px 0 8px 34px; font-size: 0.8rem; }
            .signature { font-size: 1.3rem; }
            .corner-decor { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

<!-- Тёплый свет камина -->
<div class="fireplace-glow"></div>

<!-- Плавающие огоньки (светлячки) -->
<div class="firefly"></div>
<div class="firefly"></div>
<div class="firefly"></div>
<div class="firefly"></div>
<div class="firefly"></div>
<div class="firefly"></div>
<div class="firefly"></div>
<div class="firefly"></div>
<div class="firefly"></div>

<!-- Падающие звезды -->
<div class="shooting-star"></div>
<div class="shooting-star"></div>
<div class="shooting-star"></div>
<div class="shooting-star"></div>
<div class="shooting-star"></div>

<!-- Мерцание свечей -->
<div class="candle-light"></div>
<div class="candle-light"></div>
<div class="candle-light"></div>
<div class="candle-light"></div>

<div class="container" id="appContainer">
    <!-- Декоративные элементы углов -->
    <span class="corner-decor">🕯️</span>
    <span class="corner-decor">🕯️</span>
    <span class="corner-decor">🌹</span>
    <span class="corner-decor">🌹</span>

    <!-- ====== Основной экран ====== -->
    <div id="mainScreen" class="content-screen">
        <div class="content-title">06.08.26</div>
        <div class="message-text">
            <p style="text-align: center">Софья Эдуардовна, приглашаю вас пока что в гости.</p>
            <ol>
                <li>Расскажите как съездили в ламоду;</li>
                <li>Ужин - бургеры;</li>
                <li>Расскажите как прошли несколько ваших дней;</li>
                <li>Может быть начнем собирать лего;</li>
                <li>Просто побудем вдвоём;</li>
            </ol>
        </div>
    </div>
</div>

</body>
</html>
