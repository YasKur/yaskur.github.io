<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 20px;
            background: linear-gradient(145deg, #1a0a1e 0%, #2d1b3d 30%, #3d1f3a 60%, #2a1433 100%);
            position: relative;
            overflow-x: hidden;
            font-family: 'Pacifico', sans-serif;
            background-size: cover;
        }

        /* ——— Тёплое вечернее свечение ——— */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                    radial-gradient(ellipse at 50% 80%, rgba(200, 140, 200, 0.15) 0%, transparent 60%),
                    radial-gradient(ellipse at 30% 20%, rgba(180, 120, 200, 0.10) 0%, transparent 50%),
                    radial-gradient(ellipse at 70% 40%, rgba(220, 160, 180, 0.08) 0%, transparent 40%);
            z-index: 0;
            pointer-events: none;
        }

        /* ——— Мерцающие огоньки (декоративные) ——— */
        .candle-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            pointer-events: none;
            z-index: 0;
            animation: flickerGlow 5s ease-in-out infinite alternate;
        }
        .candle-glow:nth-child(1) {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(200, 150, 220, 0.20), transparent 70%);
            bottom: -80px;
            left: -100px;
            animation-delay: 0s;
        }
        .candle-glow:nth-child(2) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(220, 140, 200, 0.18), transparent 70%);
            top: 10px;
            right: -80px;
            animation-delay: 2.5s;
        }
        .candle-glow:nth-child(3) {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(180, 130, 220, 0.15), transparent 70%);
            bottom: 20px;
            right: 20px;
            animation-delay: 1.5s;
        }

        @keyframes flickerGlow {
            0% { opacity: 0.4; transform: scale(1); }
            100% { opacity: 0.9; transform: scale(1.3); }
        }

        /* ——— Падающие звёзды (цветы и луна) ——— */
        .shooting-star {
            position: fixed;
            font-size: 1.4rem;
            opacity: 0.3;
            filter: drop-shadow(0 0 15px rgba(200, 150, 220, 0.4));
            animation: shootStar 14s linear infinite;
            pointer-events: none;
            z-index: 1;
        }
        .shooting-star:nth-child(4) { left: 5%; animation-delay: 0s; font-size: 1.6rem; }
        .shooting-star:nth-child(5) { left: 25%; animation-delay: 4s; font-size: 1.8rem; }
        .shooting-star:nth-child(6) { left: 55%; animation-delay: 7s; font-size: 1.4rem; }
        .shooting-star:nth-child(7) { left: 80%; animation-delay: 10s; font-size: 1.8rem; }
        .shooting-star:nth-child(8) { left: 92%; animation-delay: 2.5s; font-size: 1.2rem; }

        @keyframes shootStar {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0.5); opacity: 0; }
            5% { opacity: 0.6; transform: translateY(0) rotate(10deg) scale(1); }
            25% { opacity: 0.7; transform: translateY(25vh) rotate(20deg) scale(1.1); }
            50% { opacity: 0.4; transform: translateY(55vh) rotate(45deg) scale(0.8); }
            75% { opacity: 0.2; transform: translateY(85vh) rotate(60deg) scale(0.5); }
            100% { opacity: 0; transform: translateY(120vh) rotate(90deg) scale(0); }
        }

        /* ——— Контейнер — лавандово-розовое стекло с перламутровым отливом ——— */
        .container {
            position: relative;
            z-index: 10;
            backdrop-filter: blur(24px) saturate(1.5);
            -webkit-backdrop-filter: blur(24px) saturate(1.5);
            background: rgba(160, 120, 180, 0.20);
            border-radius: 70px 70px 60px 60px;
            padding: 22px 26px 22px;
            max-width: 460px;
            width: 100%;
            box-shadow:
                    0 50px 90px rgba(0, 0, 0, 0.6),
                    0 0 0 1px rgba(200, 170, 220, 0.20),
                    inset 0 1px 0 rgba(220, 190, 240, 0.25),
                    inset 0 -1px 0 rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(200, 170, 220, 0.12);
            transition: all 0.4s ease;
        }

        /* ——— Декоративные элементы (цветы и свечи) ——— */
        .corner-moon {
            position: absolute;
            font-size: 1.8rem;
            opacity: 0.25;
            color: #d4b0d8;
            filter: drop-shadow(0 0 20px rgba(200, 150, 220, 0.3));
            user-select: none;
            pointer-events: none;
            animation: softPulse 5s ease-in-out infinite;
        }
        .corner-moon:nth-child(1) { top: 14px; left: 18px; animation-delay: 0s; }
        .corner-moon:nth-child(2) { top: 14px; right: 18px; animation-delay: 1.2s; }
        .corner-moon:nth-child(3) { bottom: 14px; left: 18px; animation-delay: 0.6s; }
        .corner-moon:nth-child(4) { bottom: 14px; right: 18px; animation-delay: 2s; }

        @keyframes softPulse {
            0%, 100% { transform: scale(0.9) rotate(0deg); opacity: 0.15; }
            50% { transform: scale(1.2) rotate(8deg); opacity: 0.4; }
        }

        /* ——— Основной контент ——— */
        .content-screen {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: center;
            animation: fadeRomance 1.2s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }

        .content-screen.hidden {
            display: none;
        }

        @keyframes fadeRomance {
            0% { opacity: 0; transform: translateY(40px) scale(0.92); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .emoji-big {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 2px;
            filter: drop-shadow(0 0 50px rgba(200, 150, 220, 0.3));
            animation: gentleFloat 6s ease-in-out infinite;
            line-height: 1.2;
            letter-spacing: 10px;
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0) scale(1) rotate(-1deg); }
            50% { transform: translateY(-12px) scale(1.05) rotate(1deg); }
        }

        .content-title {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            font-weight: 400;
            background: linear-gradient(135deg, #f0e4f5, #d8b8e0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 60px rgba(200, 150, 220, 0.15);
            letter-spacing: 2px;
            margin-top: 2px;
        }

        .message-text {
            font-size: 1.05rem;
            color: #f0e6f2;
            line-height: 1.8;
            max-width: 340px;
            margin: 0 auto;
            text-align: left;
            padding: 6px 8px;
            font-weight: 300;
            backdrop-filter: blur(4px);
            background: rgba(100, 60, 120, 0.15);
            border-radius: 32px;
            padding: 20px 22px 18px;
            border: 1px solid rgba(200, 170, 220, 0.08);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .message-text p {
            margin-bottom: 16px;
            font-weight: 300;
            color: #f0e6f2;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
            font-size: 1rem;
        }
        .message-text p:first-of-type {
            color: #f5eaf7;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .message-text .highlight {
            color: #d8b8e0;
            font-weight: 500;
            background: rgba(200, 150, 220, 0.12);
            padding: 2px 16px;
            border-radius: 30px;
            display: inline-block;
            border: 1px solid rgba(200, 150, 220, 0.1);
            backdrop-filter: blur(4px);
            box-shadow: 0 0 30px rgba(200, 150, 220, 0.05);
        }

        .message-text .romantic-line {
            border-left: 3px solid #c8a0d0;
            padding-left: 18px;
            color: #e0d0e5;
            font-style: italic;
            margin-top: 12px;
            font-weight: 300;
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .message-text ul, .message-text ol {
            list-style: none;
            padding: 0;
            margin-top: 6px;
        }

        .message-text ol li {
            padding: 10px 0 10px 40px;
            margin-bottom: 4px;
            color: #f0e6f2;
            font-weight: 300;
            position: relative;
            border-bottom: 1px solid rgba(200, 170, 220, 0.06);
            transition: all 0.2s;
            border-radius: 8px;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
        }

        .message-text ol li::before {
            content: "🌷";
            position: absolute;
            left: 4px;
            top: 10px;
            font-size: 1.1rem;
            filter: drop-shadow(0 0 12px rgba(200, 150, 220, 0.3));
        }

        .message-text ol li:last-child {
            border-bottom: none;
        }

        .message-text ol li:hover {
            background: rgba(200, 170, 220, 0.04);
        }

        /* ——— Подпись ——— */
        .signature {
            font-family: 'Great Vibes', cursive;
            font-size: 1.8rem;
            color: #d8c0dd;
            text-align: right;
            margin-top: 4px;
            padding-right: 12px;
            opacity: 0.5;
            text-shadow: 0 0 30px rgba(200, 150, 220, 0.1);
            letter-spacing: 1px;
        }

        /* ——— Стили для экрана входа ——— */
        .password-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 14px 0 6px;
        }

        .password-screen.hidden {
            display: none;
        }

        .password-input {
            background: rgba(200, 170, 220, 0.08);
            border: 1px solid rgba(200, 170, 220, 0.20);
            border-radius: 50px;
            padding: 14px 22px;
            width: 100%;
            max-width: 240px;
            font-size: 1.2rem;
            text-align: center;
            color: #f0e6f2;
            backdrop-filter: blur(8px);
            outline: none;
            transition: 0.3s;
            font-family: 'Quicksand', sans-serif;
            letter-spacing: 4px;
        }
        .password-input:focus {
            border-color: #d8b8e0;
            box-shadow: 0 0 30px rgba(200, 150, 220, 0.15);
            background: rgba(200, 170, 220, 0.12);
        }
        .password-input::placeholder {
            color: rgba(240, 230, 242, 0.3);
            letter-spacing: 2px;
            font-size: 0.85rem;
            font-weight: 300;
        }

        .password-btn {
            background: rgba(200, 170, 220, 0.08);
            border: 1px solid rgba(200, 170, 220, 0.15);
            border-radius: 50px;
            padding: 12px 44px;
            font-size: 1.2rem;
            font-family: 'Great Vibes', cursive;
            color: #f0e6f2;
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 30px rgba(200, 150, 220, 0.02);
            letter-spacing: 2px;
        }
        .password-btn:hover {
            background: rgba(200, 170, 220, 0.15);
            border-color: #d8b8e0;
            box-shadow: 0 0 40px rgba(200, 150, 220, 0.1);
            transform: scale(1.02);
        }
        .password-btn:active {
            transform: scale(0.96);
        }

        .password-error {
            color: #e8b0d0;
            font-size: 0.8rem;
            font-family: 'Quicksand', sans-serif;
            opacity: 0.7;
            min-height: 1.4em;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* ——— Кнопка-ссылка ——— */
        .link-btn {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 32px;
            background: rgba(200, 170, 220, 0.08);
            border: 1px solid rgba(200, 170, 220, 0.15);
            border-radius: 50px;
            color: #f0e6f2;
            font-family: 'Great Vibes', cursive;
            font-size: 1.2rem;
            text-decoration: none;
            backdrop-filter: blur(8px);
            transition: 0.3s;
            letter-spacing: 1px;
            box-shadow: 0 0 30px rgba(200, 150, 220, 0.02);
            cursor: pointer;
        }
        .link-btn:hover {
            background: rgba(200, 170, 220, 0.15);
            border-color: #d8b8e0;
            box-shadow: 0 0 40px rgba(200, 150, 220, 0.1);
            transform: scale(1.02);
        }
        .link-btn:active {
            transform: scale(0.96);
        }

        /* ——— Адаптив ——— */
        @media (max-width: 420px) {
            .container { padding: 30px 14px 22px; border-radius: 44px; }
            .content-title { font-size: 2.2rem; }
            .message-text { font-size: 0.9rem; padding: 14px 16px; }
            .emoji-big { font-size: 2rem; }
            .message-text ol li { padding: 8px 0 8px 34px; font-size: 0.85rem; }
            .signature { font-size: 1.4rem; }
            .corner-moon { font-size: 1.2rem; }
            .password-input { max-width: 200px; font-size: 1rem; padding: 12px 16px; }
        }
    </style>
</head>
<body>

<!-- Тёплое свечение -->
<div class="candle-glow"></div>
<div class="candle-glow"></div>
<div class="candle-glow"></div>

<!-- Падающие звёзды (цветы, луна, искры) -->
<span class="shooting-star">🌸</span>
<span class="shooting-star">🌙</span>
<span class="shooting-star">✨</span>
<span class="shooting-star">🌺</span>
<span class="shooting-star">⭐</span>

<div class="container" id="appContainer">
    <!-- Декоративные элементы (цветы / свечи) -->
    <span class="corner-moon">🌷</span>
    <span class="corner-moon">🌙</span>
    <span class="corner-moon">🌹</span>
    <span class="corner-moon">✨</span>

    <!-- ====== ЭКРАН ВВОДА ПАРОЛЯ ====== -->
    <div id="passwordScreen" class="content-screen password-screen">
        <div class="content-title" style="font-size:2.2rem;">Введите пароль</div>
        <input type="password" id="passwordInput" class="password-input" placeholder="••••" maxlength="10" autofocus>
        <button id="unlockBtn" class="password-btn">Открыть</button>
        <div id="errorMsg" class="password-error"></div>
    </div>

    <!-- ====== ОСНОВНОЙ ЭКРАН ====== -->
    <div id="mainScreen" class="content-screen hidden">
        <span class="emoji-big">🌷🌷🌷</span>
        <div class="content-title"></div>
        <div class="message-text">
            <p>Хэй, какой хороший день, чтобы подарить цветов.</p>
            <p>В целом все произошло с 5 на 6, поэтому как-то так.</p>
            <p>Спасибо вам, что появились в моей жизни.</p>
            <div class="romantic-line">
                Стихи я писать не умею, а делегировать я научился, Ваня Дмитриенко сделает все за меня.
            </div>
            <!-- Кнопка-ссылка -->
            <div style="text-align: center; margin-top: 18px;">
                <a href="https://www.instagram.com/reel/DblP4Z0NuTx/?igsh=NGlnd2F4djAzamZk" target="_blank" class="link-btn" id="magicLink">✨ Перейти ✨</a>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const passwordScreen = document.getElementById('passwordScreen');
        const mainScreen = document.getElementById('mainScreen');
        const passwordInput = document.getElementById('passwordInput');
        const unlockBtn = document.getElementById('unlockBtn');
        const errorMsg = document.getElementById('errorMsg');
        const bodyElement = document.querySelector('body');
        const CORRECT_PASSWORD = '2909';

        function showMainScreen() {
            passwordScreen.classList.add('hidden');
            mainScreen.classList.remove('hidden');
            mainScreen.style.animation = 'none';
            requestAnimationFrame(() => {
                mainScreen.style.animation = 'fadeRomance 1.2s cubic-bezier(0.2, 0.9, 0.3, 1) forwards';
            });
            errorMsg.textContent = '';
            passwordInput.value = '';
            document.body.style.backgroundImage = "url('123.jpg')";
        }

        function handleUnlock() {
            const entered = passwordInput.value.trim();
            if (entered === CORRECT_PASSWORD) {
                showMainScreen();
            } else {
                errorMsg.textContent = '❀ Неверный пароль, попробуйте снова ❀';
                passwordInput.value = '';
                passwordInput.focus();
                passwordInput.style.transform = 'scale(0.96)';
                setTimeout(() => { passwordInput.style.transform = ''; }, 200);
            }
        }

        unlockBtn.addEventListener('click', handleUnlock);

        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleUnlock();
            }
        });

        window.addEventListener('load', () => {
            passwordInput.focus();
        });

    })();
</script>

</body>
</html>
