<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Найди кроссовки дома</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Rubik:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100vh;
            min-height: 100dvh;
        }

        body {
            background: #0e0e1a;
            font-family: 'Rubik', sans-serif;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 1.2rem;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* ---- Анимированный фон ---- */
        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-canvas .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            animation: floatOrb 16s infinite alternate ease-in-out;
        }

        .orb:nth-child(1) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #ffaa44, #883300);
            top: -15%;
            left: -10%;
            animation-duration: 18s;
        }

        .orb:nth-child(2) {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #44aaff, #003388);
            bottom: -20%;
            right: -10%;
            animation-duration: 20s;
            animation-delay: 2s;
        }

        .orb:nth-child(3) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #ff66aa, #881144);
            top: 30%;
            left: 55%;
            animation-duration: 14s;
            animation-delay: 4s;
        }

        .orb:nth-child(4) {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #66ff88, #118833);
            bottom: 25%;
            left: 5%;
            animation-duration: 22s;
            animation-delay: 1s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(80px, -50px) scale(1.1); }
            50% { transform: translate(-40px, 70px) scale(0.9); }
            75% { transform: translate(50px, 30px) scale(1.05); }
            100% { transform: translate(-30px, -60px) scale(1); }
        }

        .bg-canvas::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                    linear-gradient(rgba(255,255,240,0.02) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,240,0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        /* ---- Карточка ---- */
        .card {
            max-width: 560px;
            width: 100%;
            background: rgba(16, 14, 26, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 56px 56px 40px 40px;
            padding: 2rem 1.8rem 2.6rem;
            border: 2px solid #f0b060;
            box-shadow: 0 0 80px rgba(200, 120, 40, 0.15), inset 0 0 40px rgba(200, 120, 40, 0.05);
            position: relative;
            z-index: 10;
            animation: borderBreath 4s infinite alternate ease-in-out;
            text-align: center;
            margin: auto;
        }

        @keyframes borderBreath {
            0% { border-color: #d48a3a; box-shadow: 0 0 40px rgba(200, 120, 40, 0.10); }
            100% { border-color: #f8c878; box-shadow: 0 0 90px rgba(220, 160, 60, 0.30); }
        }

        /* Шапка */
        .alert-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            background: #141126;
            border-radius: 100px;
            padding: 0.5rem 1.4rem;
            margin-bottom: 1.6rem;
            border: 1px solid #d48a3a;
            box-shadow: 0 0 30px rgba(200, 120, 40, 0.12);
            animation: headerFlick 2.4s infinite alternate;
            flex-shrink: 0;
        }

        @keyframes headerFlick {
            0% { opacity: 0.7; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }

        .alert-header span {
            font-size: 1.8rem;
            line-height: 1;
        }

        .alert-header h2 {
            font-family: 'Rubik Mono One', monospace;
            color: #fadc9a;
            text-shadow: 0 0 15px #cc8833, 0 0 30px #aa6622;
            font-size: 1.1rem;
            letter-spacing: 0.08em;
            font-weight: 700;
        }

        /* Заголовок */
        h1 {
            font-family: 'Rubik Mono One', monospace;
            color: #f5ebd0;
            text-shadow: 0 0 25px #cc8833, 0 0 55px #aa6622, 0 4px 0 #4a2a10;
            line-height: 1.2;
            margin: 0.2rem 0 0.4rem;
            letter-spacing: 0.02em;
            word-break: break-word;
            font-size: 2.3rem;
        }

        .subhead {
            font-size: clamp(1.0rem, 3.8vw, 1.4rem);
            font-weight: 700;
            color: #ecd8b0;
            background: rgba(60, 40, 20, 0.4);
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            display: inline-block;
            backdrop-filter: blur(4px);
            border: 1px solid #d48a3a;
            margin-bottom: 1.2rem;
            box-shadow: 0 0 25px rgba(200, 120, 40, 0.08);
            flex-shrink: 0;
        }

        /* Фото — комната / интерьер */
        .room-image {
            margin: 0.2rem 0 1.2rem;
            border-radius: 32px;
            overflow: hidden;
            border: 2px solid #d48a3a;
            box-shadow: 0 0 50px rgba(200, 120, 40, 0.15);
            background: #141126;
            position: relative;
            width: 100%;
            flex-shrink: 0;
        }

        .room-image img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 420px;
            object-fit: contain;
            background: #1a172e;
            transition: transform 0.4s ease;
        }

        .room-image img:hover {
            transform: scale(1.01);
        }

        /* Метка "спрятаны здесь" поверх фото */
        .photo-hint {
            position: absolute;
            bottom: 12px;
            right: 16px;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(6px);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #fadc9a;
            border: 1px solid #d48a3a;
            letter-spacing: 0.04em;
            pointer-events: none;
        }

        /* Описание */
        .description {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #ddd0c0;
            background: rgba(20, 17, 38, 0.6);
            padding: 1.2rem 1.2rem;
            border-radius: 32px;
            border-left: 4px solid #d48a3a;
            border-right: 4px solid #d48a3a;
            margin: 1.0rem 0 1.6rem;
            text-align: left;
            backdrop-filter: blur(4px);
            box-shadow: inset 0 0 20px rgba(200, 120, 40, 0.04);
            flex-shrink: 0;
        }

        .description strong {
            color: #fadc9a;
            font-weight: 900;
            text-shadow: 0 0 12px #cc8833;
        }

        .description .emoji-big {
            font-size: 1.8rem;
            display: inline-block;
            margin-right: 0.2rem;
        }

        /* Блок с подсказками */
        .clue-box {
            background: #141126;
            border-radius: 60px;
            padding: 1.4rem 1.2rem;
            border: 2px dashed #d48a3a;
            margin: 1.2rem 0 1.2rem;
            box-shadow: 0 0 40px rgba(200, 120, 40, 0.06);
            flex-shrink: 0;
        }

        .clue-box .clue-title {
            font-family: 'Rubik Mono One', monospace;
            font-size: 1.4rem;
            color: #ecd8b0;
            text-shadow: 0 0 20px #cc8833;
            letter-spacing: 0.04em;
        }

        .clue-box .clue-list {
            margin-top: 0.6rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem 0.8rem;
        }

        .clue-box .clue-item {
            background: #1f1a3a;
            padding: 0.4rem 1.0rem;
            border-radius: 40px;
            border: 1px solid #b08040;
            font-size: 0.95rem;
            font-weight: 700;
            color: #ecd8b0;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .clue-box .clue-item span {
            font-size: 1.2rem;
        }

        .clue-box .time-hint {
            margin-top: 0.8rem;
            font-size: 0.95rem;
            color: #b0a090;
            background: #1a172e;
            border-radius: 40px;
            padding: 0.3rem 0.8rem;
            border: 1px solid #6a5a4a;
            display: inline-block;
        }

        /* Бейдж награды */
        .reward-badge {
            background: #1f1a3a;
            border-radius: 40px;
            padding: 0.4rem 1.8rem;
            display: inline-block;
            border: 1px solid #f0b060;
            margin-top: 0.2rem;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fadc9a;
            text-shadow: 0 0 15px #cc8833;
            animation: glowBadge 2.2s infinite alternate;
            flex-shrink: 0;
        }

        @keyframes glowBadge {
            0% { box-shadow: 0 0 10px rgba(200, 120, 40, 0.15); }
            100% { box-shadow: 0 0 40px rgba(200, 120, 40, 0.40); }
        }

        /* Футер */
        .footer-note {
            margin-top: 2rem;
            color: #9a8a7a;
            font-weight: 700;
            font-size: 1rem;
            border-top: 2px solid #2a223a;
            padding-top: 1.4rem;
            opacity: 0.9;
            letter-spacing: 0.04em;
            text-shadow: 0 0 8px #1a1220;
            flex-shrink: 0;
        }

        .footer-note strong {
            color: #ecd8b0;
            text-shadow: 0 0 15px #cc8833;
        }

        .footer-note .small-emoji {
            font-size: 1.4rem;
            display: inline-block;
            animation: shake 1.2s infinite alternate;
        }

        @keyframes shake {
            0% { transform: rotate(-3deg) scale(1); }
            100% { transform: rotate(3deg) scale(1.05); }
        }

        /* Адаптив */
        @media (max-width: 450px) {
            .card { padding: 1.6rem 1.0rem 2.0rem; }
            .alert-header h2 { font-size: 0.9rem; }
            .alert-header span { font-size: 1.4rem; }
            h1 { font-size: 1.8rem; }
            .description { font-size: 0.95rem; padding: 0.9rem; }
            .clue-box .clue-title { font-size: 1.2rem; }
            .clue-box .clue-item { font-size: 0.85rem; padding: 0.3rem 0.8rem; }
            .room-image img { max-height: 280px; }
        }

        @media (max-width: 380px) {
            .card { padding: 1.0rem 0.6rem 1.6rem; }
            h1 { font-size: 1.5rem; }
            .room-image img { max-height: 220px; }
        }

        .glow {
            animation: glowPulse 2.6s infinite alternate;
        }

        @keyframes glowPulse {
            0% { text-shadow: 0 0 8px #aa6622, 0 0 20px #884411; }
            100% { text-shadow: 0 0 30px #eebb55, 0 0 60px #cc8833, 0 0 90px #aa6622; }
        }
    </style>
</head>
<body>

<!-- Фоновые "домашние" блики -->
<div class="bg-canvas">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
</div>

<div class="card">

    <!-- Шапка -->
    <div class="alert-header">
        <span>🔎</span>
        <h2>🏠 ДОМАШНИЙ РОЗЫСК</h2>
        <span>🔎</span>
    </div>

    <!-- Заголовок -->
    <h1 class="glow">ГДЕ ЖЕ Жорики?</h1>

    <div class="subhead">👟👟👟</div>

    <!-- Фото интерьера -->
    <div class="room-image">
        <img src="jor.jpg"
                alt="Комната, где спрятаны кроссовки"
             title="Ищи кроссовки на фото!" />
        <div class="photo-hint">👟 спрятаны здесь</div>
    </div>

    <!-- Описание -->
    <div class="description">
        <span class="emoji-big">🕵️</span>
        <strong>Кроссовки спрятаны где-то дома!</strong>
        Софья Эдуардовна, внимательно изучите фото — они могут быть на полке, под креслом, за шторой или в неожиданном месте.
    </div>

    <!-- Футер -->
    <div class="footer-note">
        <span class="small-emoji">👟</span>
        <strong>НАЙДИ И ЗАБЕРИ</strong>
        <span class="small-emoji">👟</span><br />
        <span style="font-size: 0.85rem; opacity: 0.7;">Операция “Домашний след”</span>
    </div>

</div>
</body>
</html>
