<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Осень</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@300;400;600&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Pacifico', cursive;
            position: relative;
            overflow-x: hidden;
            background: #d4b48c; /* fallback */
        }

        /* ——— ОСЕННИЙ ФОН (тёплый градиент + листопад) ——— */
        .autumn-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at 30% 40%, #f7d9aa, #c99b6b 55%, #a67b4c 90%);
            overflow: hidden;
        }

        /* ——— ЛИСТЬЯ (падающие) ——— */
        .leaf {
            position: absolute;
            font-size: 2.2rem;
            z-index: 1;
            pointer-events: none;
            opacity: 0.7;
            animation: leafFall calc(14s + var(--d, 0s)) linear infinite;
            filter: drop-shadow(0 8px 20px rgba(160, 90, 20, 0.25));
            transform-origin: center;
        }
        .leaf:nth-child(1) { left: 5%; top: -8%; --d: 0s; animation-duration: 16s; font-size: 2.8rem; }
        .leaf:nth-child(2) { left: 15%; top: -12%; --d: -4s; animation-duration: 19s; font-size: 2rem; }
        .leaf:nth-child(3) { left: 28%; top: -5%; --d: -8s; animation-duration: 14s; font-size: 3.2rem; }
        .leaf:nth-child(4) { left: 45%; top: -18%; --d: -2s; animation-duration: 17s; font-size: 2.5rem; }
        .leaf:nth-child(5) { left: 62%; top: -10%; --d: -6s; animation-duration: 20s; font-size: 2rem; }
        .leaf:nth-child(6) { left: 78%; top: -15%; --d: -10s; animation-duration: 15s; font-size: 3rem; }
        .leaf:nth-child(7) { left: 88%; top: -6%; --d: -3s; animation-duration: 18s; font-size: 2.3rem; }
        .leaf:nth-child(8) { left: 35%; top: -22%; --d: -7s; animation-duration: 22s; font-size: 2.7rem; }
        .leaf:nth-child(9) { left: 55%; top: -25%; --d: -5s; animation-duration: 16s; font-size: 2.1rem; }
        .leaf:nth-child(10) { left: 72%; top: -30%; --d: -9s; animation-duration: 19s; font-size: 3.4rem; }

        @keyframes leafFall {
            0% { transform: translate(0, 0) rotate(0deg) scale(0.8); opacity: 0.5; }
            10% { transform: translate(40px, 12vh) rotate(25deg) scale(1.1); opacity: 0.9; }
            25% { transform: translate(-20px, 30vh) rotate(-15deg) scale(0.9); }
            40% { transform: translate(60px, 50vh) rotate(40deg) scale(1.0); opacity: 0.7; }
            60% { transform: translate(-30px, 70vh) rotate(-20deg) scale(0.85); }
            80% { transform: translate(20px, 90vh) rotate(30deg) scale(1.05); opacity: 0.5; }
            100% { transform: translate(-10px, 110vh) rotate(10deg) scale(0.8); opacity: 0.2; }
        }

        /* ——— ОСЕННИЕ ОБЛАКА (более тёплые, плывут медленнее) ——— */
        .cloud {
            position: absolute;
            background: rgba(245, 215, 175, 0.55);
            border-radius: 1000px;
            box-shadow: 0 20px 40px rgba(180, 120, 60, 0.2);
            animation: cloudDrift calc(35s + var(--d, 0s)) linear infinite;
            z-index: 1;
            pointer-events: none;
            backdrop-filter: blur(6px);
        }
        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
            box-shadow: inherit;
        }
        .cloud-1 {
            width: 260px; height: 75px;
            top: 6%; left: -12%;
            --d: 0s;
            animation-duration: 38s;
        }
        .cloud-1::before {
            width: 110px; height: 110px;
            top: -55px; left: 25px;
        }
        .cloud-1::after {
            width: 150px; height: 130px;
            top: -65px; left: 90px;
        }

        .cloud-2 {
            width: 300px; height: 85px;
            top: 20%; left: 15%;
            --d: -8s;
            animation-duration: 44s;
            opacity: 0.5;
        }
        .cloud-2::before {
            width: 140px; height: 140px;
            top: -75px; left: 35px;
        }
        .cloud-2::after {
            width: 180px; height: 150px;
            top: -85px; left: 110px;
        }

        .cloud-3 {
            width: 200px; height: 65px;
            top: 4%; left: 55%;
            --d: -14s;
            animation-duration: 32s;
            opacity: 0.45;
        }
        .cloud-3::before {
            width: 100px; height: 100px;
            top: -50px; left: 20px;
        }
        .cloud-3::after {
            width: 130px; height: 120px;
            top: -60px; left: 70px;
        }

        .cloud-4 {
            width: 340px; height: 90px;
            top: 35%; left: -25%;
            --d: -11s;
            animation-duration: 50s;
            opacity: 0.4;
        }
        .cloud-4::before {
            width: 160px; height: 150px;
            top: -85px; left: 45px;
        }
        .cloud-4::after {
            width: 200px; height: 170px;
            top: -95px; left: 130px;
        }

        @keyframes cloudDrift {
            0% { transform: translateX(0) scale(0.95); }
            50% { transform: translateX(calc(100vw + 300px)) scale(1.02); }
            100% { transform: translateX(calc(200vw + 400px)) scale(0.95); }
        }

        /* ——— ТЫКВЫ / ОСЕННИЕ ЭЛЕМЕНТЫ (анимированные) ——— */
        .fall-decor {
            position: absolute;
            font-size: 2.8rem;
            z-index: 2;
            pointer-events: none;
            animation: floatDecor calc(10s + var(--d, 0s)) ease-in-out infinite;
            filter: drop-shadow(0 8px 25px rgba(200, 120, 40, 0.3));
            text-shadow: 0 0 30px rgba(200, 150, 50, 0.2);
        }
        .fall-decor-1 { left: 3%; top: 45%; --d: 0s; animation-duration: 12s; }
        .fall-decor-2 { left: 20%; top: 25%; --d: -3s; animation-duration: 10s; font-size: 2.4rem; }
        .fall-decor-3 { left: 80%; top: 18%; --d: -6s; animation-duration: 14s; font-size: 3.2rem; }
        .fall-decor-4 { left: 90%; top: 55%; --d: -9s; animation-duration: 11s; font-size: 2.6rem; }
        .fall-decor-5 { left: 48%; top: 12%; --d: -2s; animation-duration: 13s; font-size: 2.2rem; }
        .fall-decor-6 { left: 68%; top: 65%; --d: -7s; animation-duration: 9s; font-size: 3rem; }

        @keyframes floatDecor {
            0% { transform: translateY(0) rotate(0deg) scale(0.9); }
            30% { transform: translateY(-30px) rotate(8deg) scale(1.1); }
            60% { transform: translateY(15px) rotate(-6deg) scale(0.95); }
            85% { transform: translateY(-20px) rotate(5deg) scale(1.05); }
            100% { transform: translateY(0) rotate(0deg) scale(0.9); }
        }

        /* ——— МАТОВОЕ СТЕКЛО (контейнер) ——— тёплый оттенок */
        .container {
            position: relative;
            z-index: 30;
            backdrop-filter: blur(16px) saturate(1.3);
            -webkit-backdrop-filter: blur(16px) saturate(1.3);
            background: rgba(245, 225, 195, 0.45);
            border-radius: 60px 60px 40px 40px;
            padding: 28px 30px 24px;
            max-width: 440px;
            width: 100%;
            box-shadow:
                    0 30px 60px rgba(140, 90, 40, 0.3),
                    0 0 0 1px rgba(215, 180, 140, 0.5),
                    inset 0 1px 0 rgba(255, 235, 200, 0.7);
            border: 1px solid rgba(255, 215, 170, 0.5);
            transition: all 0.3s ease;
        }

        /* ——— Декор (осенние листочки / ягодки) ——— */
        .corner-decor {
            position: absolute;
            font-size: 1.9rem;
            opacity: 0.7;
            filter: drop-shadow(0 0 20px rgba(200, 130, 50, 0.25));
            user-select: none;
            pointer-events: none;
            animation: decorFloat 10s ease-in-out infinite;
            color: #b87a3e;
        }
        .corner-decor:nth-child(1) { top: 16px; left: 18px; animation-delay: 0s; }
        .corner-decor:nth-child(2) { top: 16px; right: 18px; animation-delay: 2.8s; color: #c97c4a; }
        .corner-decor:nth-child(3) { bottom: 16px; left: 18px; animation-delay: 5.2s; color: #a87b4e; }
        .corner-decor:nth-child(4) { bottom: 16px; right: 18px; animation-delay: 1.8s; color: #bf7f4b; }

        @keyframes decorFloat {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.5; }
            30% { transform: translateY(-20px) rotate(12deg) scale(1.2); opacity: 0.9; }
            70% { transform: translateY(10px) rotate(-8deg) scale(0.9); opacity: 0.6; }
            90% { transform: translateY(-14px) rotate(16deg) scale(1.05); opacity: 0.8; }
        }

        /* ——— Содержимое ——— */
        .content-screen {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: center;
            animation: fadeIn 1.0s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(30px) scale(0.92); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .content-title {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            font-weight: 400;
            background: linear-gradient(135deg, #a5612a, #7a451f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 60px rgba(180, 110, 40, 0.3);
            letter-spacing: 2px;
            margin-top: 0px;
        }

        .message-text {
            font-size: 1rem;
            color: #4a2e1a;
            line-height: 1.7;
            max-width: 340px;
            margin: 0 auto;
            text-align: left;
            font-weight: 300;
            backdrop-filter: blur(10px);
            background: rgba(235, 205, 175, 0.5);
            border-radius: 40px;
            padding: 20px 24px 18px;
            border: 1px solid rgba(200, 160, 120, 0.4);
            box-shadow: inset 0 1px 0 rgba(255, 225, 190, 0.6);
        }

        .message-text p {
            margin-bottom: 14px;
            font-weight: 400;
            color: #3f2b17;
            text-shadow: 0 2px 12px rgba(190, 150, 100, 0.2);
            font-size: 0.95rem;
        }
        .message-text p:first-of-type {
            color: #7a4f2a;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .message-text ol {
            list-style: none;
            padding: 0;
            margin-top: 4px;
        }

        .message-text ol li {
            padding: 12px 0 12px 46px;
            margin-bottom: 4px;
            color: #3f2b17;
            font-weight: 400;
            position: relative;
            border-bottom: 1px solid rgba(160, 120, 80, 0.2);
            transition: all 0.2s;
            border-radius: 12px;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
        }

        .message-text ol li::before {
            content: "🍂";
            position: absolute;
            left: 6px;
            top: 10px;
            font-size: 1.5rem;
            filter: drop-shadow(0 0 20px rgba(200, 130, 50, 0.25));
        }

        .message-text ol li:last-child {
            border-bottom: none;
        }

        .message-text ol li:hover {
            background: rgba(180, 130, 70, 0.15);
        }

        /* ——— ЗОНА С КАРТИНКОЙ (осенняя прогулка) ——— */
        .image-zone {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 2px dashed rgba(160, 120, 70, 0.3);
            text-align: center;
        }

        .image-zone .image-wrapper {
            border-radius: 30px;
            overflow: hidden;
            background: rgba(200, 170, 130, 0.25);
            border: 2px solid rgba(180, 140, 90, 0.25);
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(120, 80, 40, 0.15);
        }

        .image-zone .image-wrapper img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 300px;
            object-fit: cover;
            transition: all 0.3s ease;
        }

        .image-zone .image-wrapper:hover {
            border-color: rgba(180, 130, 70, 0.6);
            box-shadow: 0 8px 40px rgba(140, 100, 50, 0.25);
        }

        .image-zone .image-caption {
            font-family: 'Quicksand', sans-serif;
            font-size: 0.75rem;
            color: #7a5f3a;
            opacity: 0.6;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        /* ——— Адаптив ——— */
        @media (max-width: 420px) {
            .container { padding: 24px 16px 20px; border-radius: 44px; }
            .content-title { font-size: 2.3rem; }
            .message-text { font-size: 0.85rem; padding: 16px 18px; }
            .message-text ol li { padding: 10px 0 10px 42px; font-size: 0.85rem; }
            .corner-decor { font-size: 1.5rem; }
            .leaf { font-size: 1.8rem !important; }
            .fall-decor { font-size: 2rem !important; }
            .cloud-1, .cloud-2, .cloud-3, .cloud-4 { transform: scale(0.7); }
            .image-zone .image-wrapper img { max-height: 200px; }
        }
    </style>
</head>
<body>

<!-- ОСЕННИЙ ФОН + ЛИСТЬЯ + ОБЛАКА + ТЫКВЫ -->
<div class="autumn-bg">
    <!-- падающие листья -->
    <div class="leaf">🍁</div>
    <div class="leaf">🍂</div>
    <div class="leaf">🍁</div>
    <div class="leaf">🍂</div>
    <div class="leaf">🍁</div>
    <div class="leaf">🍂</div>
    <div class="leaf">🍁</div>
    <div class="leaf">🍂</div>
    <div class="leaf">🍁</div>
    <div class="leaf">🍂</div>

    <!-- облака (осенние) -->
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="cloud cloud-4"></div>

    <!-- осенний декор (тыквы, грибы, ягоды) -->
    <div class="fall-decor fall-decor-1">🎃</div>
    <div class="fall-decor fall-decor-2">🍄</div>
    <div class="fall-decor fall-decor-3">🎃</div>
    <div class="fall-decor fall-decor-4">🍂</div>
    <div class="fall-decor fall-decor-5">🌰</div>
    <div class="fall-decor fall-decor-6">🍁</div>
</div>

<!-- ОСНОВНОЙ КОНТЕЙНЕР -->
<div class="container" id="appContainer">
    <span class="corner-decor">🍁</span>
    <span class="corner-decor">🌾</span>
    <span class="corner-decor">🍂</span>
    <span class="corner-decor">🌻</span>

    <div id="mainScreen" class="content-screen">
        <div class="content-title">Осень не время грусти 🍁</div>
        <div class="message-text">
            <p style="text-align: center">Софья Эдуардовна, предлагаю вам планы на неделю</p>
            <ol>
                <li>Играем в падел</li>
                <li>Ходим гулять</li>
                <li>Сходим покушать в руф в конце недели</li>
                <li>Попробуем поиграть в хогварц легаси</li>
                <li>Балдеть от жизни</li>
            </ol>
        </div>
        <div class="romantic-footer">✨ Вы самая лучшая ✨</div>
    </div>
</div>

</body>
</html>
