<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Приглашение на прогулку 🍂</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Comfortaa:wght@400;600;700&family=Lobster&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Comfortaa', cursive;
            position: relative;
            overflow-x: hidden;
            background: #2b1b0e;
        }

        /* ===== ОСЕННИЙ ФОН ===== */
        .autumn-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                    radial-gradient(ellipse at 30% 20%, #5c3a1e 0%, #2b1b0e 50%, #1a0f07 100%);
            overflow: hidden;
        }

        /* ——— Тёплое свечение (как солнце сквозь тучи) ——— */
        .sun-glow {
            position: absolute;
            top: -15%;
            left: 20%;
            width: 140%;
            height: 80%;
            background: radial-gradient(ellipse at 30% 10%, rgba(255, 200, 100, 0.18), rgba(255, 160, 60, 0.05) 40%, transparent 70%);
            pointer-events: none;
            z-index: 1;
            animation: sunPulse 8s ease-in-out infinite;
        }

        @keyframes sunPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        /* ——— Волны света (широкие полосы) ——— */
        .light-wave {
            position: absolute;
            width: 200%;
            height: 300px;
            left: -50%;
            pointer-events: none;
            z-index: 1;
            filter: blur(60px);
            opacity: 0.35;
        }

        .wave-1 {
            top: 10%;
            background: linear-gradient(90deg, transparent, rgba(255, 180, 80, 0.35), transparent);
            animation: waveMove 18s ease-in-out infinite alternate;
        }

        .wave-2 {
            top: 45%;
            background: linear-gradient(90deg, transparent, rgba(220, 130, 50, 0.3), transparent);
            animation: waveMove 24s ease-in-out infinite alternate-reverse;
        }

        .wave-3 {
            top: 75%;
            background: linear-gradient(90deg, transparent, rgba(255, 210, 140, 0.25), transparent);
            animation: waveMove 30s ease-in-out infinite alternate;
            animation-delay: -8s;
        }

        @keyframes waveMove {
            0%   { transform: translateX(-8%) skewY(-2deg); opacity: 0.2; }
            100% { transform: translateX(8%) skewY(2deg); opacity: 0.45; }
        }

        /* ——— Туманные полосы ——— */
        .fog-band {
            position: absolute;
            width: 160%;
            height: 120px;
            left: -30%;
            pointer-events: none;
            z-index: 1;
            filter: blur(40px);
            border-radius: 50%;
        }

        .fog-1 {
            top: 20%;
            background: radial-gradient(ellipse, rgba(255, 200, 130, 0.12), transparent 70%);
            animation: fogDrift 20s ease-in-out infinite alternate;
        }

        .fog-2 {
            top: 55%;
            background: radial-gradient(ellipse, rgba(200, 140, 80, 0.1), transparent 70%);
            animation: fogDrift 26s ease-in-out infinite alternate-reverse;
            animation-delay: -6s;
        }

        .fog-3 {
            top: 80%;
            background: radial-gradient(ellipse, rgba(255, 220, 160, 0.08), transparent 70%);
            animation: fogDrift 32s ease-in-out infinite alternate;
            animation-delay: -12s;
        }

        @keyframes fogDrift {
            0%   { transform: translateX(-6%) scaleY(1); opacity: 0.5; }
            100% { transform: translateX(6%) scaleY(1.2); opacity: 0.9; }
        }

        /* ——— Падающие листья ——— */
        .leaf {
            position: absolute;
            top: -10vh;
            opacity: 0;
            z-index: 3;
            pointer-events: none;
            will-change: transform, opacity;
            animation: leafFall var(--leaf-dur, 14s) linear infinite;
            filter: drop-shadow(0 0 12px rgba(255, 180, 70, 0.7));
        }

        /* Базовые позиции для статичных листьев */
        .leaf:nth-child(1)  { left: 4%;  animation-delay: 0s;    --leaf-dur: 14s; font-size: 1.3rem; }
        .leaf:nth-child(2)  { left: 12%; animation-delay: 2.5s;  --leaf-dur: 17s; font-size: 1.7rem; }
        .leaf:nth-child(3)  { left: 22%; animation-delay: 6s;    --leaf-dur: 15s; font-size: 1.1rem; }
        .leaf:nth-child(4)  { left: 33%; animation-delay: 1s;    --leaf-dur: 19s; font-size: 1.9rem; }
        .leaf:nth-child(5)  { left: 45%; animation-delay: 8s;    --leaf-dur: 13s; font-size: 1.4rem; }
        .leaf:nth-child(6)  { left: 56%; animation-delay: 4s;    --leaf-dur: 18s; font-size: 1.6rem; }
        .leaf:nth-child(7)  { left: 68%; animation-delay: 10s;   --leaf-dur: 16s; font-size: 1.2rem; }
        .leaf:nth-child(8)  { left: 78%; animation-delay: 3s;    --leaf-dur: 20s; font-size: 1.5rem; }
        .leaf:nth-child(9)  { left: 88%; animation-delay: 12s;   --leaf-dur: 14s; font-size: 1.0rem; }
        .leaf:nth-child(10) { left: 95%; animation-delay: 5.5s;  --leaf-dur: 17s; font-size: 1.8rem; }

        @keyframes leafFall {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg) scale(0.9);
                opacity: 0;
            }
            8% {
                opacity: 0.75;
            }
            50% {
                transform: translateY(50vh) translateX(30px) rotate(180deg) scale(1);
                opacity: 0.7;
            }
            92% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(110vh) translateX(-20px) rotate(360deg) scale(1.1);
                opacity: 0;
            }
        }

        /* ——— Падающие маленькие листики (глубина) ——— */
        .leaf-small {
            position: absolute;
            top: -5vh;
            opacity: 0;
            z-index: 2;
            pointer-events: none;
            will-change: transform, opacity;
            animation: leafSmallFall var(--leaf-dur, 18s) linear infinite;
            filter: drop-shadow(0 0 6px rgba(255, 180, 70, 0.4));
        }

        @keyframes leafSmallFall {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.5; }
            50% {
                transform: translateY(55vh) translateX(-25px) rotate(240deg);
                opacity: 0.45;
            }
            90% { opacity: 0.35; }
            100% {
                transform: translateY(115vh) translateX(15px) rotate(480deg);
                opacity: 0;
            }
        }

        /* ——— Мягкие осенние пятна света ——— */
        .light-orb {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            filter: blur(40px);
            animation: orbFloat var(--orb-dur, 18s) ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 180, 80, 0.18), transparent 70%);
            top: 10%;
            left: -5%;
            --orb-dur: 20s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(220, 130, 50, 0.15), transparent 70%);
            bottom: -10%;
            right: -10%;
            --orb-dur: 25s;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(255, 210, 140, 0.12), transparent 70%);
            top: 50%;
            left: 60%;
            --orb-dur: 22s;
            animation-delay: -10s;
        }

        .orb-4 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255, 150, 80, 0.14), transparent 70%);
            top: 30%;
            right: 15%;
            --orb-dur: 28s;
            animation-delay: -3s;
        }

        @keyframes orbFloat {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(20px, 15px) scale(1.1); }
            100% { transform: translate(30px, -20px) scale(1.15); }
        }

        /* ——— Парящие частицы (пылинки / светлячки) ——— */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #ffd27a;
            box-shadow:
                    0 0 8px 2px rgba(255, 210, 120, 0.9),
                    0 0 16px 4px rgba(255, 180, 80, 0.5);
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            animation: particleFloat var(--p-dur, 10s) ease-in-out infinite;
        }

        @keyframes particleFloat {
            0% {
                transform: translate(0, 0) scale(0.5);
                opacity: 0;
            }
            20% { opacity: 0.9; }
            50% {
                transform: translate(var(--p-x, 30px), var(--p-y, -60px)) scale(1.2);
                opacity: 0.7;
            }
            80% { opacity: 0.5; }
            100% {
                transform: translate(calc(var(--p-x, 30px) * -1), calc(var(--p-y, -60px) * 1.5)) scale(0.4);
                opacity: 0;
            }
        }

        /* ——— Медленно плывущие крупные частицы ——— */
        .particle-large {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 220, 150, 0.8), rgba(255, 180, 80, 0.2));
            box-shadow: 0 0 20px 6px rgba(255, 200, 120, 0.5);
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            animation: particleLargeFloat var(--p-dur, 16s) ease-in-out infinite;
        }

        @keyframes particleLargeFloat {
            0% {
                transform: translate(0, 20vh) scale(0.6);
                opacity: 0;
            }
            15% { opacity: 0.6; }
            50% {
                transform: translate(var(--p-x, 60px), -20vh) scale(1);
                opacity: 0.8;
            }
            85% { opacity: 0.4; }
            100% {
                transform: translate(calc(var(--p-x, 60px) * -0.5), -50vh) scale(0.5);
                opacity: 0;
            }
        }

        /* ——— Лёгкий туман / дымка ——— */
        .mist {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%;
            background: linear-gradient(0deg, rgba(80, 50, 25, 0.4) 0%, transparent 100%);
            pointer-events: none;
            z-index: 1;
            animation: mistMove 12s ease-in-out infinite alternate;
        }

        @keyframes mistMove {
            0% { opacity: 0.4; transform: translateX(-2%); }
            100% { opacity: 0.8; transform: translateX(2%); }
        }

        /* ===== КОНТЕЙНЕР-ОТКРЫТКА ===== */
        .ticket {
            position: relative;
            z-index: 30;
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            background: rgba(60, 35, 18, 0.75);
            border-radius: 30px;
            padding: 38px 30px 32px;
            max-width: 470px;
            width: 100%;
            box-shadow:
                    0 30px 90px rgba(0, 0, 0, 0.8),
                    0 0 0 1px rgba(255, 180, 80, 0.4),
                    inset 0 1px 0 rgba(255, 220, 160, 0.25);
            border: 2px dashed rgba(255, 180, 80, 0.45);
            transition: all 0.3s ease;
            animation: ticketIn 0.9s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }

        @keyframes ticketIn {
            0%   { opacity: 0; transform: translateY(40px) scale(0.9) rotate(-2deg); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
        }

        /* Зубчики открытки */
        .ticket::before,
        .ticket::after {
            content: '';
            position: absolute;
            width: 34px;
            height: 34px;
            background: #2b1b0e;
            border-radius: 50%;
            border: 2px dashed rgba(255, 180, 80, 0.45);
            z-index: 31;
        }

        .ticket::before {
            top: 50%;
            left: -18px;
            transform: translateY(-50%);
        }

        .ticket::after {
            top: 50%;
            right: -18px;
            transform: translateY(-50%);
        }

        /* ===== УГОЛКИ-ЭМОДЗИ ===== */
        .corner-decor {
            position: absolute;
            font-size: 1.7rem;
            opacity: 0.9;
            filter: drop-shadow(0 0 20px rgba(255, 180, 80, 0.9));
            user-select: none;
            pointer-events: none;
            animation: decorFloat 8s ease-in-out infinite;
            z-index: 32;
        }
        .corner-decor:nth-child(1) { top: 14px; left: 16px; animation-delay: 0s; }
        .corner-decor:nth-child(2) { top: 14px; right: 16px; animation-delay: 2s; }
        .corner-decor:nth-child(3) { bottom: 14px; left: 16px; animation-delay: 4s; }
        .corner-decor:nth-child(4) { bottom: 14px; right: 16px; animation-delay: 1s; }

        @keyframes decorFloat {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.7; }
            50%      { transform: translateY(-10px) rotate(8deg) scale(1.15); opacity: 1; }
        }

        /* ===== КОНТЕНТ ===== */
        .content-screen {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: center;
        }

        /* ——— Заголовок ——— */
        .movie-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.8rem;
            letter-spacing: 5px;
            background: linear-gradient(180deg, #ffe9b0, #ffb347, #e07b2e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 40px rgba(255, 180, 80, 0.6);
            line-height: 1.1;
            margin-bottom: 2px;
        }

        .movie-subtitle {
            font-family: 'Lobster', cursive;
            font-size: 1.6rem;
            color: #ffc857;
            text-shadow: 0 0 25px rgba(255, 200, 100, 0.8);
            margin-bottom: 6px;
            transform: rotate(-2deg);
        }

        /* ——— Разделитель ——— */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 10px 0;
            color: #ffb347;
            font-size: 1rem;
            letter-spacing: 4px;
            font-weight: 600;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 180, 80, 0.6), transparent);
            max-width: 80px;
        }

        /* ——— Основной текст ——— */
        .message-text {
            font-size: 1rem;
            color: #f5e9d6;
            line-height: 1.9;
            max-width: 370px;
            margin: 0 auto;
            text-align: center;
            font-weight: 400;
            background: rgba(45, 25, 10, 0.55);
            border-radius: 22px;
            padding: 26px 24px 22px;
            border: 1px solid rgba(255, 180, 80, 0.3);
            box-shadow: inset 0 1px 0 rgba(255, 220, 160, 0.2);
        }

        .message-text p {
            margin-bottom: 14px;
            font-weight: 400;
            color: #f5e9d6;
        }

        .message-text p:first-of-type {
            color: #ffc857;
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 18px;
            letter-spacing: 0.5px;
        }

        .message-text p:last-of-type {
            margin-bottom: 0;
            color: #ffc857;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.8px;
            line-height: 1.7;
            text-shadow: 0 0 25px rgba(255, 200, 100, 0.8);
        }

        /* ——— Штрих-код ——— */
        .barcode {
            display: flex;
            justify-content: center;
            gap: 3px;
            margin-top: 18px;
            opacity: 0.5;
        }

        .barcode span {
            display: block;
            height: 26px;
            background: #ffb347;
            border-radius: 1px;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 420px) {
            .ticket { padding: 30px 18px 24px; border-radius: 24px; }
            .ticket::before, .ticket::after { width: 26px; height: 26px; }
            .ticket::before { left: -14px; }
            .ticket::after { right: -14px; }
            .movie-title { font-size: 2.1rem; letter-spacing: 4px; }
            .movie-subtitle { font-size: 1.25rem; }
            .message-text { font-size: 0.88rem; padding: 20px 16px; }
            .corner-decor { font-size: 1.3rem; }
            .leaf { display: none; }
            .leaf-small { display: none; }
            .mist { display: none; }
            .light-orb { display: none; }
            .particle { display: none; }
            .particle-large { display: none; }
            .light-wave { display: none; }
            .fog-band { display: none; }
        }
    </style>
</head>
<body>

<!-- ОСЕННИЙ ФОН -->
<div class="autumn-bg">
    <!-- Тёплое свечение -->
    <div class="sun-glow"></div>

    <!-- Волны света -->
    <div class="light-wave wave-1"></div>
    <div class="light-wave wave-2"></div>
    <div class="light-wave wave-3"></div>

    <!-- Туманные полосы -->
    <div class="fog-band fog-1"></div>
    <div class="fog-band fog-2"></div>
    <div class="fog-band fog-3"></div>

    <!-- Мягкие пятна света -->
    <div class="light-orb orb-1"></div>
    <div class="light-orb orb-2"></div>
    <div class="light-orb orb-3"></div>
    <div class="light-orb orb-4"></div>

    <!-- Дымка / туман -->
    <div class="mist"></div>

    <!-- Падающие листья -->
    <div class="leaf">🍂</div>
    <div class="leaf">🍁</div>
    <div class="leaf">🍂</div>
    <div class="leaf">🍁</div>
    <div class="leaf">🍂</div>
    <div class="leaf">🍁</div>
    <div class="leaf">🍂</div>
    <div class="leaf">🍁</div>
    <div class="leaf">🍂</div>
    <div class="leaf">🍁</div>
</div>

<!-- ОТКРЫТКА-ПРИГЛАШЕНИЕ -->
<div class="ticket" id="appContainer">
    <span class="corner-decor">☕</span>
    <span class="corner-decor">🧣</span>
    <span class="corner-decor">🍂</span>
    <span class="corner-decor">🍁</span>

    <div id="mainScreen" class="content-screen">
        <div class="movie-title">ВЕЧЕРНЯЯ ПРОГУЛКА</div>
        <div class="movie-subtitle">Приглашение 🍁</div>

        <div class="divider">✦ 19.09.26 ✦</div>

        <div class="message-text">
            <p>Милая Софья Эдуардовна!</p>
            <p>Приглашаю вас сегодня вечером на прогулку.</p>
            <p>Буду ждать с нетерпением! ✨</p>
        </div>

        <!-- Штрих-код -->
        <div class="barcode">
            <span style="width:3px;"></span>
            <span style="width:2px;"></span>
            <span style="width:5px;"></span>
            <span style="width:2px;"></span>
            <span style="width:3px;"></span>
            <span style="width:6px;"></span>
            <span style="width:2px;"></span>
            <span style="width:4px;"></span>
            <span style="width:2px;"></span>
            <span style="width:3px;"></span>
            <span style="width:5px;"></span>
            <span style="width:2px;"></span>
            <span style="width:3px;"></span>
        </div>
    </div>
</div>

<script>
    (function() {
        const autumnBg = document.querySelector('.autumn-bg');

        // ===== ГЕНЕРАЦИЯ ДОПОЛНИТЕЛЬНЫХ ПАДАЮЩИХ ЛИСТЬЕВ =====
        const leafEmojis = ['🍂', '🍁', '🍃', '🍂', '🍁'];

        for (let i = 0; i < 18; i++) {
            const leaf = document.createElement('div');
            leaf.className = 'leaf';
            leaf.textContent = leafEmojis[Math.floor(Math.random() * leafEmojis.length)];
            leaf.style.left = (Math.random() * 96 + 2) + '%';
            const dur = Math.random() * 10 + 12;
            leaf.style.setProperty('--leaf-dur', dur + 's');
            leaf.style.animationDelay = (Math.random() * 20) + 's';
            const size = Math.random() * 1.6 + 0.9;
            leaf.style.fontSize = size + 'rem';
            leaf.style.top = (Math.random() * -15 - 5) + 'vh';
            leaf.style.opacity = (Math.random() * 0.3 + 0.5).toFixed(2);
            autumnBg.appendChild(leaf);
        }

        // ===== ГЕНЕРАЦИЯ МАЛЕНЬКИХ ЛИСТИКОВ (ГЛУБИНА) =====
        for (let i = 0; i < 14; i++) {
            const leaf = document.createElement('div');
            leaf.className = 'leaf-small';
            leaf.textContent = leafEmojis[Math.floor(Math.random() * leafEmojis.length)];
            leaf.style.left = (Math.random() * 96 + 2) + '%';
            const dur = Math.random() * 12 + 16;
            leaf.style.setProperty('--leaf-dur', dur + 's');
            leaf.style.animationDelay = (Math.random() * 25) + 's';
            leaf.style.fontSize = (Math.random() * 0.6 + 0.6) + 'rem';
            leaf.style.top = (Math.random() * -10 - 5) + 'vh';
            autumnBg.appendChild(leaf);
        }

        // ===== ГЕНЕРАЦИЯ ПАРЯЩИХ ЧАСТИЦ (ПЫЛИНОК / СВЕТЛЯЧКОВ) =====
        for (let i = 0; i < 35; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = (Math.random() * 100) + '%';
            particle.style.top = (Math.random() * 100) + '%';
            const dur = Math.random() * 8 + 8;
            particle.style.setProperty('--p-dur', dur + 's');
            particle.style.animationDelay = (Math.random() * 15) + 's';
            particle.style.setProperty('--p-x', (Math.random() * 80 - 40) + 'px');
            particle.style.setProperty('--p-y', (Math.random() * 80 - 80) + 'px');

            // Размер и цвет
            const size = Math.random() * 3 + 2;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';

            const r = Math.random();
            if (r > 0.66) {
                particle.style.background = '#fff4d6';
                particle.style.boxShadow = '0 0 8px 2px rgba(255, 240, 200, 0.9), 0 0 16px 5px rgba(255, 210, 150, 0.5)';
            } else if (r > 0.33) {
                particle.style.background = '#ffb347';
                particle.style.boxShadow = '0 0 8px 2px rgba(255, 180, 80, 0.9), 0 0 16px 5px rgba(255, 140, 50, 0.5)';
            }

            autumnBg.appendChild(particle);
        }

        // ===== ГЕНЕРАЦИЯ КРУПНЫХ ПАРЯЩИХ ЧАСТИЦ =====
        for (let i = 0; i < 8; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle-large';
            particle.style.left = (Math.random() * 100) + '%';
            particle.style.top = (Math.random() * 80 + 10) + '%';
            const dur = Math.random() * 10 + 14;
            particle.style.setProperty('--p-dur', dur + 's');
            particle.style.animationDelay = (Math.random() * 12) + 's';
            particle.style.setProperty('--p-x', (Math.random() * 120 - 60) + 'px');
            autumnBg.appendChild(particle);
        }

        // ===== ЛЁГКИЙ ПАРАЛЛАКС ПРИ ДВИЖЕНИИ МЫШИ =====
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 2;
            const y = (e.clientY / window.innerHeight - 0.5) * 2;

            const leaves = document.querySelectorAll('.leaf');
            leaves.forEach((leaf, i) => {
                const factor = (i % 4 + 1) * 1.5;
                leaf.style.marginLeft = (x * factor) + 'px';
                leaf.style.marginTop = (y * factor) + 'px';
            });

            const orbs = document.querySelectorAll('.light-orb');
            orbs.forEach((orb, i) => {
                const factor = (i + 1) * 4;
                orb.style.transform = `translate(${x * factor}px, ${y * factor}px)`;
            });

            const waves = document.querySelectorAll('.light-wave');
            waves.forEach((wave, i) => {
                const factor = (i + 1) * 2;
                wave.style.marginLeft = (x * factor) + 'px';
            });

            const fogs = document.querySelectorAll('.fog-band');
            fogs.forEach((fog, i) => {
                const factor = (i + 1) * 3;
                fog.style.marginLeft = (x * factor) + 'px';
            });
        });
    })();
</script>

</body>
</html>
