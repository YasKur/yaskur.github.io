<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Приглашение в гости 🥚 Kinder Surprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Comfortaa:wght@400;600;700&family=Lobster&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Comfortaa', cursive;
            position: relative;
            overflow-x: hidden;
            background: #fff5e6; /* тёплый кремовый фон */
        }

        /* ===== ФОН В СТИЛЕ KINDER SURPRISE ===== */
        .kinder-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                    radial-gradient(ellipse at 30% 40%, #fff9e6 0%, #ffe6b3 25%, #f7c56e 55%, #e89e3d 80%, #c47a1a 100%);
            overflow: hidden;
        }

        /* ——— Мягкие пятна (как разлитый шоколад и молоко) ——— */
        .kinder-orb {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            filter: blur(55px);
            animation: orbFloat var(--orb-dur, 14s) ease-in-out infinite alternate;
            mix-blend-mode: screen;
        }

        .korb-1 {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, #fff5d1, transparent 70%);
            top: -8%;
            left: -12%;
            --orb-dur: 18s;
        }

        .korb-2 {
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, #ffe49e, transparent 70%);
            bottom: -18%;
            right: -8%;
            --orb-dur: 22s;
            animation-delay: -5s;
        }

        .korb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #ffedc4, transparent 70%);
            top: 35%;
            left: 60%;
            --orb-dur: 20s;
            animation-delay: -9s;
        }

        .korb-4 {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, #fbd27e, transparent 70%);
            top: 8%;
            right: 12%;
            --orb-dur: 24s;
            animation-delay: -3s;
        }

        .korb-5 {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #ffe8b0, transparent 70%);
            bottom: 18%;
            left: 8%;
            --orb-dur: 16s;
            animation-delay: -7s;
        }

        @keyframes orbFloat {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(40px, 30px) scale(1.2); }
            100% { transform: translate(60px, -30px) scale(1.3); }
        }

        /* ——— Волны (как шоколадные разводы) ——— */
        .kinder-wave {
            position: absolute;
            width: 200%;
            height: 220px;
            left: -50%;
            pointer-events: none;
            z-index: 1;
            filter: blur(50px);
            opacity: 0.45;
            mix-blend-mode: screen;
        }

        .kwave-1 {
            top: 8%;
            background: linear-gradient(90deg, transparent, #ffe49e, #f7c56e, transparent);
            animation: waveMove 12s ease-in-out infinite alternate;
        }

        .kwave-2 {
            top: 38%;
            background: linear-gradient(90deg, transparent, #ffedc4, #e89e3d, transparent);
            animation: waveMove 16s ease-in-out infinite alternate-reverse;
        }

        .kwave-3 {
            top: 68%;
            background: linear-gradient(90deg, transparent, #fbd27e, #c47a1a, transparent);
            animation: waveMove 20s ease-in-out infinite alternate;
            animation-delay: -6s;
        }

        @keyframes waveMove {
            0%   { transform: translateX(-10%) skewY(-3deg); opacity: 0.3; }
            100% { transform: translateX(10%) skewY(3deg); opacity: 0.7; }
        }

        /* ——— Сетка (как ячейки шоколада) ——— */
        .kinder-grid {
            position: absolute;
            inset: 0;
            z-index: 1;
            background-image:
                    linear-gradient(rgba(200, 150, 50, 0.12) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(200, 150, 50, 0.12) 1px, transparent 1px);
            background-size: 55px 55px;
            animation: gridPulse 6s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 0.65; }
        }

        /* ——— Пузыри (молочные) ——— */
        .kinder-bubble {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            animation: bubbleFloat var(--b-dur, 12s) ease-in infinite;
            box-shadow: 0 0 20px 8px rgba(255, 230, 180, 0.5);
        }

        @keyframes bubbleFloat {
            0% {
                transform: translateY(100vh) scale(0.3) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.8; }
            50% {
                transform: translateY(40vh) scale(1) rotate(180deg);
                opacity: 0.6;
            }
            90% { opacity: 0.3; }
            100% {
                transform: translateY(-20vh) scale(0.5) rotate(360deg);
                opacity: 0;
            }
        }

        /* ——— Падающие блёстки / шоколадные крошки ——— */
        .kinder-sparkle {
            position: absolute;
            top: -10vh;
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            animation: sparkleFall var(--s-dur, 10s) linear infinite;
            filter: drop-shadow(0 0 10px currentColor);
        }

        @keyframes sparkleFall {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            8% { opacity: 0.9; }
            50% {
                transform: translateY(50vh) translateX(40px) rotate(180deg) scale(1.1);
                opacity: 0.8;
            }
            92% { opacity: 0.4; }
            100% {
                transform: translateY(110vh) translateX(-30px) rotate(360deg) scale(0.7);
                opacity: 0;
            }
        }

        /* ——— Летающие emoji (Kinder-тематика) ——— */
        .kinder-emoji {
            position: absolute;
            top: -10vh;
            pointer-events: none;
            z-index: 4;
            opacity: 0;
            animation: flyEmoji var(--e-dur, 14s) linear infinite;
            filter: drop-shadow(0 0 15px rgba(255, 220, 150, 0.9));
        }

        @keyframes flyEmoji {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            10% { opacity: 0.9; }
            50% {
                transform: translateY(45vh) translateX(-50px) rotate(200deg) scale(1.2);
                opacity: 0.8;
            }
            90% { opacity: 0.5; }
            100% {
                transform: translateY(115vh) translateX(40px) rotate(400deg) scale(1);
                opacity: 0;
            }
        }

        /* ——— Пульсирующие частицы ——— */
        .kinder-particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            animation: partyPulse var(--pp-dur, 6s) ease-in-out infinite;
        }

        @keyframes partyPulse {
            0%, 100% {
                transform: scale(0.5);
                opacity: 0;
            }
            50% {
                transform: scale(1.5);
                opacity: 0.9;
            }
        }

        /* ===== КОНТЕЙНЕР-ОТКРЫТКА (яйцо Kinder) ===== */
        .kinder-ticket {
            position: relative;
            z-index: 30;
            backdrop-filter: blur(22px) saturate(1.6);
            -webkit-backdrop-filter: blur(22px) saturate(1.6);
            background: rgba(60, 35, 10, 0.78);
            border-radius: 30px;
            padding: 28px 28px 30px;
            max-width: 490px;
            width: 100%;
            box-shadow:
                    0 30px 90px rgba(0, 0, 0, 0.8),
                    0 0 0 1px rgba(255, 220, 140, 0.7),
                    0 0 60px rgba(255, 200, 100, 0.35),
                    0 0 120px rgba(230, 160, 40, 0.2),
                    inset 0 1px 0 rgba(255, 240, 200, 0.35);
            border: 2px dashed rgba(255, 215, 120, 0.7);
            transition: all 0.3s ease;
            animation: ticketIn 0.9s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }

        @keyframes ticketIn {
            0%   { opacity: 0; transform: translateY(50px) scale(0.85) rotate(-3deg); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
        }

        /* Зубчики открытки */
        .kinder-ticket::before,
        .kinder-ticket::after {
            content: '';
            position: absolute;
            width: 34px;
            height: 34px;
            background: #fff5e6;
            border-radius: 50%;
            border: 2px dashed rgba(255, 215, 120, 0.7);
            z-index: 31;
        }

        .kinder-ticket::before {
            top: 50%;
            left: -18px;
            transform: translateY(-50%);
        }

        .kinder-ticket::after {
            top: 50%;
            right: -18px;
            transform: translateY(-50%);
        }

        /* ===== ГИФКА С КОТОМ СВЕРХУ ===== */
        .cat-gif-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 6px;
            position: relative;
            z-index: 35;
        }

        .cat-gif {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 215, 120, 0.8);
            box-shadow:
                    0 0 30px rgba(255, 200, 100, 0.8),
                    0 0 60px rgba(230, 160, 40, 0.5),
                    0 0 100px rgba(255, 220, 140, 0.3);
            animation: catBounce 2.5s ease-in-out infinite;
            background: #3c230a;
        }

        @keyframes catBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.05); }
        }

        /* ===== УГОЛКИ-ЭМОДЗИ (Kinder-тематика) ===== */
        .kinder-corner {
            position: absolute;
            font-size: 1.8rem;
            opacity: 0.95;
            filter: drop-shadow(0 0 20px rgba(255, 220, 150, 1));
            user-select: none;
            pointer-events: none;
            animation: decorFloat 6s ease-in-out infinite;
            z-index: 32;
        }
        .kinder-corner:nth-child(1) { top: 14px; left: 16px; animation-delay: 0s; }
        .kinder-corner:nth-child(2) { top: 14px; right: 16px; animation-delay: 1.5s; }
        .kinder-corner:nth-child(3) { bottom: 14px; left: 16px; animation-delay: 3s; }
        .kinder-corner:nth-child(4) { bottom: 14px; right: 16px; animation-delay: 4.5s; }

        @keyframes decorFloat {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.7; }
            50%      { transform: translateY(-12px) rotate(12deg) scale(1.2); opacity: 1; }
        }

        /* ===== КОНТЕНТ ===== */
        .content-screen {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: center;
        }

        /* ——— Заголовок ——— */
        .kinder-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3rem;
            letter-spacing: 6px;
            background: linear-gradient(180deg, #fff5d1, #ffe49e, #f7c56e, #e89e3d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 50px rgba(255, 220, 140, 0.9);
            line-height: 1.1;
            margin-bottom: 2px;
            animation: titleGlow 3s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .kinder-subtitle {
            font-family: 'Lobster', cursive;
            font-size: 1.7rem;
            color: #ffedc4;
            text-shadow: 0 0 30px rgba(255, 220, 140, 0.9), 0 0 60px rgba(230, 160, 40, 0.6);
            margin-bottom: 6px;
            transform: rotate(-2deg);
        }

        /* ——— Разделитель ——— */
        .kinder-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 8px 0;
            color: #ffedc4;
            font-size: 1rem;
            letter-spacing: 4px;
            font-weight: 600;
        }

        .kinder-divider::before,
        .kinder-divider::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 120, 0.9), transparent);
            max-width: 80px;
        }

        /* ——— Основной текст ——— */
        .kinder-message {
            font-size: 1rem;
            color: #fff5e6;
            line-height: 1.9;
            max-width: 380px;
            margin: 0 auto;
            text-align: center;
            font-weight: 400;
            background: rgba(50, 25, 5, 0.6);
            border-radius: 22px;
            padding: 24px 22px 20px;
            border: 1px solid rgba(255, 215, 120, 0.5);
            box-shadow: inset 0 1px 0 rgba(255, 240, 200, 0.2);
        }

        .kinder-message p {
            margin-bottom: 14px;
            font-weight: 400;
            color: #fff5e6;
        }

        .kinder-message p:first-of-type {
            color: #ffe49e;
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 18px;
            letter-spacing: 0.5px;
        }

        .kinder-message p:last-of-type {
            margin-bottom: 0;
            color: #ffedc4;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.8px;
            line-height: 1.7;
            text-shadow: 0 0 25px rgba(255, 220, 140, 0.9);
        }

        /* ——— Штрих-код ——— */
        .kinder-barcode {
            display: flex;
            justify-content: center;
            gap: 3px;
            margin-top: 16px;
            opacity: 0.65;
        }

        .kinder-barcode span {
            display: block;
            height: 26px;
            background: linear-gradient(180deg, #ffe49e, #e89e3d);
            border-radius: 1px;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 420px) {
            .kinder-ticket { padding: 22px 16px 24px; border-radius: 24px; }
            .kinder-ticket::before, .kinder-ticket::after { width: 26px; height: 26px; }
            .kinder-ticket::before { left: -14px; }
            .kinder-ticket::after { right: -14px; }
            .cat-gif { width: 110px; height: 110px; }
            .kinder-title { font-size: 2.2rem; letter-spacing: 4px; }
            .kinder-subtitle { font-size: 1.3rem; }
            .kinder-message { font-size: 0.88rem; padding: 18px 14px; }
            .kinder-corner { font-size: 1.3rem; }
            .kinder-sparkle { display: none; }
            .kinder-emoji { display: none; }
            .kinder-bubble { display: none; }
            .kinder-orb { display: none; }
            .kinder-wave { display: none; }
            .kinder-particle { display: none; }
        }
    </style>
</head>
<body>

<!-- ФОН В СТИЛЕ KINDER SURPRISE -->
<div class="kinder-bg">
    <!-- Мягкие пятна -->
    <div class="kinder-orb korb-1"></div>
    <div class="kinder-orb korb-2"></div>
    <div class="kinder-orb korb-3"></div>
    <div class="kinder-orb korb-4"></div>
    <div class="kinder-orb korb-5"></div>

    <!-- Волны -->
    <div class="kinder-wave kwave-1"></div>
    <div class="kinder-wave kwave-2"></div>
    <div class="kinder-wave kwave-3"></div>

    <!-- Сетка -->
    <div class="kinder-grid"></div>
</div>

<!-- ОТКРЫТКА-ПРИГЛАШЕНИЕ -->
<div class="kinder-ticket" id="appContainer">
    <span class="kinder-corner">🥚</span>
    <span class="kinder-corner">🍫</span>
    <span class="kinder-corner">🧸</span>
    <span class="kinder-corner">🎁</span>

    <div id="mainScreen" class="content-screen">
        <div class="kinder-subtitle">Приглашение в гости</div>

        <div class="kinder-divider">✦ <span id="todayDate">--.--.--</span> ✦</div>

        <div class="kinder-message">
            <p>Замечательная Софья Эдуардовна!</p>
            <p>Приглашаю вас сегодня в гости, досмотрим фильм. Поговорим, а еще давно не было средних киндеров)</p>
        </div>

        <!-- Штрих-код -->
        <div class="kinder-barcode">
            <span style="width:3px;"></span>
            <span style="width:2px;"></span>
            <span style="width:5px;"></span>
            <span style="width:2px;"></span>
            <span style="width:3px;"></span>
            <span style="width:6px;"></span>
            <span style="width:2px;"></span>
            <span style="width:4px;"></span>
            <span style="width:2px;"></span>
            <span style="width:3px;"></span>
            <span style="width:5px;"></span>
            <span style="width:2px;"></span>
            <span style="width:3px;"></span>
        </div>
    </div>
</div>

<script>
    (function() {
        // ===== СЕГОДНЯШНЯЯ ДАТА =====
        const dateEl = document.getElementById('todayDate');
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = String(now.getFullYear()).slice(-2);
        dateEl.textContent = day + '.' + month + '.' + year;

        const kinderBg = document.querySelector('.kinder-bg');

        // ===== ГЕНЕРАЦИЯ БЛЁСТОК / ШОКОЛАДНЫХ КРОШЕК =====
        const sparkleChars = ['✨', '⭐', '🌟', '💫', '✦', '✧', '🍫', '🥜'];
        const sparkleColors = ['#ffe49e', '#f7c56e', '#e89e3d', '#c47a1a', '#ffedc4'];

        for (let i = 0; i < 30; i++) {
            const sparkle = document.createElement('div');
            sparkle.className = 'kinder-sparkle';
            sparkle.textContent = sparkleChars[Math.floor(Math.random() * sparkleChars.length)];
            sparkle.style.left = (Math.random() * 96 + 2) + '%';
            const dur = Math.random() * 8 + 8;
            sparkle.style.setProperty('--s-dur', dur + 's');
            sparkle.style.animationDelay = (Math.random() * 20) + 's';
            const size = Math.random() * 1.2 + 0.8;
            sparkle.style.fontSize = size + 'rem';
            sparkle.style.color = sparkleColors[Math.floor(Math.random() * sparkleColors.length)];
            sparkle.style.top = (Math.random() * -15 - 5) + 'vh';
            kinderBg.appendChild(sparkle);
        }

        // ===== ГЕНЕРАЦИЯ ЛЕТАЮЩИХ EMOJI (Kinder-тематика) =====
        const emojis = ['🥚', '🍫', '🧸', '🎁', '🐣', '🍬', '🍭', '🧁', '🍪', '🥛', '🍯', '🌈'];

        for (let i = 0; i < 16; i++) {
            const emoji = document.createElement('div');
            emoji.className = 'kinder-emoji';
            emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.left = (Math.random() * 94 + 3) + '%';
            const dur = Math.random() * 10 + 12;
            emoji.style.setProperty('--e-dur', dur + 's');
            emoji.style.animationDelay = (Math.random() * 25) + 's';
            const size = Math.random() * 1.8 + 1.2;
            emoji.style.fontSize = size + 'rem';
            emoji.style.top = (Math.random() * -15 - 5) + 'vh';
            kinderBg.appendChild(emoji);
        }

        // ===== ГЕНЕРАЦИЯ ПУЗЫРЕЙ (молочные) =====
        for (let i = 0; i < 18; i++) {
            const bubble = document.createElement('div');
            bubble.className = 'kinder-bubble';
            const size = Math.random() * 80 + 30;
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            bubble.style.left = (Math.random() * 96 + 2) + '%';
            const dur = Math.random() * 12 + 10;
            bubble.style.setProperty('--b-dur', dur + 's');
            bubble.style.animationDelay = (Math.random() * 20) + 's';

            const colors = [
                'radial-gradient(circle at 30% 30%, rgba(255,255,255,0.7), rgba(255, 230, 180, 0.3))',
                'radial-gradient(circle at 30% 30%, rgba(255,255,255,0.7), rgba(247, 197, 110, 0.3))',
                'radial-gradient(circle at 30% 30%, rgba(255,255,255,0.7), rgba(232, 158, 61, 0.3))',
                'radial-gradient(circle at 30% 30%, rgba(255,255,255,0.7), rgba(196, 122, 26, 0.3))'
            ];
            bubble.style.background = colors[Math.floor(Math.random() * colors.length)];
            kinderBg.appendChild(bubble);
        }

        // ===== ГЕНЕРАЦИЯ ПУЛЬСИРУЮЩИХ ЧАСТИЦ =====
        for (let i = 0; i < 25; i++) {
            const particle = document.createElement('div');
            particle.className = 'kinder-particle';
            const size = Math.random() * 6 + 3;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = (Math.random() * 100) + '%';
            particle.style.top = (Math.random() * 100) + '%';
            const dur = Math.random() * 4 + 4;
            particle.style.setProperty('--pp-dur', dur + 's');
            particle.style.animationDelay = (Math.random() * 10) + 's';

            const color = sparkleColors[Math.floor(Math.random() * sparkleColors.length)];
            particle.style.background = color;
            particle.style.boxShadow = `0 0 12px 4px ${color}80, 0 0 24px 8px ${color}40`;
            kinderBg.appendChild(particle);
        }

        // ===== ЛЁГКИЙ ПАРАЛЛАКС ПРИ ДВИЖЕНИИ МЫШИ =====
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 2;
            const y = (e.clientY / window.innerHeight - 0.5) * 2;

            const sparkles = document.querySelectorAll('.kinder-sparkle');
            sparkles.forEach((el, i) => {
                const factor = (i % 4 + 1) * 2;
                el.style.marginLeft = (x * factor) + 'px';
                el.style.marginTop = (y * factor) + 'px';
            });

            const orbs = document.querySelectorAll('.kinder-orb');
            orbs.forEach((orb, i) => {
                const factor = (i + 1) * 5;
                orb.style.transform = `translate(${x * factor}px, ${y * factor}px)`;
            });

            const waves = document.querySelectorAll('.kinder-wave');
            waves.forEach((wave, i) => {
                const factor = (i + 1) * 3;
                wave.style.marginLeft = (x * factor) + 'px';
            });

            const emojis = document.querySelectorAll('.kinder-emoji');
            emojis.forEach((el, i) => {
                const factor = (i % 5 + 1) * 2;
                el.style.marginLeft = (x * factor) + 'px';
                el.style.marginTop = (y * factor) + 'px';
            });
        });
    })();
</script>

</body>
</html>
