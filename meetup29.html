<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Приглашение на уютный вечер 🕯️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Comfortaa:wght@400;600;700&family=Lobster&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Comfortaa', cursive;
            position: relative;
            overflow-x: hidden;
            background: #1a1410; /* глубокий тёплый тёмный фон */
        }

        /* ===== ФОН В СТИЛЕ УЮТНОГО ВЕЧЕРА ===== */
        .cozy-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                    radial-gradient(ellipse at 50% 20%, #3d2b1f 0%, #2a1d14 35%, #1a1410 70%, #0f0b08 100%);
            overflow: hidden;
        }

        /* ——— Тёплые пятна света (как от свечей и ламп) ——— */
        .cozy-orb {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            filter: blur(70px);
            animation: orbGlow var(--orb-dur, 12s) ease-in-out infinite alternate;
            mix-blend-mode: screen;
        }

        .corb-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 180, 90, 0.55), transparent 70%);
            top: -6%;
            left: -10%;
            --orb-dur: 16s;
        }

        .corb-2 {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, rgba(255, 140, 70, 0.4), transparent 70%);
            bottom: -15%;
            right: -8%;
            --orb-dur: 20s;
            animation-delay: -6s;
        }

        .corb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 200, 120, 0.35), transparent 70%);
            top: 30%;
            left: 55%;
            --orb-dur: 18s;
            animation-delay: -9s;
        }

        .corb-4 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(200, 120, 60, 0.3), transparent 70%);
            top: 10%;
            right: 10%;
            --orb-dur: 22s;
            animation-delay: -3s;
        }

        @keyframes orbGlow {
            0%   { transform: translate(0, 0) scale(1); opacity: 0.6; }
            50%  { transform: translate(30px, 20px) scale(1.15); opacity: 0.9; }
            100% { transform: translate(50px, -25px) scale(1.25); opacity: 0.7; }
        }

        /* ——— Мягкие дымки / пар от чая ——— */
        .cozy-mist {
            position: absolute;
            width: 200%;
            height: 240px;
            left: -50%;
            pointer-events: none;
            z-index: 1;
            filter: blur(60px);
            opacity: 0.35;
            mix-blend-mode: screen;
        }

        .mist-1 {
            top: 12%;
            background: linear-gradient(90deg, transparent, rgba(255, 190, 120, 0.4), rgba(255, 150, 80, 0.3), transparent);
            animation: mistMove 14s ease-in-out infinite alternate;
        }

        .mist-2 {
            top: 45%;
            background: linear-gradient(90deg, transparent, rgba(220, 160, 100, 0.3), rgba(180, 120, 70, 0.2), transparent);
            animation: mistMove 18s ease-in-out infinite alternate-reverse;
        }

        .mist-3 {
            top: 75%;
            background: linear-gradient(90deg, transparent, rgba(200, 130, 70, 0.25), rgba(150, 90, 50, 0.2), transparent);
            animation: mistMove 22s ease-in-out infinite alternate;
            animation-delay: -7s;
        }

        @keyframes mistMove {
            0%   { transform: translateX(-8%) skewY(-2deg); opacity: 0.2; }
            100% { transform: translateX(8%) skewY(2deg); opacity: 0.5; }
        }

        /* ——— Тёплая сетка (лёгкий уютный паттерн) ——— */
        .cozy-grid {
            position: absolute;
            inset: 0;
            z-index: 1;
            background-image:
                    linear-gradient(rgba(255, 180, 100, 0.05) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 180, 100, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridPulse 8s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        /* ——— Мерцающие огоньки (как гирлянда) ——— */
        .cozy-fairy-light {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            animation: fairyTwinkle var(--f-dur, 4s) ease-in-out infinite;
            box-shadow: 0 0 12px 4px rgba(255, 200, 120, 0.8);
        }

        @keyframes fairyTwinkle {
            0%, 100% { opacity: 0.1; transform: scale(0.6); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* ——— Плавно поднимающиеся искры (как от свечи) ——— */
        .cozy-spark {
            position: absolute;
            bottom: -5vh;
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            animation: sparkRise var(--s-dur, 9s) ease-in infinite;
            filter: drop-shadow(0 0 8px currentColor);
        }

        @keyframes sparkRise {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg) scale(0.4);
                opacity: 0;
            }
            12% { opacity: 0.9; }
            55% {
                transform: translateY(-55vh) translateX(30px) rotate(180deg) scale(1);
                opacity: 0.7;
            }
            90% { opacity: 0.3; }
            100% {
                transform: translateY(-110vh) translateX(-25px) rotate(360deg) scale(0.5);
                opacity: 0;
            }
        }

        /* ——— Мягко парящие emoji (уютная тематика) ——— */
        .cozy-emoji {
            position: absolute;
            top: -10vh;
            pointer-events: none;
            z-index: 4;
            opacity: 0;
            animation: floatEmoji var(--e-dur, 15s) linear infinite;
            filter: drop-shadow(0 0 12px rgba(255, 180, 100, 0.7));
        }

        @keyframes floatEmoji {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            10% { opacity: 0.85; }
            50% {
                transform: translateY(45vh) translateX(-40px) rotate(160deg) scale(1.1);
                opacity: 0.7;
            }
            90% { opacity: 0.4; }
            100% {
                transform: translateY(115vh) translateX(35px) rotate(320deg) scale(1);
                opacity: 0;
            }
        }

        /* ——— Пульсирующие тёплые частицы ——— */
        .cozy-particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            animation: warmPulse var(--pp-dur, 5s) ease-in-out infinite;
        }

        @keyframes warmPulse {
            0%, 100% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.4); opacity: 0.8; }
        }

        /* ===== КОНТЕЙНЕР-ОТКРЫТКА (уютный конверт) ===== */
        .cozy-ticket {
            position: relative;
            z-index: 30;
            backdrop-filter: blur(22px) saturate(1.4);
            -webkit-backdrop-filter: blur(22px) saturate(1.4);
            background: rgba(40, 26, 18, 0.82);
            border-radius: 28px;
            padding: 28px 28px 30px;
            max-width: 490px;
            width: 100%;
            box-shadow:
                    0 30px 90px rgba(0, 0, 0, 0.85),
                    0 0 0 1px rgba(255, 190, 110, 0.5),
                    0 0 60px rgba(255, 160, 80, 0.25),
                    0 0 120px rgba(200, 120, 50, 0.15),
                    inset 0 1px 0 rgba(255, 220, 170, 0.25);
            border: 1px solid rgba(255, 190, 110, 0.45);
            transition: all 0.3s ease;
            animation: ticketIn 0.9s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }

        @keyframes ticketIn {
            0%   { opacity: 0; transform: translateY(50px) scale(0.85) rotate(-2deg); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
        }

        /* ===== ГИФКА С КОТОМ СВЕРХУ ===== */
        .cat-gif-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 6px;
            position: relative;
            z-index: 35;
        }

        .cat-gif {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 190, 110, 0.7);
            box-shadow:
                    0 0 30px rgba(255, 170, 90, 0.6),
                    0 0 60px rgba(220, 130, 60, 0.4),
                    0 0 100px rgba(255, 200, 130, 0.2);
            animation: catBounce 3s ease-in-out infinite;
            background: #2a1d14;
        }

        @keyframes catBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.04); }
        }

        /* ===== УГОЛКИ-ЭМОДЗИ (уютная тематика) ===== */
        .cozy-corner {
            position: absolute;
            font-size: 1.7rem;
            opacity: 0.9;
            filter: drop-shadow(0 0 18px rgba(255, 180, 100, 0.8));
            user-select: none;
            pointer-events: none;
            animation: decorFloat 7s ease-in-out infinite;
            z-index: 32;
        }
        .cozy-corner:nth-child(1) { top: 14px; left: 16px; animation-delay: 0s; }
        .cozy-corner:nth-child(2) { top: 14px; right: 16px; animation-delay: 1.75s; }
        .cozy-corner:nth-child(3) { bottom: 14px; left: 16px; animation-delay: 3.5s; }
        .cozy-corner:nth-child(4) { bottom: 14px; right: 16px; animation-delay: 5.25s; }

        @keyframes decorFloat {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.65; }
            50%      { transform: translateY(-10px) rotate(8deg) scale(1.15); opacity: 1; }
        }

        /* ===== КОНТЕНТ ===== */
        .content-screen {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: center;
        }

        /* ——— Заголовок ——— */
        .cozy-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3rem;
            letter-spacing: 6px;
            background: linear-gradient(180deg, #ffe8c4, #ffc98a, #f5a55a, #d97a35);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 50px rgba(255, 190, 110, 0.7);
            line-height: 1.1;
            margin-bottom: 2px;
            animation: titleGlow 4s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.25); }
        }

        .cozy-subtitle {
            font-family: 'Lobster', cursive;
            font-size: 1.7rem;
            color: #ffe0b8;
            text-shadow: 0 0 30px rgba(255, 180, 100, 0.7), 0 0 60px rgba(200, 110, 40, 0.4);
            margin-bottom: 6px;
            transform: rotate(-2deg);
        }

        /* ——— Разделитель ——— */
        .cozy-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 8px 0;
            color: #ffd9a8;
            font-size: 1rem;
            letter-spacing: 4px;
            font-weight: 600;
        }

        .cozy-divider::before,
        .cozy-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 190, 110, 0.7), transparent);
            max-width: 80px;
        }

        /* ——— Основной текст ——— */
        .cozy-message {
            font-size: 1rem;
            color: #f5e6d3;
            line-height: 1.9;
            max-width: 380px;
            margin: 0 auto;
            text-align: center;
            font-weight: 400;
            background: rgba(30, 18, 10, 0.55);
            border-radius: 22px;
            padding: 24px 22px 20px;
            border: 1px solid rgba(255, 190, 110, 0.35);
            box-shadow: inset 0 1px 0 rgba(255, 220, 170, 0.15);
        }

        .cozy-message p {
            margin-bottom: 14px;
            font-weight: 400;
            color: #f5e6d3;
        }

        .cozy-message p:first-of-type {
            color: #ffd9a8;
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 18px;
            letter-spacing: 0.5px;
        }

        .cozy-message p:last-of-type {
            margin-bottom: 0;
            color: #ffe0b8;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.8px;
            line-height: 1.7;
            text-shadow: 0 0 25px rgba(255, 190, 110, 0.6);
        }

        /* ——— Декоративная линия снизу ——— */
        .cozy-barcode {
            display: flex;
            justify-content: center;
            gap: 3px;
            margin-top: 16px;
            opacity: 0.55;
        }

        .cozy-barcode span {
            display: block;
            height: 24px;
            background: linear-gradient(180deg, #ffc98a, #d97a35);
            border-radius: 1px;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 420px) {
            .cozy-ticket { padding: 22px 16px 24px; border-radius: 22px; }
            .cat-gif { width: 110px; height: 110px; }
            .cozy-title { font-size: 2.2rem; letter-spacing: 4px; }
            .cozy-subtitle { font-size: 1.3rem; }
            .cozy-message { font-size: 0.88rem; padding: 18px 14px; }
            .cozy-corner { font-size: 1.3rem; }
            .cozy-spark { display: none; }
            .cozy-emoji { display: none; }
            .cozy-fairy-light { display: none; }
            .cozy-orb { display: none; }
            .cozy-mist { display: none; }
            .cozy-particle { display: none; }
        }
    </style>
</head>
<body>

<!-- ФОН В СТИЛЕ УЮТНОГО ВЕЧЕРА -->
<div class="cozy-bg">
    <!-- Тёплые пятна света -->
    <div class="cozy-orb corb-1"></div>
    <div class="cozy-orb corb-2"></div>
    <div class="cozy-orb corb-3"></div>
    <div class="cozy-orb corb-4"></div>

    <!-- Дымки / пар -->
    <div class="cozy-mist mist-1"></div>
    <div class="cozy-mist mist-2"></div>
    <div class="cozy-mist mist-3"></div>

    <!-- Сетка -->
    <div class="cozy-grid"></div>
</div>

<!-- ОТКРЫТКА-ПРИГЛАШЕНИЕ -->
<div class="cozy-ticket" id="appContainer">
    <span class="cozy-corner">🕯️</span>
    <span class="cozy-corner">☕</span>
    <span class="cozy-corner">🧣</span>
    <span class="cozy-corner">✨</span>

    <div id="mainScreen" class="content-screen">
        <div class="cozy-subtitle">Приглашение на уютный вечер</div>

        <div class="cozy-divider">✦ <span id="todayDate">--.--.--</span> ✦</div>

        <div class="cozy-message">
            <p>Ласковая Софья Эдуардовна!</p>
            <p>Приглашаю вас сегодня в гости на домашний уютный вечер: посмотрим сериал, заварим чай, поговорим. Будет тепло, спокойно и по-домашнему)</p>
        </div>

        <!-- Декоративная линия -->
        <div class="cozy-barcode">
            <span style="width:3px;"></span>
            <span style="width:2px;"></span>
            <span style="width:5px;"></span>
            <span style="width:2px;"></span>
            <span style="width:3px;"></span>
            <span style="width:6px;"></span>
            <span style="width:2px;"></span>
            <span style="width:4px;"></span>
            <span style="width:2px;"></span>
            <span style="width:3px;"></span>
            <span style="width:5px;"></span>
            <span style="width:2px;"></span>
            <span style="width:3px;"></span>
        </div>
    </div>
</div>

<script>
    (function() {
        // ===== СЕГОДНЯШНЯЯ ДАТА =====
        const dateEl = document.getElementById('todayDate');
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = String(now.getFullYear()).slice(-2);
        dateEl.textContent = day + '.' + month + '.' + year;

        const cozyBg = document.querySelector('.cozy-bg');

        // ===== ГЕНЕРАЦИЯ ИСКР (как от свечей) =====
        const sparkChars = ['✦', '✧', '·', '•', '˚', '✶'];
        const sparkColors = ['#ffd9a8', '#ffc98a', '#f5a55a', '#d97a35', '#ffe8c4'];

        for (let i = 0; i < 26; i++) {
            const spark = document.createElement('div');
            spark.className = 'cozy-spark';
            spark.textContent = sparkChars[Math.floor(Math.random() * sparkChars.length)];
            spark.style.left = (Math.random() * 96 + 2) + '%';
            const dur = Math.random() * 8 + 8;
            spark.style.setProperty('--s-dur', dur + 's');
            spark.style.animationDelay = (Math.random() * 20) + 's';
            const size = Math.random() * 1.1 + 0.7;
            spark.style.fontSize = size + 'rem';
            spark.style.color = sparkColors[Math.floor(Math.random() * sparkColors.length)];
            cozyBg.appendChild(spark);
        }

        // ===== ГЕНЕРАЦИЯ ПАРЯЩИХ EMOJI (уютная тематика) =====
        const emojis = ['🕯️', '☕', '🍵', '🧣', '🧸', '📖', '🎬', '🌙', '✨', '🍪', '🫖', '🪵'];

        for (let i = 0; i < 14; i++) {
            const emoji = document.createElement('div');
            emoji.className = 'cozy-emoji';
            emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.left = (Math.random() * 94 + 3) + '%';
            const dur = Math.random() * 12 + 14;
            emoji.style.setProperty('--e-dur', dur + 's');
            emoji.style.animationDelay = (Math.random() * 26) + 's';
            const size = Math.random() * 1.6 + 1.1;
            emoji.style.fontSize = size + 'rem';
            emoji.style.top = (Math.random() * -15 - 5) + 'vh';
            cozyBg.appendChild(emoji);
        }

        // ===== ГЕНЕРАЦИЯ МЕРЦАЮЩИХ ОГОНЬКОВ (гирлянда) =====
        for (let i = 0; i < 40; i++) {
            const light = document.createElement('div');
            light.className = 'cozy-fairy-light';
            const size = Math.random() * 6 + 3;
            light.style.width = size + 'px';
            light.style.height = size + 'px';
            light.style.left = (Math.random() * 100) + '%';
            light.style.top = (Math.random() * 60) + '%';
            const dur = Math.random() * 3 + 2.5;
            light.style.setProperty('--f-dur', dur + 's');
            light.style.animationDelay = (Math.random() * 8) + 's';

            const colors = ['#ffd9a8', '#ffc98a', '#ffe8c4', '#ffb070'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            light.style.background = color;
            light.style.boxShadow = `0 0 12px 4px ${color}90, 0 0 24px 8px ${color}40`;
            cozyBg.appendChild(light);
        }

        // ===== ГЕНЕРАЦИЯ ПУЛЬСИРУЮЩИХ ЧАСТИЦ =====
        for (let i = 0; i < 22; i++) {
            const particle = document.createElement('div');
            particle.className = 'cozy-particle';
            const size = Math.random() * 5 + 2;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = (Math.random() * 100) + '%';
            particle.style.top = (Math.random() * 100) + '%';
            const dur = Math.random() * 4 + 4;
            particle.style.setProperty('--pp-dur', dur + 's');
            particle.style.animationDelay = (Math.random() * 10) + 's';

            const color = sparkColors[Math.floor(Math.random() * sparkColors.length)];
            particle.style.background = color;
            particle.style.boxShadow = `0 0 10px 3px ${color}70, 0 0 20px 6px ${color}35`;
            cozyBg.appendChild(particle);
        }

        // ===== ЛЁГКИЙ ПАРАЛЛАКС ПРИ ДВИЖЕНИИ МЫШИ =====
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 2;
            const y = (e.clientY / window.innerHeight - 0.5) * 2;

            const sparks = document.querySelectorAll('.cozy-spark');
            sparks.forEach((el, i) => {
                const factor = (i % 4 + 1) * 1.5;
                el.style.marginLeft = (x * factor) + 'px';
                el.style.marginTop = (y * factor) + 'px';
            });

            const orbs = document.querySelectorAll('.cozy-orb');
            orbs.forEach((orb, i) => {
                const factor = (i + 1) * 4;
                orb.style.transform = `translate(${x * factor}px, ${y * factor}px)`;
            });

            const mists = document.querySelectorAll('.cozy-mist');
            mists.forEach((mist, i) => {
                const factor = (i + 1) * 2;
                mist.style.marginLeft = (x * factor) + 'px';
            });

            const emojis = document.querySelectorAll('.cozy-emoji');
            emojis.forEach((el, i) => {
                const factor = (i % 5 + 1) * 1.5;
                el.style.marginLeft = (x * factor) + 'px';
                el.style.marginTop = (y * factor) + 'px';
            });
        });
    })();
</script>

</body>
</html>
