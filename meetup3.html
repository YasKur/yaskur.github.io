<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 20px;
            background-image: url('./spa.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            overflow-x: hidden;
            font-family: 'Quicksand', sans-serif;
        }

        /* ——— Затемнение для романтичной дымки ——— */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(255, 200, 220, 0.25), rgba(80, 40, 80, 0.55));
            backdrop-filter: blur(4px);
            z-index: 0;
        }

        /* ——— Падающие звёзды (анимированные сердечки) ——— */
        .shooting-star {
            position: fixed;
            font-size: 1.6rem;
            color: #ffb3c6;
            opacity: 0.5;
            filter: drop-shadow(0 0 8px #ff8da1);
            animation: shootStar 10s linear infinite;
            pointer-events: none;
            z-index: 1;
        }
        .shooting-star:nth-child(1) { left: 5%; animation-delay: 0s; font-size: 1.8rem; }
        .shooting-star:nth-child(2) { left: 25%; animation-delay: 3s; font-size: 2.2rem; }
        .shooting-star:nth-child(3) { left: 55%; animation-delay: 6s; font-size: 1.4rem; }
        .shooting-star:nth-child(4) { left: 80%; animation-delay: 8.5s; font-size: 2rem; }
        .shooting-star:nth-child(5) { left: 92%; animation-delay: 2s; font-size: 1.2rem; }

        @keyframes shootStar {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0.5); opacity: 0; }
            5% { opacity: 0.8; transform: translateY(0) rotate(10deg) scale(1.1); }
            20% { opacity: 0.9; transform: translateY(20vh) rotate(20deg) scale(1); }
            40% { opacity: 0.5; transform: translateY(50vh) rotate(45deg) scale(0.8); }
            70% { opacity: 0.2; transform: translateY(90vh) rotate(60deg) scale(0.4); }
            100% { opacity: 0; transform: translateY(120vh) rotate(90deg) scale(0); }
        }

        /* ——— Контейнер — нежное стекло ——— */
        .container {
            position: relative;
            z-index: 10;
            backdrop-filter: blur(16px) saturate(1.4);
            -webkit-backdrop-filter: blur(16px) saturate(1.4);
            background: rgba(255, 230, 240, 0.25);
            border-radius: 56px 56px 48px 48px;
            padding: 40px 28px 36px;
            max-width: 460px;
            width: 100%;
            box-shadow:
                    0 30px 70px rgba(120, 50, 80, 0.5),
                    0 0 0 1px rgba(255, 200, 220, 0.25),
                    inset 0 1px 0 rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 200, 220, 0.2);
            transition: all 0.3s ease;
        }

        /* ——— Декоративные уголки (розовые цветы) ——— */
        .corner-moon {
            position: absolute;
            font-size: 1.8rem;
            opacity: 0.25;
            color: #ffb7c5;
            filter: drop-shadow(0 0 12px #ff99aa);
            user-select: none;
            pointer-events: none;
            animation: softPulse 3s ease-in-out infinite;
        }
        .corner-moon:nth-child(1) { top: 16px; left: 20px; animation-delay: 0s; }
        .corner-moon:nth-child(2) { top: 16px; right: 20px; animation-delay: 1s; }
        .corner-moon:nth-child(3) { bottom: 16px; left: 20px; animation-delay: 0.7s; }
        .corner-moon:nth-child(4) { bottom: 16px; right: 20px; animation-delay: 1.6s; }

        @keyframes softPulse {
            0%, 100% { transform: scale(0.9) rotate(0deg); opacity: 0.2; }
            50% { transform: scale(1.2) rotate(6deg); opacity: 0.5; }
        }

        /* ——— Основной экран ——— */
        .content-screen {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: center;
            animation: fadeRomance 1s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }

        @keyframes fadeRomance {
            0% { opacity: 0; transform: translateY(30px) scale(0.94); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .emoji-big {
            font-size: 4.8rem;
            display: block;
            margin-bottom: 0px;
            filter: drop-shadow(0 0 40px rgba(255, 130, 160, 0.5));
            animation: gentleFloat 5s ease-in-out infinite;
            line-height: 1.2;
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0) scale(1) rotate(-2deg); }
            50% { transform: translateY(-14px) scale(1.04) rotate(2deg); }
        }

        .content-title {
            font-family: 'Great Vibes', cursive;
            font-size: 2.6rem;
            font-weight: 400;
            color: #fff5f7;
            text-shadow: 0 0 30px rgba(255, 120, 160, 0.4), 0 4px 20px rgba(80, 20, 40, 0.3);
            letter-spacing: 1px;
            margin-top: 4px;
            background: linear-gradient(135deg, #ffe4ec, #ffb3c6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 40px rgba(255, 140, 170, 0.3);
        }

        .message-text {
            font-size: 1.1rem;
            color: #fff0f3;
            line-height: 1.9;
            max-width: 340px;
            margin: 0 auto;
            text-align: left;
            padding: 6px 8px;
            font-weight: 400;
            backdrop-filter: blur(2px);
            background: rgba(255, 200, 215, 0.08);
            border-radius: 32px;
            padding: 18px 20px 16px;
            border: 1px solid rgba(255, 200, 215, 0.2);
        }

        .message-text p {
            margin-bottom: 14px;
            font-weight: 300;
            letter-spacing: 0.3px;
            color: #ffeef2;
            text-shadow: 0 2px 12px rgba(0,0,0,0.2);
        }
        .message-text p:first-of-type {
            font-weight: 400;
            font-size: 1.15rem;
            color: #ffffff;
        }

        .message-text .highlight {
            color: #ffb3c9;
            font-weight: 600;
            background: rgba(255, 130, 160, 0.15);
            padding: 2px 14px;
            border-radius: 30px;
            display: inline-block;
            border: 1px solid rgba(255, 130, 160, 0.2);
            backdrop-filter: blur(4px);
            box-shadow: 0 0 20px rgba(255, 100, 130, 0.1);
        }

        .message-text .romantic-line {
            border-left: 3px solid #ff99b0;
            padding-left: 18px;
            color: #ffdbe3;
            font-style: italic;
            margin-top: 8px;
            font-weight: 300;
        }

        .message-text ul, .message-text ol {
            list-style: none;
            padding: 0;
            margin-top: 8px;
        }

        .message-text ol li {
            padding: 8px 0 8px 36px;
            margin-bottom: 4px;
            color: #fff5f7;
            font-weight: 300;
            position: relative;
            border-bottom: 1px dashed rgba(255, 180, 200, 0.15);
            transition: all 0.2s;
            border-radius: 8px;
        }

        .message-text ol li::before {
            content: "✦";
            position: absolute;
            left: 6px;
            top: 8px;
            color: #ffb0c5;
            font-size: 1.2rem;
            filter: drop-shadow(0 0 10px #ff8da1);
        }

        .message-text ol li:last-child {
            border-bottom: none;
        }

        /* ——— Дополнительная романтика: подпись ——— */
        .signature {
            font-family: 'Great Vibes', cursive;
            font-size: 1.8rem;
            color: #ffd1dc;
            text-align: right;
            margin-top: 6px;
            padding-right: 10px;
            opacity: 0.7;
            text-shadow: 0 0 20px rgba(255, 150, 180, 0.3);
            letter-spacing: 1px;
        }

        /* ——— Адаптив ——— */
        @media (max-width: 420px) {
            .container { padding: 30px 16px 24px; border-radius: 40px; }
            .content-title { font-size: 2.2rem; }
            .message-text { font-size: 0.95rem; padding: 14px 14px; }
            .emoji-big { font-size: 3.8rem; }
            .message-text ol li { padding: 6px 0 6px 30px; }
            .signature { font-size: 1.4rem; }
            .corner-moon { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<!-- Падающие звёзды (сердечки) -->
<span class="shooting-star">♥</span>
<span class="shooting-star">♥</span>
<span class="shooting-star">♥</span>
<span class="shooting-star">♥</span>
<span class="shooting-star">♥</span>

<div class="container" id="appContainer">
    <!-- Декоративные розовые цветы / луны -->
    <span class="corner-moon">🪷</span>
    <span class="corner-moon">🪷</span>
    <span class="corner-moon">🌸</span>
    <span class="corner-moon">🌸</span>

    <!-- ====== Основной экран ====== -->
    <div id="mainScreen" class="content-screen">
        <span class="emoji-big">🫧✨🪷</span>
        <div class="content-title">Приглашение 28.07.26</div>
        <div class="message-text">
            <p>Софья Эдуардовна,<br>наш план на вечер — только для двоих.</p>
            <ol>
                <li>Обсудим насушие дела</li>
                <li>Закажем покушать / приготовим покушать</li>
                <li>Согласуем план по Питеру</li>
                <li>Расслабляющая ванная</li>
            </ol>
        </div>
    </div>
</div>

</body>
</html>
