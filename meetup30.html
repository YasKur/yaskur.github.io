<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Приглашение на релакс-день 🌹</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Comfortaa:wght@400;600;700&family=Lobster&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Comfortaa', cursive;
            position: relative;
            overflow-x: hidden;
            background: #1c1220;
        }

        /* ============================================================
           НОВЫЙ ФОН: НЕЖНЫЙ СПА-РЕЛАКС
           ============================================================ */
        .spa-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background:
                    radial-gradient(ellipse 120% 90% at 15% 10%, #3a1f3d 0%, transparent 55%),
                    radial-gradient(ellipse 100% 80% at 85% 20%, #2c1a3a 0%, transparent 55%),
                    radial-gradient(ellipse 120% 100% at 50% 100%, #1a1024 0%, #120b18 60%, #0b0710 100%);
        }

        /* ——— Медленно дышащие цветовые волны ——— */
        .aura {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.55;
            pointer-events: none;
            mix-blend-mode: screen;
            animation: auraBreathe var(--a-dur, 22s) ease-in-out infinite alternate;
        }

        .aura-rose {
            width: 62vmax;
            height: 62vmax;
            background: radial-gradient(circle, rgba(255, 130, 170, 0.5), rgba(200, 90, 150, 0.15) 55%, transparent 72%);
            top: -22vmax;
            left: -18vmax;
            --a-dur: 26s;
        }

        .aura-lavender {
            width: 58vmax;
            height: 58vmax;
            background: radial-gradient(circle, rgba(170, 130, 255, 0.42), rgba(120, 90, 200, 0.12) 55%, transparent 72%);
            bottom: -24vmax;
            right: -16vmax;
            --a-dur: 30s;
            animation-delay: -8s;
        }

        .aura-peach {
            width: 44vmax;
            height: 44vmax;
            background: radial-gradient(circle, rgba(255, 190, 150, 0.38), transparent 68%);
            top: 35%;
            left: 55%;
            --a-dur: 24s;
            animation-delay: -14s;
        }

        .aura-mint {
            width: 40vmax;
            height: 40vmax;
            background: radial-gradient(circle, rgba(140, 230, 210, 0.22), transparent 68%);
            top: 8%;
            right: 12%;
            --a-dur: 28s;
            animation-delay: -5s;
        }

        @keyframes auraBreathe {
            0%   { transform: translate(0, 0) scale(1); opacity: 0.4; }
            50%  { transform: translate(3vmax, -2vmax) scale(1.12); opacity: 0.7; }
            100% { transform: translate(-2vmax, 3vmax) scale(1.05); opacity: 0.5; }
        }

        /* ——— Плавные световые волны (как шёлк) ——— */
        .silk-wave {
            position: absolute;
            left: -20%;
            width: 140%;
            height: 55vh;
            pointer-events: none;
            filter: blur(50px);
            opacity: 0.35;
            mix-blend-mode: screen;
            animation: silkDrift var(--w-dur, 30s) ease-in-out infinite alternate;
        }

        .wave-1 {
            top: 5%;
            background: linear-gradient(100deg,
            transparent 5%,
            rgba(255, 150, 190, 0.35) 30%,
            rgba(190, 150, 255, 0.28) 55%,
            rgba(150, 220, 255, 0.18) 75%,
            transparent 95%);
            --w-dur: 28s;
        }

        .wave-2 {
            top: 40%;
            background: linear-gradient(80deg,
            transparent 8%,
            rgba(200, 150, 255, 0.25) 32%,
            rgba(255, 175, 160, 0.28) 58%,
            rgba(160, 240, 220, 0.16) 78%,
            transparent 96%);
            --w-dur: 34s;
            animation-delay: -10s;
        }

        .wave-3 {
            top: 72%;
            background: linear-gradient(110deg,
            transparent 10%,
            rgba(255, 190, 150, 0.22) 35%,
            rgba(255, 140, 180, 0.24) 60%,
            rgba(180, 150, 255, 0.18) 82%,
            transparent 97%);
            --w-dur: 40s;
            animation-delay: -20s;
        }

        @keyframes silkDrift {
            0%   { transform: translateX(-6%) skewY(-2.5deg) scaleY(1); opacity: 0.22; }
            50%  { opacity: 0.45; }
            100% { transform: translateX(6%) skewY(2.5deg) scaleY(1.12); opacity: 0.3; }
        }

        /* ——— Лёгкая «вуаль» из мягких полос ——— */
        .veil {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            opacity: 0.5;
            background-image:
                    repeating-linear-gradient(115deg,
                    transparent 0px,
                    transparent 90px,
                    rgba(255, 200, 230, 0.025) 90px,
                    rgba(255, 200, 230, 0.025) 92px);
            animation: veilShift 24s linear infinite;
        }

        @keyframes veilShift {
            0%   { background-position: 0 0; }
            100% { background-position: 400px 200px; }
        }

        /* ============================================================
           ЛЕПЕСТКИ РОЗ — плавно кружатся и падают
           ============================================================ */
        .petal {
            position: absolute;
            top: -8vh;
            pointer-events: none;
            z-index: 4;
            opacity: 0;
            will-change: transform, opacity;
            animation: petalFall var(--p-dur, 18s) linear infinite;
            filter: drop-shadow(0 0 10px rgba(255, 150, 190, 0.55));
        }

        @keyframes petalFall {
            0% {
                transform: translate3d(0, 0, 0) rotate(0deg) scale(0.7);
                opacity: 0;
            }
            8%  { opacity: 0.9; }
            30% {
                transform: translate3d(40px, 30vh, 0) rotate(120deg) scale(1);
                opacity: 0.85;
            }
            60% {
                transform: translate3d(-50px, 65vh, 0) rotate(280deg) scale(0.95);
                opacity: 0.7;
            }
            90% { opacity: 0.35; }
            100% {
                transform: translate3d(30px, 112vh, 0) rotate(460deg) scale(0.8);
                opacity: 0;
            }
        }

        /* ——— Мыльные пузыри ——— */
        .bubble {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            animation: bubbleRise var(--b-dur, 16s) ease-in infinite;
            background:
                    radial-gradient(circle at 30% 25%, rgba(255,255,255,0.85), rgba(255,255,255,0.12) 28%, transparent 62%);
            border: 1px solid rgba(255, 220, 240, 0.35);
            box-shadow:
                    inset 0 0 14px rgba(255, 200, 235, 0.5),
                    0 0 18px rgba(220, 170, 255, 0.35);
        }

        @keyframes bubbleRise {
            0% {
                transform: translateY(20vh) translateX(0) scale(0.4);
                opacity: 0;
            }
            15% { opacity: 0.75; }
            50% {
                transform: translateY(-25vh) translateX(35px) scale(1);
                opacity: 0.55;
            }
            85% { opacity: 0.25; }
            100% {
                transform: translateY(-70vh) translateX(-30px) scale(1.15);
                opacity: 0;
            }
        }

        /* ——— Мерцающие блёстки-звёздочки ——— */
        .glint {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            animation: glintPulse var(--g-dur, 5s) ease-in-out infinite;
            filter: drop-shadow(0 0 6px currentColor);
        }

        @keyframes glintPulse {
            0%, 100% { transform: scale(0.3) rotate(0deg); opacity: 0; }
            50%      { transform: scale(1.15) rotate(90deg); opacity: 1; }
        }

        /* ——— Очень мягкие светлячки ——— */
        .firefly {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            animation: fireflyFloat var(--ff-dur, 14s) ease-in-out infinite;
        }

        @keyframes fireflyFloat {
            0%   { transform: translate(0, 0) scale(0.5); opacity: 0; }
            25%  { opacity: 0.85; }
            50%  { transform: translate(30px, -40px) scale(1.2); opacity: 0.6; }
            75%  { opacity: 0.9; }
            100% { transform: translate(-20px, -90px) scale(0.6); opacity: 0; }
        }

        /* ============================================================
           КАРТОЧКА-ПРИГЛАШЕНИЕ
           ============================================================ */
        .cozy-ticket {
            position: relative;
            z-index: 30;
            backdrop-filter: blur(24px) saturate(1.5);
            -webkit-backdrop-filter: blur(24px) saturate(1.5);
            background: rgba(38, 22, 34, 0.8);
            border-radius: 30px;
            padding: 28px 28px 30px;
            max-width: 490px;
            width: 100%;
            box-shadow:
                    0 30px 90px rgba(0, 0, 0, 0.8),
                    0 0 0 1px rgba(255, 180, 210, 0.4),
                    0 0 70px rgba(255, 140, 180, 0.22),
                    0 0 140px rgba(180, 130, 255, 0.16),
                    inset 0 1px 0 rgba(255, 230, 245, 0.28);
            border: 1px solid rgba(255, 185, 215, 0.4);
            transition: all 0.3s ease;
            animation: ticketIn 1.1s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }

        @keyframes ticketIn {
            0%   { opacity: 0; transform: translateY(60px) scale(0.85) rotate(-2deg); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
        }

        /* ===== ГИФКА С КОТОМ ===== */
        .cat-gif-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 6px;
            position: relative;
            z-index: 35;
        }

        .cat-gif {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 185, 215, 0.7);
            box-shadow:
                    0 0 34px rgba(255, 150, 190, 0.6),
                    0 0 70px rgba(200, 140, 255, 0.4),
                    0 0 110px rgba(255, 200, 230, 0.22);
            animation: catBounce 3.4s ease-in-out infinite;
            background: #2a1d2a;
        }

        @keyframes catBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.04); }
        }

        /* ===== УГОЛКИ-ЭМОДЗИ ===== */
        .cozy-corner {
            position: absolute;
            font-size: 1.7rem;
            opacity: 0.9;
            filter: drop-shadow(0 0 18px rgba(255, 160, 200, 0.8));
            user-select: none;
            pointer-events: none;
            animation: decorFloat 7.5s ease-in-out infinite;
            z-index: 32;
        }
        .cozy-corner:nth-child(1) { top: 14px; left: 16px; animation-delay: 0s; }
        .cozy-corner:nth-child(2) { top: 14px; right: 16px; animation-delay: 1.9s; }
        .cozy-corner:nth-child(3) { bottom: 14px; left: 16px; animation-delay: 3.8s; }
        .cozy-corner:nth-child(4) { bottom: 14px; right: 16px; animation-delay: 5.6s; }

        @keyframes decorFloat {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.6; }
            50%      { transform: translateY(-10px) rotate(9deg) scale(1.15); opacity: 1; }
        }

        /* ===== КОНТЕНТ ===== */
        .content-screen {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: center;
        }

        .cozy-subtitle {
            font-family: 'Lobster', cursive;
            font-size: 1.7rem;
            color: #ffd6ea;
            text-shadow: 0 0 30px rgba(255, 150, 190, 0.7), 0 0 60px rgba(200, 110, 180, 0.4);
            margin-bottom: 6px;
            transform: rotate(-2deg);
        }

        .cozy-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 8px 0;
            color: #ffcfe6;
            font-size: 1rem;
            letter-spacing: 4px;
            font-weight: 600;
        }

        .cozy-divider::before,
        .cozy-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 170, 210, 0.7), transparent);
            max-width: 80px;
        }

        .cozy-message {
            font-size: 1rem;
            color: #f7e6f2;
            line-height: 1.9;
            max-width: 380px;
            margin: 0 auto;
            text-align: center;
            font-weight: 400;
            background: rgba(30, 16, 28, 0.55);
            border-radius: 22px;
            padding: 24px 22px 20px;
            border: 1px solid rgba(255, 180, 215, 0.3);
            box-shadow: inset 0 1px 0 rgba(255, 230, 245, 0.16);
        }

        .cozy-message p {
            margin-bottom: 14px;
            font-weight: 400;
            color: #f7e6f2;
        }

        .cozy-message p:first-of-type {
            color: #ffd6ea;
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 18px;
            letter-spacing: 0.5px;
        }

        .cozy-message p:last-of-type {
            margin-bottom: 0;
            color: #ffd9ec;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.8px;
            line-height: 1.7;
            text-shadow: 0 0 25px rgba(255, 150, 190, 0.6);
        }

        /* ——— Список релакс-пунктов ——— */
        .relax-list {
            list-style: none;
            margin: 0 0 16px;
            padding: 0;
            text-align: left;
        }

        .relax-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            color: #ffd6ea;
            font-weight: 600;
            padding: 8px 12px;
            margin-bottom: 8px;
            background: rgba(255, 160, 205, 0.09);
            border-radius: 14px;
            border: 1px solid rgba(255, 180, 215, 0.26);
            line-height: 1.5;
        }

        .relax-list li span.relax-ico {
            font-size: 1.35rem;
            filter: drop-shadow(0 0 8px rgba(255, 160, 200, 0.85));
            flex-shrink: 0;
        }

        .cozy-barcode {
            display: flex;
            justify-content: center;
            gap: 3px;
            margin-top: 16px;
            opacity: 0.55;
        }

        .cozy-barcode span {
            display: block;
            height: 24px;
            background: linear-gradient(180deg, #ffc0dc, #d97ab0);
            border-radius: 1px;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 420px) {
            .cozy-ticket { padding: 22px 16px 24px; border-radius: 22px; }
            .cat-gif { width: 110px; height: 110px; }
            .cozy-subtitle { font-size: 1.3rem; }
            .cozy-message { font-size: 0.88rem; padding: 18px 14px; }
            .relax-list li { font-size: 0.85rem; padding: 7px 10px; }
            .cozy-corner { font-size: 1.3rem; }
            .petal, .bubble, .glint, .firefly, .aura, .silk-wave, .veil { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .petal, .bubble, .glint, .firefly, .aura, .silk-wave, .veil,
            .cat-gif, .cozy-corner, .cozy-ticket {
                animation: none !important;
            }
        }
    </style>
</head>
<body>

<!-- ===== НОВЫЙ НЕЖНЫЙ СПА-ФОН ===== -->
<div class="spa-bg">
    <!-- Дышащие цветовые ауры -->
    <div class="aura aura-rose"></div>
    <div class="aura aura-lavender"></div>
    <div class="aura aura-peach"></div>
    <div class="aura aura-mint"></div>

    <!-- Шёлковые световые волны -->
    <div class="silk-wave wave-1"></div>
    <div class="silk-wave wave-2"></div>
    <div class="silk-wave wave-3"></div>

    <!-- Тонкая вуаль -->
    <div class="veil"></div>
</div>

<!-- ===== КАРТОЧКА-ПРИГЛАШЕНИЕ ===== -->
<div class="cozy-ticket" id="appContainer">
    <span class="cozy-corner">🌹</span>
    <span class="cozy-corner">🛁</span>
    <span class="cozy-corner">💆‍♀️</span>
    <span class="cozy-corner">✨</span>

    <div id="mainScreen" class="content-screen">
        <div class="cozy-subtitle">Приглашение на релакс-день</div>

        <div class="cozy-divider">✦ <span id="todayDate">--.--.--</span> ✦</div>

        <div class="cozy-message">
            <p>Неповторимая Софья Эдуардовна!</p>
            <p>Приглашаю вас сегодня на релакс-день.</p>
            <ul class="relax-list">
                <li><span class="relax-ico">💺</span> Кресло-массажёр</li>
                <li><span class="relax-ico">🦶</span> Массаж ног</li>
                <li><span class="relax-ico">🛁</span> Ванная </li>
            </ul>

            <p>Ожидаю вас на балдежи🌹</p>
        </div>

        <div class="cozy-barcode">
            <span style="width:3px;"></span>
            <span style="width:2px;"></span>
            <span style="width:5px;"></span>
            <span style="width:2px;"></span>
            <span style="width:3px;"></span>
            <span style="width:6px;"></span>
            <span style="width:2px;"></span>
            <span style="width:4px;"></span>
            <span style="width:2px;"></span>
            <span style="width:3px;"></span>
            <span style="width:5px;"></span>
            <span style="width:2px;"></span>
            <span style="width:3px;"></span>
        </div>
    </div>
</div>

<script>
    (function() {
        // ===== СЕГОДНЯШНЯЯ ДАТА =====
        const dateEl = document.getElementById('todayDate');
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = String(now.getFullYear()).slice(-2);
        dateEl.textContent = day + '.' + month + '.' + year;

        const bg = document.querySelector('.spa-bg');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // ===== ЛЕПЕСТКИ РОЗ =====
        const petalColors = ['#ff9ec4', '#ff7fae', '#ffb3d1', '#e86fa8', '#ffc4dd', '#d96a9e'];
        const petalShapes = ['🌹', '🌸', '❀', '✿'];

        for (let i = 0; i < 18; i++) {
            const petal = document.createElement('div');
            petal.className = 'petal';
            // Часть — эмодзи-лепестки, часть — мягкие цветные фигуры
            if (i % 3 === 0) {
                petal.textContent = petalShapes[Math.floor(Math.random() * petalShapes.length)];
                petal.style.fontSize = (Math.random() * 1.4 + 0.9) + 'rem';
                petal.style.color = petalColors[Math.floor(Math.random() * petalColors.length)];
            } else {
                const w = Math.random() * 14 + 10;
                const h = w * (Math.random() * 0.5 + 0.55);
                petal.style.width = w + 'px';
                petal.style.height = h + 'px';
                petal.style.borderRadius = '60% 40% 55% 45% / 65% 55% 45% 35%';
                petal.style.background = `radial-gradient(circle at 35% 30%, ${
                    petalColors[Math.floor(Math.random() * petalColors.length)]
                }, rgba(255,140,190,0.25) 70%, transparent)`;
            }
            petal.style.left = (Math.random() * 96 + 2) + '%';
            const dur = Math.random() * 10 + 14;
            petal.style.setProperty('--p-dur', dur + 's');
            petal.style.animationDelay = (Math.random() * 24) + 's';
            bg.appendChild(petal);
        }

        // ===== МЫЛЬНЫЕ ПУЗЫРИ =====
        for (let i = 0; i < 14; i++) {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const size = Math.random() * 26 + 10;
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            bubble.style.left = (Math.random() * 94 + 3) + '%';
            bubble.style.bottom = (Math.random() * 40 - 10) + 'vh';
            const dur = Math.random() * 10 + 12;
            bubble.style.setProperty('--b-dur', dur + 's');
            bubble.style.animationDelay = (Math.random() * 18) + 's';
            bg.appendChild(bubble);
        }

        // ===== МЕРЦАЮЩИЕ БЛЁСТКИ =====
        const glintChars = ['✦', '✧', '✶', '⋆', '✺'];
        const glintColors = ['#ffd6ea', '#e0c8ff', '#ffe8c4', '#c8ffe8'];

        for (let i = 0; i < 30; i++) {
            const glint = document.createElement('div');
            glint.className = 'glint';
            glint.textContent = glintChars[Math.floor(Math.random() * glintChars.length)];
            const size = Math.random() * 0.9 + 0.5;
            glint.style.fontSize = size + 'rem';
            glint.style.left = (Math.random() * 98 + 1) + '%';
            glint.style.top = (Math.random() * 95 + 2) + '%';
            glint.style.color = glintColors[Math.floor(Math.random() * glintColors.length)];
            const dur = Math.random() * 3.5 + 2.5;
            glint.style.setProperty('--g-dur', dur + 's');
            glint.style.animationDelay = (Math.random() * 12) + 's';
            bg.appendChild(glint);
        }

        // ===== МЯГКИЕ СВЕТЛЯЧКИ =====
        const fireflyColors = ['#ffb3d1', '#c8a8ff', '#ffd9a8', '#a8ffe0'];

        for (let i = 0; i < 16; i++) {
            const firefly = document.createElement('div');
            firefly.className = 'firefly';
            const size = Math.random() * 5 + 2.5;
            firefly.style.width = size + 'px';
            firefly.style.height = size + 'px';
            firefly.style.left = (Math.random() * 96 + 2) + '%';
            firefly.style.top = (Math.random() * 90 + 5) + '%';
            const color = fireflyColors[Math.floor(Math.random() * fireflyColors.length)];
            firefly.style.background = color;
            firefly.style.boxShadow = `0 0 12px 4px ${color}99, 0 0 26px 10px ${color}40`;
            const dur = Math.random() * 8 + 8;
            firefly.style.setProperty('--ff-dur', dur + 's');
            firefly.style.animationDelay = (Math.random() * 14) + 's';
            bg.appendChild(firefly);
        }

        // ===== МЯГКИЙ ПАРАЛЛАКС (только если не отключена анимация) =====
        if (!reducedMotion) {
            let targetX = 0, targetY = 0;
            let curX = 0, curY = 0;

            document.addEventListener('mousemove', (e) => {
                targetX = (e.clientX / window.innerWidth - 0.5) * 2;
                targetY = (e.clientY / window.innerHeight - 0.5) * 2;
            });

            const auras = document.querySelectorAll('.aura');
            const waves = document.querySelectorAll('.silk-wave');
            const petals = document.querySelectorAll('.petal');

            function smoothLoop() {
                curX += (targetX - curX) * 0.045;
                curY += (targetY - curY) * 0.045;

                auras.forEach((a, i) => {
                    const f = (i + 1) * 8;
                    a.style.marginLeft = (curX * f) + 'px';
                    a.style.marginTop = (curY * f) + 'px';
                });

                waves.forEach((w, i) => {
                    const f = (i + 1) * 5;
                    w.style.marginLeft = (curX * f) + 'px';
                });

                petals.forEach((p, i) => {
                    const f = (i % 4 + 1) * 2.5;
                    p.style.marginLeft = (curX * f) + 'px';
                });

                requestAnimationFrame(smoothLoop);
            }
            smoothLoop();
        }
    })();
</script>

</body>
</html>
