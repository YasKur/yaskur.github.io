<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Отличного дня! ☀️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Comfortaa:wght@400;600;700&family=Lobster&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Comfortaa', cursive;
            position: relative;
            overflow-x: hidden;
            background: #fef9e7;
        }

        /* ============================================================
           ЯРКИЙ ДНЕВНОЙ ФОН — СОЛНЦЕ, ОБЛАКА, РАДОСТЬ
           ============================================================ */
        .day-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background:
                    radial-gradient(ellipse 120% 90% at 10% 15%, #ffe9b0 0%, transparent 55%),
                    radial-gradient(ellipse 100% 80% at 90% 25%, #ffd6a0 0%, transparent 55%),
                    radial-gradient(ellipse 130% 100% at 50% 100%, #fff3d6 0%, #ffe8b0 60%, #ffdda0 100%);
        }

        /* ——— Тёплые солнечные ауры ——— */
        .aura {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.6;
            pointer-events: none;
            mix-blend-mode: screen;
            animation: auraBreathe var(--a-dur, 24s) ease-in-out infinite alternate;
        }

        .aura-sun {
            width: 62vmax;
            height: 62vmax;
            background: radial-gradient(circle, rgba(255, 230, 120, 0.8), rgba(255, 200, 80, 0.25) 55%, transparent 72%);
            top: -22vmax;
            left: -18vmax;
            --a-dur: 28s;
        }

        .aura-peach {
            width: 58vmax;
            height: 58vmax;
            background: radial-gradient(circle, rgba(255, 190, 130, 0.6), rgba(255, 160, 100, 0.2) 55%, transparent 72%);
            bottom: -24vmax;
            right: -16vmax;
            --a-dur: 32s;
            animation-delay: -8s;
        }

        .aura-rose {
            width: 44vmax;
            height: 44vmax;
            background: radial-gradient(circle, rgba(255, 160, 180, 0.4), transparent 68%);
            top: 35%;
            left: 55%;
            --a-dur: 26s;
            animation-delay: -14s;
        }

        .aura-mint {
            width: 40vmax;
            height: 40vmax;
            background: radial-gradient(circle, rgba(160, 230, 200, 0.3), transparent 68%);
            top: 8%;
            right: 12%;
            --a-dur: 30s;
            animation-delay: -5s;
        }

        @keyframes auraBreathe {
            0%   { transform: translate(0, 0) scale(1); opacity: 0.45; }
            50%  { transform: translate(3vmax, -2vmax) scale(1.12); opacity: 0.75; }
            100% { transform: translate(-2vmax, 3vmax) scale(1.05); opacity: 0.55; }
        }

        /* ——— Лёгкие солнечные волны ——— */
        .sun-wave {
            position: absolute;
            left: -20%;
            width: 140%;
            height: 55vh;
            pointer-events: none;
            filter: blur(50px);
            opacity: 0.35;
            mix-blend-mode: screen;
            animation: waveDrift var(--w-dur, 32s) ease-in-out infinite alternate;
        }

        .wave-1 {
            top: 5%;
            background: linear-gradient(100deg,
            transparent 5%,
            rgba(255, 230, 140, 0.6) 30%,
            rgba(255, 210, 120, 0.5) 55%,
            rgba(255, 240, 180, 0.3) 75%,
            transparent 95%);
            --w-dur: 30s;
        }

        .wave-2 {
            top: 40%;
            background: linear-gradient(80deg,
            transparent 8%,
            rgba(255, 220, 150, 0.5) 32%,
            rgba(255, 200, 130, 0.5) 58%,
            rgba(255, 240, 190, 0.3) 78%,
            transparent 96%);
            --w-dur: 36s;
            animation-delay: -10s;
        }

        .wave-3 {
            top: 72%;
            background: linear-gradient(110deg,
            transparent 10%,
            rgba(255, 210, 140, 0.4) 35%,
            rgba(255, 190, 120, 0.45) 60%,
            rgba(255, 235, 170, 0.3) 82%,
            transparent 97%);
            --w-dur: 42s;
            animation-delay: -20s;
        }

        @keyframes waveDrift {
            0%   { transform: translateX(-6%) skewY(-2.5deg) scaleY(1); opacity: 0.25; }
            50%  { opacity: 0.5; }
            100% { transform: translateX(6%) skewY(2.5deg) scaleY(1.12); opacity: 0.3; }
        }

        /* ——— Лёгкая «дымка» ——— */
        .veil {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            opacity: 0.4;
            background-image:
                    repeating-linear-gradient(115deg,
                    transparent 0px,
                    transparent 90px,
                    rgba(255, 240, 200, 0.05) 90px,
                    rgba(255, 240, 200, 0.05) 92px);
            animation: veilShift 26s linear infinite;
        }

        @keyframes veilShift {
            0%   { background-position: 0 0; }
            100% { background-position: 400px 200px; }
        }

        /* ============================================================
           ЛЕГКИЕ ПАДАЮЩИЕ ЛЕПЕСТКИ / ИСКОРКИ — солнечное настроение
           ============================================================ */
        .petal {
            position: absolute;
            top: -8vh;
            pointer-events: none;
            z-index: 4;
            opacity: 0;
            will-change: transform, opacity;
            animation: petalFall var(--p-dur, 18s) linear infinite;
            filter: drop-shadow(0 0 10px rgba(255, 220, 120, 0.6));
        }

        @keyframes petalFall {
            0% {
                transform: translate3d(0, 0, 0) rotate(0deg) scale(0.7);
                opacity: 0;
            }
            8%  { opacity: 0.9; }
            30% {
                transform: translate3d(40px, 30vh, 0) rotate(120deg) scale(1);
                opacity: 0.85;
            }
            60% {
                transform: translate3d(-50px, 65vh, 0) rotate(280deg) scale(0.95);
                opacity: 0.7;
            }
            90% { opacity: 0.35; }
            100% {
                transform: translate3d(30px, 112vh, 0) rotate(460deg) scale(0.8);
                opacity: 0;
            }
        }

        /* ——— Лёгкие пузыри ——— */
        .bubble {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            animation: bubbleRise var(--b-dur, 16s) ease-in infinite;
            background:
                    radial-gradient(circle at 30% 25%, rgba(255, 250, 220, 0.9), rgba(255, 240, 200, 0.15) 28%, transparent 62%);
            border: 1px solid rgba(255, 230, 180, 0.5);
            box-shadow:
                    inset 0 0 14px rgba(255, 240, 200, 0.6),
                    0 0 18px rgba(255, 230, 160, 0.4);
        }

        @keyframes bubbleRise {
            0% {
                transform: translateY(20vh) translateX(0) scale(0.4);
                opacity: 0;
            }
            15% { opacity: 0.75; }
            50% {
                transform: translateY(-25vh) translateX(35px) scale(1);
                opacity: 0.55;
            }
            85% { opacity: 0.25; }
            100% {
                transform: translateY(-70vh) translateX(-30px) scale(1.15);
                opacity: 0;
            }
        }

        /* ——— Мерцающие солнечные зайчики ——— */
        .glint {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            animation: glintPulse var(--g-dur, 5s) ease-in-out infinite;
            filter: drop-shadow(0 0 6px currentColor);
        }

        @keyframes glintPulse {
            0%, 100% { transform: scale(0.3) rotate(0deg); opacity: 0; }
            50%      { transform: scale(1.15) rotate(90deg); opacity: 1; }
        }

        /* ——— Очень мягкие «солнечные точки» ——— */
        .sunspot {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            animation: sunspotFloat var(--ff-dur, 14s) ease-in-out infinite;
        }

        @keyframes sunspotFloat {
            0%   { transform: translate(0, 0) scale(0.5); opacity: 0; }
            25%  { opacity: 0.85; }
            50%  { transform: translate(30px, -40px) scale(1.2); opacity: 0.6; }
            75%  { opacity: 0.9; }
            100% { transform: translate(-20px, -90px) scale(0.6); opacity: 0; }
        }

        /* ============================================================
           КАРТОЧКА-ПОЖЕЛАНИЕ
           ============================================================ */
        .cheer-card {
            position: relative;
            z-index: 30;
            backdrop-filter: blur(24px) saturate(1.5);
            -webkit-backdrop-filter: blur(24px) saturate(1.5);
            background: rgba(255, 252, 240, 0.85);
            border-radius: 30px;
            padding: 28px 28px 30px;
            max-width: 490px;
            width: 100%;
            box-shadow:
                    0 30px 90px rgba(180, 150, 80, 0.25),
                    0 0 0 1px rgba(255, 220, 150, 0.8),
                    0 0 70px rgba(255, 210, 100, 0.3),
                    0 0 140px rgba(255, 190, 80, 0.2),
                    inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 220, 150, 0.9);
            transition: all 0.3s ease;
            animation: cardIn 1.1s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }

        @keyframes cardIn {
            0%   { opacity: 0; transform: translateY(60px) scale(0.85) rotate(-2deg); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
        }

        /* ===== ГИФКА С КОТОМ ===== */
        .cat-gif-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 6px;
            position: relative;
            z-index: 35;
        }

        .cat-gif {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 210, 120, 0.9);
            box-shadow:
                    0 0 34px rgba(255, 200, 100, 0.6),
                    0 0 70px rgba(255, 170, 70, 0.4),
                    0 0 110px rgba(255, 240, 180, 0.3);
            animation: catBounce 3.4s ease-in-out infinite;
            background: #fff8e6;
        }

        @keyframes catBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.04); }
        }

        /* ===== УГОЛКИ-ЭМОДЗИ ===== */
        .cozy-corner {
            position: absolute;
            font-size: 1.7rem;
            opacity: 0.9;
            filter: drop-shadow(0 0 18px rgba(255, 200, 100, 0.9));
            user-select: none;
            pointer-events: none;
            animation: decorFloat 7.5s ease-in-out infinite;
            z-index: 32;
        }
        .cozy-corner:nth-child(1) { top: 14px; left: 16px; animation-delay: 0s; }
        .cozy-corner:nth-child(2) { top: 14px; right: 16px; animation-delay: 1.9s; }
        .cozy-corner:nth-child(3) { bottom: 14px; left: 16px; animation-delay: 3.8s; }
        .cozy-corner:nth-child(4) { bottom: 14px; right: 16px; animation-delay: 5.6s; }

        @keyframes decorFloat {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.6; }
            50%      { transform: translateY(-10px) rotate(9deg) scale(1.15); opacity: 1; }
        }

        /* ===== КОНТЕНТ ===== */
        .content-screen {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: center;
        }

        .cheer-subtitle {
            font-family: 'Lobster', cursive;
            font-size: 1.9rem;
            color: #d4721a;
            text-shadow: 0 0 30px rgba(255, 200, 80, 0.8), 0 0 60px rgba(255, 160, 50, 0.4);
            margin-bottom: 6px;
            transform: rotate(-2deg);
            letter-spacing: 1px;
        }

        .cheer-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 8px 0;
            color: #e08a30;
            font-size: 1rem;
            letter-spacing: 4px;
            font-weight: 700;
        }

        .cheer-divider::before,
        .cheer-divider::after {
            content: '';
            flex: 1;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, rgba(230, 150, 60, 0.7), transparent);
            max-width: 80px;
        }

        .cheer-message {
            font-size: 1rem;
            color: #5a3e1a;
            line-height: 1.9;
            max-width: 380px;
            margin: 0 auto;
            text-align: center;
            font-weight: 400;
            background: rgba(255, 250, 235, 0.9);
            border-radius: 22px;
            padding: 24px 22px 20px;
            border: 1px solid rgba(255, 210, 130, 0.7);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .cheer-message p {
            margin-bottom: 14px;
            font-weight: 400;
            color: #5a3e1a;
        }

        .cheer-message p:first-of-type {
            color: #c06a18;
            font-weight: 700;
            font-size: 1.15rem;
            margin-bottom: 18px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 20px rgba(255, 200, 100, 0.5);
        }

        .cheer-message p:last-of-type {
            margin-bottom: 0;
            color: #8a5a20;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.8px;
            line-height: 1.7;
            text-shadow: 0 0 25px rgba(255, 200, 100, 0.6);
        }

        /* ——— Список радостных пунктов ——— */
        .joy-list {
            list-style: none;
            margin: 0 0 16px;
            padding: 0;
            text-align: left;
        }

        .joy-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            color: #6a4820;
            font-weight: 600;
            padding: 8px 12px;
            margin-bottom: 8px;
            background: rgba(255, 220, 150, 0.3);
            border-radius: 14px;
            border: 1px solid rgba(255, 200, 120, 0.6);
            line-height: 1.5;
        }

        .joy-list li span.joy-ico {
            font-size: 1.35rem;
            filter: drop-shadow(0 0 8px rgba(255, 200, 100, 0.9));
            flex-shrink: 0;
        }

        .cheer-barcode {
            display: flex;
            justify-content: center;
            gap: 3px;
            margin-top: 16px;
            opacity: 0.5;
        }

        .cheer-barcode span {
            display: block;
            height: 24px;
            background: linear-gradient(180deg, #f0c060, #d49030);
            border-radius: 1px;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 420px) {
            .cheer-card { padding: 22px 16px 24px; border-radius: 22px; }
            .cat-gif { width: 110px; height: 110px; }
            .cheer-subtitle { font-size: 1.5rem; }
            .cheer-message { font-size: 0.88rem; padding: 18px 14px; }
            .joy-list li { font-size: 0.85rem; padding: 7px 10px; }
            .cozy-corner { font-size: 1.3rem; }
            .petal, .bubble, .glint, .sunspot, .aura, .sun-wave, .veil { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .petal, .bubble, .glint, .sunspot, .aura, .sun-wave, .veil,
            .cat-gif, .cozy-corner, .cheer-card {
                animation: none !important;
            }
        }
    </style>
</head>
<body>

<!-- ===== ДНЕВНОЙ ФОН ===== -->
<div class="day-bg">
    <!-- Солнечные ауры -->
    <div class="aura aura-sun"></div>
    <div class="aura aura-peach"></div>
    <div class="aura aura-rose"></div>
    <div class="aura aura-mint"></div>

    <!-- Тёплые волны -->
    <div class="sun-wave wave-1"></div>
    <div class="sun-wave wave-2"></div>
    <div class="sun-wave wave-3"></div>

    <!-- Лёгкая дымка -->
    <div class="veil"></div>
</div>

<!-- ===== КАРТОЧКА-ПОЖЕЛАНИЕ ===== -->
<div class="cheer-card" id="appContainer">
    <span class="cozy-corner">☀️</span>
    <span class="cozy-corner">🌻</span>
    <span class="cozy-corner">🌞</span>
    <span class="cozy-corner">✨</span>

    <div id="mainScreen" class="content-screen">
        <div class="cheer-subtitle">Отличного дня!</div>

        <div class="cheer-divider">✦ <span id="todayDate">--.--.--</span> ✦</div>

        <div class="cheer-message">
            <p>Добрая Софья Эдуардовна!</p>
            <p></p>
            <ul class="joy-list">
                <li><span class="joy-ico">🌞</span> Яркое солнышко</li>
                <li><span class="joy-ico">🌸</span> Цветущее настроение</li>
                <li><span class="joy-ico">😊</span> Улыбки и радость</li>
            </ul>
            <p>Пусть каждый момент сегодня будет наполнен светом и теплом! ✨</p>
        </div>

        <div class="cheer-barcode">
            <span style="width:3px;"></span>
            <span style="width:2px;"></span>
            <span style="width:5px;"></span>
            <span style="width:2px;"></span>
            <span style="width:3px;"></span>
            <span style="width:6px;"></span>
            <span style="width:2px;"></span>
            <span style="width:4px;"></span>
            <span style="width:2px;"></span>
            <span style="width:3px;"></span>
            <span style="width:5px;"></span>
            <span style="width:2px;"></span>
            <span style="width:3px;"></span>
        </div>
    </div>
</div>

<script>
    (function() {
        // ===== СЕГОДНЯШНЯЯ ДАТА =====
        const dateEl = document.getElementById('todayDate');
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = String(now.getFullYear()).slice(-2);
        dateEl.textContent = day + '.' + month + '.' + year;

        const bg = document.querySelector('.day-bg');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // ===== ЛЕПЕСТКИ / ИСКОРКИ =====
        const petalColors = ['#ffd966', '#ffb347', '#ffcc80', '#ffe082', '#ffab40', '#ffd54f'];
        const petalShapes = ['✦', '✧', '❀', '✿', '✾'];

        for (let i = 0; i < 18; i++) {
            const petal = document.createElement('div');
            petal.className = 'petal';
            if (i % 3 === 0) {
                petal.textContent = petalShapes[Math.floor(Math.random() * petalShapes.length)];
                petal.style.fontSize = (Math.random() * 1.4 + 0.9) + 'rem';
                petal.style.color = petalColors[Math.floor(Math.random() * petalColors.length)];
            } else {
                const w = Math.random() * 14 + 10;
                const h = w * (Math.random() * 0.5 + 0.55);
                petal.style.width = w + 'px';
                petal.style.height = h + 'px';
                petal.style.borderRadius = '60% 40% 55% 45% / 65% 55% 45% 35%';
                petal.style.background = `radial-gradient(circle at 35% 30%, ${
                    petalColors[Math.floor(Math.random() * petalColors.length)]
                }, rgba(255,220,120,0.3) 70%, transparent)`;
            }
            petal.style.left = (Math.random() * 96 + 2) + '%';
            const dur = Math.random() * 10 + 14;
            petal.style.setProperty('--p-dur', dur + 's');
            petal.style.animationDelay = (Math.random() * 24) + 's';
            bg.appendChild(petal);
        }

        // ===== ПУЗЫРИ =====
        for (let i = 0; i < 14; i++) {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const size = Math.random() * 26 + 10;
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            bubble.style.left = (Math.random() * 94 + 3) + '%';
            bubble.style.bottom = (Math.random() * 40 - 10) + 'vh';
            const dur = Math.random() * 10 + 12;
            bubble.style.setProperty('--b-dur', dur + 's');
            bubble.style.animationDelay = (Math.random() * 18) + 's';
            bg.appendChild(bubble);
        }

        // ===== МЕРЦАЮЩИЕ ЗАЙЧИКИ =====
        const glintChars = ['✦', '✧', '✶', '⋆', '✺'];
        const glintColors = ['#ffd966', '#ffe082', '#ffcc80', '#ffb347'];

        for (let i = 0; i < 30; i++) {
            const glint = document.createElement('div');
            glint.className = 'glint';
            glint.textContent = glintChars[Math.floor(Math.random() * glintChars.length)];
            const size = Math.random() * 0.9 + 0.5;
            glint.style.fontSize = size + 'rem';
            glint.style.left = (Math.random() * 98 + 1) + '%';
            glint.style.top = (Math.random() * 95 + 2) + '%';
            glint.style.color = glintColors[Math.floor(Math.random() * glintColors.length)];
            const dur = Math.random() * 3.5 + 2.5;
            glint.style.setProperty('--g-dur', dur + 's');
            glint.style.animationDelay = (Math.random() * 12) + 's';
            bg.appendChild(glint);
        }

        // ===== СОЛНЕЧНЫЕ ТОЧКИ =====
        const sunspotColors = ['#ffd966', '#ffe082', '#ffcc80', '#ffb347'];

        for (let i = 0; i < 16; i++) {
            const sunspot = document.createElement('div');
            sunspot.className = 'sunspot';
            const size = Math.random() * 5 + 2.5;
            sunspot.style.width = size + 'px';
            sunspot.style.height = size + 'px';
            sunspot.style.left = (Math.random() * 96 + 2) + '%';
            sunspot.style.top = (Math.random() * 90 + 5) + '%';
            const color = sunspotColors[Math.floor(Math.random() * sunspotColors.length)];
            sunspot.style.background = color;
            sunspot.style.boxShadow = `0 0 12px 4px ${color}99, 0 0 26px 10px ${color}40`;
            const dur = Math.random() * 8 + 8;
            sunspot.style.setProperty('--ff-dur', dur + 's');
            sunspot.style.animationDelay = (Math.random() * 14) + 's';
            bg.appendChild(sunspot);
        }

        // ===== МЯГКИЙ ПАРАЛЛАКС =====
        if (!reducedMotion) {
            let targetX = 0, targetY = 0;
            let curX = 0, curY = 0;

            document.addEventListener('mousemove', (e) => {
                targetX = (e.clientX / window.innerWidth - 0.5) * 2;
                targetY = (e.clientY / window.innerHeight - 0.5) * 2;
            });

            const auras = document.querySelectorAll('.aura');
            const waves = document.querySelectorAll('.sun-wave');
            const petals = document.querySelectorAll('.petal');

            function smoothLoop() {
                curX += (targetX - curX) * 0.045;
                curY += (targetY - curY) * 0.045;

                auras.forEach((a, i) => {
                    const f = (i + 1) * 8;
                    a.style.marginLeft = (curX * f) + 'px';
                    a.style.marginTop = (curY * f) + 'px';
                });

                waves.forEach((w, i) => {
                    const f = (i + 1) * 5;
                    w.style.marginLeft = (curX * f) + 'px';
                });

                petals.forEach((p, i) => {
                    const f = (i % 4 + 1) * 2.5;
                    p.style.marginLeft = (curX * f) + 'px';
                });

                requestAnimationFrame(smoothLoop);
            }
            smoothLoop();
        }
    })();
</script>

</body>
</html>
