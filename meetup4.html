<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>✨ 02.08.26 ✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: url('./nike.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            overflow-x: hidden;
            font-family: 'Pacifico', sans-serif;
        }

        /* ——— Тёплое вечернее свечение ——— */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                    radial-gradient(ellipse at 50% 80%, rgba(255, 180, 160, 0.12) 0%, transparent 60%),
                    radial-gradient(ellipse at 30% 20%, rgba(255, 140, 180, 0.08) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        /* ——— Мерцающие свечи (декоративные огоньки) ——— */
        .candle-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
            z-index: 0;
            animation: flickerGlow 4s ease-in-out infinite alternate;
        }
        .candle-glow:nth-child(1) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 180, 130, 0.25), transparent 70%);
            bottom: -50px;
            left: -80px;
            animation-delay: 0s;
        }
        .candle-glow:nth-child(2) {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(255, 140, 170, 0.2), transparent 70%);
            top: 20px;
            right: -60px;
            animation-delay: 2s;
        }
        .candle-glow:nth-child(3) {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255, 200, 180, 0.15), transparent 70%);
            bottom: 30px;
            right: 30px;
            animation-delay: 1s;
        }

        @keyframes flickerGlow {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* ——— Падающие звёзды (нежные сердечки) ——— */
        .shooting-star {
            position: fixed;
            font-size: 1.2rem;
            color: #ffb3c6;
            opacity: 0.3;
            filter: drop-shadow(0 0 12px #ff8da1);
            animation: shootStar 12s linear infinite;
            pointer-events: none;
            z-index: 1;
        }
        .shooting-star:nth-child(4) { left: 5%; animation-delay: 0s; font-size: 1.4rem; }
        .shooting-star:nth-child(5) { left: 25%; animation-delay: 4s; font-size: 1.8rem; }
        .shooting-star:nth-child(6) { left: 55%; animation-delay: 7s; font-size: 1.2rem; }
        .shooting-star:nth-child(7) { left: 80%; animation-delay: 10s; font-size: 1.6rem; }
        .shooting-star:nth-child(8) { left: 92%; animation-delay: 2.5s; font-size: 1rem; }

        @keyframes shootStar {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0.5); opacity: 0; }
            5% { opacity: 0.6; transform: translateY(0) rotate(10deg) scale(1); }
            25% { opacity: 0.7; transform: translateY(25vh) rotate(20deg) scale(1.1); }
            50% { opacity: 0.4; transform: translateY(55vh) rotate(45deg) scale(0.8); }
            75% { opacity: 0.2; transform: translateY(85vh) rotate(60deg) scale(0.5); }
            100% { opacity: 0; transform: translateY(120vh) rotate(90deg) scale(0); }
        }

        /* ——— Контейнер — тёплое матовое стекло ——— */
        .container {
            position: relative;
            z-index: 10;
            backdrop-filter: blur(20px) saturate(1.3);
            -webkit-backdrop-filter: blur(20px) saturate(1.3);
            background: rgba(60, 30, 45, 0.35);
            border-radius: 60px 60px 50px 50px;
            padding: 20px 24px 20px;
            max-width: 460px;
            width: 100%;
            box-shadow:
                    0 40px 80px rgba(0, 0, 0, 0.6),
                    0 0 0 1px rgba(255, 200, 210, 0.12),
                    inset 0 1px 0 rgba(255, 220, 230, 0.15),
                    inset 0 -1px 0 rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 200, 210, 0.08);
            transition: all 0.4s ease;
        }

        /* ——— Декоративные свечи и цветы ——— */
        .corner-moon {
            position: absolute;
            font-size: 1.6rem;
            opacity: 0.2;
            color: #ffb7c5;
            filter: drop-shadow(0 0 20px #ff99aa);
            user-select: none;
            pointer-events: none;
            animation: softPulse 4s ease-in-out infinite;
        }
        .corner-moon:nth-child(1) { top: 14px; left: 18px; animation-delay: 0s; }
        .corner-moon:nth-child(2) { top: 14px; right: 18px; animation-delay: 1.2s; }
        .corner-moon:nth-child(3) { bottom: 14px; left: 18px; animation-delay: 0.6s; }
        .corner-moon:nth-child(4) { bottom: 14px; right: 18px; animation-delay: 2s; }

        @keyframes softPulse {
            0%, 100% { transform: scale(0.9) rotate(0deg); opacity: 0.15; }
            50% { transform: scale(1.2) rotate(8deg); opacity: 0.4; }
        }

        /* ——— Основной контент ——— */
        .content-screen {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: center;
            animation: fadeRomance 1.2s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }

        @keyframes fadeRomance {
            0% { opacity: 0; transform: translateY(40px) scale(0.92); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .emoji-big {
            font-size: 2.6rem;
            display: block;
            margin-bottom: 2px;
            filter: drop-shadow(0 0 50px rgba(255, 130, 160, 0.3));
            animation: gentleFloat 6s ease-in-out infinite;
            line-height: 1.2;
            letter-spacing: 8px;
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0) scale(1) rotate(-1deg); }
            50% { transform: translateY(-12px) scale(1.05) rotate(1deg); }
        }

        .content-title {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            font-weight: 400;
            background: linear-gradient(135deg, #fce4ec, #f8b4c8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 60px rgba(255, 140, 170, 0.15);
            letter-spacing: 2px;
            margin-top: 2px;
        }

        .message-text {
            font-size: 1.05rem;
            color: #f5e6ec;
            line-height: 1.8;
            max-width: 340px;
            margin: 0 auto;
            text-align: left;
            padding: 6px 8px;
            font-weight: 300;
            backdrop-filter: blur(4px);
            background: rgba(80, 40, 60, 0.25);
            border-radius: 32px;
            padding: 20px 22px 18px;
            border: 1px solid rgba(255, 200, 215, 0.08);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .message-text p {
            margin-bottom: 16px;
            font-weight: 300;
            color: #f5e6ec;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
            font-size: 1rem;
        }
        .message-text p:first-of-type {
            color: #ffeef2;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .message-text .highlight {
            color: #fbc4d0;
            font-weight: 500;
            background: rgba(255, 130, 160, 0.12);
            padding: 2px 16px;
            border-radius: 30px;
            display: inline-block;
            border: 1px solid rgba(255, 130, 160, 0.1);
            backdrop-filter: blur(4px);
            box-shadow: 0 0 30px rgba(255, 100, 130, 0.05);
        }

        .message-text .romantic-line {
            border-left: 3px solid #e8a0b5;
            padding-left: 18px;
            color: #e8d0d8;
            font-style: italic;
            margin-top: 12px;
            font-weight: 300;
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .message-text ul, .message-text ol {
            list-style: none;
            padding: 0;
            margin-top: 6px;
        }

        .message-text ol li {
            padding: 10px 0 10px 40px;
            margin-bottom: 4px;
            color: #f5e6ec;
            font-weight: 300;
            position: relative;
            border-bottom: 1px solid rgba(255, 180, 200, 0.06);
            transition: all 0.2s;
            border-radius: 8px;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
        }

        .message-text ol li::before {
            content: "🕯️";
            position: absolute;
            left: 4px;
            top: 10px;
            font-size: 1.1rem;
            filter: drop-shadow(0 0 12px rgba(255, 180, 130, 0.3));
        }

        .message-text ol li:last-child {
            border-bottom: none;
        }

        .message-text ol li:hover {
            background: rgba(255, 200, 215, 0.04);
        }

        /* ——— Подпись ——— */
        .signature {
            font-family: 'Great Vibes', cursive;
            font-size: 1.8rem;
            color: #e8c8d4;
            text-align: right;
            margin-top: 4px;
            padding-right: 12px;
            opacity: 0.5;
            text-shadow: 0 0 30px rgba(255, 150, 180, 0.1);
            letter-spacing: 1px;
        }

        /* ——— Адаптив ——— */
        @media (max-width: 420px) {
            .container { padding: 30px 14px 22px; border-radius: 44px; }
            .content-title { font-size: 2.2rem; }
            .message-text { font-size: 0.9rem; padding: 14px 16px; }
            .emoji-big { font-size: 2rem; }
            .message-text ol li { padding: 8px 0 8px 34px; font-size: 0.85rem; }
            .signature { font-size: 1.4rem; }
            .corner-moon { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<!-- Тёплое свечение (имитация свечей) -->
<div class="candle-glow"></div>
<div class="candle-glow"></div>
<div class="candle-glow"></div>

<!-- Падающие звёзды (сердечки) -->
<span class="shooting-star">♥</span>
<span class="shooting-star">♥</span>
<span class="shooting-star">♥</span>
<span class="shooting-star">♥</span>
<span class="shooting-star">♥</span>

<div class="container" id="appContainer">
    <!-- Декоративные свечи / цветы -->
    <span class="corner-moon">🕯️</span>
    <span class="corner-moon">🕯️</span>
    <span class="corner-moon">🌹</span>
    <span class="corner-moon">🌹</span>

    <!-- ====== Основной экран ====== -->
    <div id="mainScreen" class="content-screen">
        <span class="emoji-big">🕯️🌙✨</span>
        <div class="content-title">Приглашение</div>
        <div class="message-text">
            <p>Софья Эдуардовна, наш план на вечер</p>
            <ol>
                <li>Обсудим насущные дела</li>
                <li>Покушаем</li>
                <li>Начнем собирать новый букет</li>
                <li>Просто зачилимся </li>
            </ol>
            <div class="romantic-line">
                Пусть сегоднящний день приносит только положительные эмоции!
            </div>
        </div>
    </div>
</div>

</body>
</html>
