<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>12.08.26</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        /* ——— Сбросы ——— */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #03050e;
            font-family: 'Pacifico', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* ——— ГЛУБОКОЕ ЗВЁЗДНОЕ НЕБО ——— */
        .starfield {
            position: fixed;
            inset: 0;
            background:
                    radial-gradient(ellipse at 30% 20%, #0a1a3a 0%, #03050e 80%),
                    radial-gradient(ellipse at 70% 80%, #0e1a2f 0%, #000000 90%);
            z-index: 0;
        }

        /* ——— МЕРЦАЮЩИЕ ЗВЁЗДЫ (сотни точек) ——— */
        .stars-layer {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        .star-point {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            opacity: 0.3;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.2);
        }

        @keyframes twinkle {
            0% { opacity: 0.15; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.4); }
        }

        /* ——— ЗВЕЗДОПАД (интенсивный) ——— */
        .meteor-shower {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .meteor {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 12px 2px rgba(180, 210, 255, 0.6);
            animation: meteorFall var(--speed) linear infinite;
            opacity: 0;
        }

        .meteor::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 120px;
            height: 1.5px;
            background: linear-gradient(to left, rgba(200, 230, 255, 0.9), transparent);
            transform: rotate(-38deg);
            transform-origin: right center;
            border-radius: 2px;
            filter: drop-shadow(0 0 10px rgba(150, 200, 255, 0.3));
        }

        /* У разных метеоров своя траектория и задержка */
        .meteor:nth-child(1)  { left: 10%; top: 5%;  --speed: 8s; animation-delay: 0s; }
        .meteor:nth-child(2)  { left: 25%; top: 2%;  --speed: 11s; animation-delay: 1.2s; }
        .meteor:nth-child(3)  { left: 45%; top: 8%;  --speed: 9s; animation-delay: 3.8s; }
        .meteor:nth-child(4)  { left: 60%; top: 1%;  --speed: 12s; animation-delay: 0.7s; }
        .meteor:nth-child(5)  { left: 75%; top: 6%;  --speed: 7s; animation-delay: 5.2s; }
        .meteor:nth-child(6)  { left: 88%; top: 3%;  --speed: 10s; animation-delay: 2.4s; }
        .meteor:nth-child(7)  { left: 5%;  top: 12%; --speed: 13s; animation-delay: 4.1s; }
        .meteor:nth-child(8)  { left: 35%; top: 15%; --speed: 8.5s; animation-delay: 6.0s; }
        .meteor:nth-child(9)  { left: 55%; top: 10%; --speed: 9.5s; animation-delay: 3.0s; }
        .meteor:nth-child(10) { left: 70%; top: 18%; --speed: 11.5s; animation-delay: 1.8s; }
        .meteor:nth-child(11) { left: 15%; top: 22%; --speed: 7.8s; animation-delay: 5.5s; }
        .meteor:nth-child(12) { left: 82%; top: 25%; --speed: 10.2s; animation-delay: 0.3s; }
        .meteor:nth-child(13) { left: 48%; top: 28%; --speed: 12.8s; animation-delay: 4.7s; }
        .meteor:nth-child(14) { left: 92%; top: 14%; --speed: 9.0s; animation-delay: 2.9s; }
        .meteor:nth-child(15) { left: 20%; top: 32%; --speed: 11.0s; animation-delay: 6.4s; }

        @keyframes meteorFall {
            0% {
                opacity: 0;
                transform: translate(0, 0) scale(0.5);
            }
            4% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            18% {
                opacity: 0.9;
                transform: translate(-220px, 180px) scale(1);
            }
            35% {
                opacity: 0.4;
                transform: translate(-480px, 380px) scale(0.6);
            }
            60% {
                opacity: 0;
                transform: translate(-700px, 580px) scale(0.2);
            }
            100% {
                opacity: 0;
                transform: translate(-900px, 780px) scale(0);
            }
        }

        /* ——— КОСМИЧЕСКИЙ ТУМАН / СВЕЧЕНИЕ ——— */
        .nebula-glow {
            position: fixed;
            inset: 0;
            background:
                    radial-gradient(ellipse at 20% 30%, rgba(60, 120, 255, 0.10) 0%, transparent 50%),
                    radial-gradient(ellipse at 85% 70%, rgba(160, 80, 255, 0.07) 0%, transparent 45%),
                    radial-gradient(ellipse at 50% 50%, rgba(30, 80, 200, 0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
            animation: nebulaPulse 12s ease-in-out infinite alternate;
        }

        @keyframes nebulaPulse {
            0% { opacity: 0.5; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.06); }
        }

        /* ——— Планеты-декор (редкие, чтобы не мешать звёздам) ——— */
        .planet {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            filter: blur(2px);
            animation: planetDrift 25s linear infinite;
            opacity: 0.25;
        }
        .planet-1 {
            width: 80px; height: 80px;
            background: radial-gradient(circle at 30% 30%, #7a8aff, #2a1f5a);
            bottom: -20px; left: -10px;
            box-shadow: 0 0 70px rgba(80, 100, 255, 0.15);
        }
        .planet-2 {
            width: 120px; height: 120px;
            background: radial-gradient(circle at 60% 40%, #f09a8a, #6a2a4a);
            top: -40px; right: -40px;
            box-shadow: 0 0 90px rgba(255, 100, 100, 0.10);
            animation-duration: 35s;
        }
        .planet-3 {
            width: 50px; height: 50px;
            background: radial-gradient(circle at 40% 40%, #b0d8ff, #1a4a7a);
            bottom: 25%; right: 5%;
            box-shadow: 0 0 50px rgba(80, 150, 255, 0.12);
            animation-duration: 20s;
        }

        @keyframes planetDrift {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(18px, -15px) rotate(120deg); }
            66% { transform: translate(-12px, 22px) rotate(240deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        /* ——— ОСНОВНОЙ КОНТЕЙНЕР — МАТОВОЕ СТЕКЛО ——— */
        .container {
            position: relative;
            z-index: 20;
            backdrop-filter: blur(24px) saturate(1.2);
            -webkit-backdrop-filter: blur(24px) saturate(1.2);
            background: rgba(6, 14, 34, 0.65);
            border-radius: 48px 48px 40px 40px;
            padding: 26px 28px 24px;
            max-width: 440px;
            width: 100%;
            box-shadow:
                    0 40px 80px rgba(0, 0, 0, 0.9),
                    0 0 0 1px rgba(130, 180, 255, 0.06),
                    inset 0 1px 0 rgba(200, 220, 255, 0.04);
            border: 1px solid rgba(150, 190, 255, 0.05);
            transition: all 0.3s ease;
        }

        /* ——— Уголки-декор (космические символы) ——— */
        .corner-decor {
            position: absolute;
            font-size: 1.3rem;
            opacity: 0.35;
            filter: drop-shadow(0 0 30px rgba(100, 150, 255, 0.15));
            user-select: none;
            pointer-events: none;
            animation: decorFloat 8s ease-in-out infinite;
            color: #b8d0f0;
        }
        .corner-decor:nth-child(1) { top: 16px; left: 18px; animation-delay: 0s; }
        .corner-decor:nth-child(2) { top: 16px; right: 18px; animation-delay: 2.5s; }
        .corner-decor:nth-child(3) { bottom: 16px; left: 18px; animation-delay: 1.2s; }
        .corner-decor:nth-child(4) { bottom: 16px; right: 18px; animation-delay: 3.8s; }

        @keyframes decorFloat {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.2; }
            30% { transform: translateY(-12px) rotate(12deg) scale(1.15); opacity: 0.6; }
            60% { transform: translateY(0) rotate(-8deg) scale(0.9); opacity: 0.3; }
            85% { transform: translateY(-8px) rotate(18deg) scale(1.05); opacity: 0.5; }
        }

        /* ——— Содержимое ——— */
        .content-screen {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: center;
            animation: fadeCosmic 1.2s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }

        @keyframes fadeCosmic {
            0% { opacity: 0; transform: translateY(30px) scale(0.92); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .emoji-big {
            font-size: 2.6rem;
            display: block;
            margin-bottom: 2px;
            filter: drop-shadow(0 0 60px rgba(100, 150, 255, 0.15));
            animation: gentleFloat 7s ease-in-out infinite;
            letter-spacing: 8px;
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0) scale(1) rotate(-1deg); }
            50% { transform: translateY(-12px) scale(1.04) rotate(1deg); }
        }

        .content-title {
            font-family: 'Great Vibes', cursive;
            font-size: 2.7rem;
            font-weight: 400;
            background: linear-gradient(135deg, #c4ddff, #8ab0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 70px rgba(80, 140, 255, 0.10);
            letter-spacing: 2px;
            margin-top: 0px;
        }

        .message-text {
            font-size: 1rem;
            color: #d4e2f5;
            line-height: 1.7;
            max-width: 340px;
            margin: 0 auto;
            text-align: left;
            font-weight: 300;
            backdrop-filter: blur(6px);
            background: rgba(12, 24, 50, 0.45);
            border-radius: 32px;
            padding: 18px 22px 16px;
            border: 1px solid rgba(130, 180, 255, 0.05);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
        }

        .message-text p {
            margin-bottom: 14px;
            font-weight: 300;
            color: #d4e2f5;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
            font-size: 0.95rem;
        }
        .message-text p:first-of-type {
            color: #ecf4ff;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .message-text .highlight {
            color: #b6d4ff;
            font-weight: 500;
            background: rgba(80, 140, 255, 0.10);
            padding: 2px 16px;
            border-radius: 40px;
            display: inline-block;
            border: 1px solid rgba(100, 150, 255, 0.06);
        }

        .message-text ul, .message-text ol {
            list-style: none;
            padding: 0;
            margin-top: 4px;
        }

        .message-text ol li {
            padding: 10px 0 10px 40px;
            margin-bottom: 4px;
            color: #d4e2f5;
            font-weight: 300;
            position: relative;
            border-bottom: 1px solid rgba(130, 180, 255, 0.04);
            transition: all 0.2s;
            border-radius: 8px;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
        }

        .message-text ol li::before {
            content: "✦";
            position: absolute;
            left: 6px;
            top: 10px;
            font-size: 1.2rem;
            color: #9ac0ff;
            filter: drop-shadow(0 0 15px rgba(100, 150, 255, 0.3));
        }

        .message-text ol li:last-child {
            border-bottom: none;
        }

        .message-text ol li:hover {
            background: rgba(100, 150, 255, 0.02);
        }

        .signature {
            font-family: 'Great Vibes', cursive;
            font-size: 1.5rem;
            color: #8aa8da;
            text-align: right;
            margin-top: 2px;
            padding-right: 12px;
            opacity: 0.4;
            text-shadow: 0 0 40px rgba(100, 150, 255, 0.05);
        }

        @media (max-width: 420px) {
            .container { padding: 22px 14px 18px; border-radius: 36px; }
            .content-title { font-size: 2.2rem; }
            .message-text { font-size: 0.85rem; padding: 14px 16px; }
            .emoji-big { font-size: 2.2rem; }
            .message-text ol li { padding: 8px 0 8px 34px; font-size: 0.8rem; }
            .signature { font-size: 1.2rem; }
            .corner-decor { font-size: 1.0rem; }
        }
    </style>
</head>
<body>

<!-- Глубокое поле -->
<div class="starfield"></div>

<!-- Слой с мерцающими звёздами (генерируется через JS) -->
<div class="stars-layer" id="starsLayer"></div>

<!-- Интенсивный звездопад -->
<div class="meteor-shower">
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
</div>

<!-- Свечение туманности -->
<div class="nebula-glow"></div>

<!-- Планеты (редкий декор) -->
<div class="planet planet-1"></div>
<div class="planet planet-2"></div>
<div class="planet planet-3"></div>

<!-- ОСНОВНОЙ КОНТЕЙНЕР -->
<div class="container" id="appContainer">
    <span class="corner-decor">✦</span>
    <span class="corner-decor">☄</span>
    <span class="corner-decor">🪐</span>
    <span class="corner-decor">🌙</span>

    <div id="mainScreen" class="content-screen">
        <div class="content-title">12.08.26</div>
        <div class="message-text">
            <p style="text-align: center">Софья Эдуардовна, приглашаю вас:</p>
            <ol>
                <li>Покушать бургеры;</li>
                <li>Поговорим;</li>
                <li>Сделаем массаж;</li>
                <li>Может быть лего;</li>
                <li>Смотрим звездное небо;</li>
            </ol>
        </div>
    </div>
</div>

<script>
    (function() {
        // ——— Генератор сотен мерцающих звёзд ———
        const layer = document.getElementById('starsLayer');
        const starCount = 280;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star-point';

            // Размер: от 1px до 3.5px
            const size = 1 + Math.random() * 2.8;
            star.style.width = size + 'px';
            star.style.height = size + 'px';

            // Позиция
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';

            // Длительность мерцания
            const duration = 2.2 + Math.random() * 4.5;
            star.style.setProperty('--duration', duration + 's');

            // Задержка
            star.style.animationDelay = (Math.random() * 5) + 's';

            // Случайный оттенок (холодные тона)
            const hue = 200 + Math.random() * 40; // 200–240
            const sat = 40 + Math.random() * 50;
            const lig = 70 + Math.random() * 30;
            star.style.background = `hsl(${hue}, ${sat}%, ${lig}%)`;
            star.style.boxShadow = `0 0 ${3 + Math.random() * 8}px hsla(${hue}, 80%, 80%, 0.2)`;

            layer.appendChild(star);
        }

        // ——— Дополнительные крупные звёзды (акценты) ———
        for (let i = 0; i < 25; i++) {
            const bigStar = document.createElement('div');
            bigStar.className = 'star-point';
            const size = 3.5 + Math.random() * 5;
            bigStar.style.width = size + 'px';
            bigStar.style.height = size + 'px';
            bigStar.style.left = Math.random() * 100 + '%';
            bigStar.style.top = Math.random() * 100 + '%';
            bigStar.style.setProperty('--duration', (3 + Math.random() * 6) + 's');
            bigStar.style.animationDelay = (Math.random() * 7) + 's';
            bigStar.style.background = 'white';
            bigStar.style.boxShadow = '0 0 18px rgba(180, 210, 255, 0.5)';
            bigStar.style.opacity = '0.4';
            layer.appendChild(bigStar);
        }
    })();
</script>
</body>
</html>
