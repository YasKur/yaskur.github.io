<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Money</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(145deg, #0b1120 0%, #030712 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      margin: 0;
    }

    .container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }

    .card-grid {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      aspect-ratio: 27 / 9;
      width: 100%;
      perspective: 900px;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.3s ease;
    }

    .card.disabled {
      cursor: not-allowed;
      opacity: 0.5;
      filter: grayscale(0.4);
      pointer-events: none;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      transform-style: preserve-3d;
      border-radius: 30px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 215, 0, 0.08);
      will-change: transform;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front,
    .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      font-weight: 600;
      text-align: center;
      top: 0;
    }

    .card-front {
      background: radial-gradient(ellipse at 30% 40%, #2d3748, #1a202c);
      background-image:
              repeating-linear-gradient(45deg, rgba(255, 215, 0, 0.06) 0px, rgba(255, 215, 0, 0.06) 6px, transparent 6px, transparent 12px),
              radial-gradient(ellipse at 70% 20%, #3b4252, #111827);
      color: #e2e8f0;
      border: 1px solid rgba(255, 215, 0, 0.20);
      box-shadow: inset 0 0 60px rgba(255, 215, 0, 0.08), inset 0 0 20px rgba(0, 0, 0, 0.5);
      transform: rotateY(0deg);
      position: relative;
      overflow: hidden;
    }

    .card-front::before {
      content: "₽ $ € ¥";
      position: absolute;
      bottom: 10%;
      right: 8%;
      font-size: 26px;
      font-weight: 300;
      letter-spacing: 6px;
      opacity: 0.15;
      color: #fbbf24;
      transform: rotate(-6deg);
      white-space: nowrap;
      filter: blur(0.3px);
    }

    .card-front::after {
      content: "✦ ✦ ✦";
      position: absolute;
      top: 14%;
      left: 10%;
      font-size: 20px;
      letter-spacing: 10px;
      opacity: 0.12;
      color: #fcd34d;
      transform: rotate(12deg);
    }

    .card-front .card-suit {
      font-size: 52px;
      font-weight: 200;
      background: rgba(255, 215, 0, 0.06);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 215, 0, 0.15);
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.05);
      margin-bottom: 8px;
      backdrop-filter: blur(2px);
      color: #fbbf24;
      text-shadow: 0 0 20px rgba(250, 204, 21, 0.2);
    }

    .card-front .ornament {
      position: absolute;
      top: 18%;
      right: 12%;
      font-size: 18px;
      opacity: 0.08;
      color: #fbbf24;
      letter-spacing: 4px;
      font-weight: 300;
    }

    .card-back {
      background: radial-gradient(circle at 80% 30%, #fde68a, #b45309);
      background-image:
              radial-gradient(circle at 20% 70%, rgba(255, 215, 0, 0.3), transparent 50%),
              linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      transform: rotateY(180deg);
      border: 1px solid rgba(255, 215, 0, 0.5);
      box-shadow: inset 0 0 50px rgba(250, 204, 21, 0.25);
      color: #0f172a;
    }

    .card-back .amount {
      font-size: 44px;
      font-weight: 800;
      background: rgba(15, 23, 42, 0.07);
      padding: 6px 32px;
      border-radius: 100px;
      backdrop-filter: blur(2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      letter-spacing: 1px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #0f172a;
      text-shadow: 0 2px 6px rgba(255, 255, 255, 0.2);
    }

    .card.flipped .card-inner {
      box-shadow: 0 16px 40px rgba(250, 204, 21, 0.25), 0 0 0 1px rgba(255, 215, 0, 0.3);
    }

    .info-bar {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(6px);
      padding: 14px 20px;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: #94a3b8;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.3px;
      gap: 8px;
      flex-wrap: wrap;
      flex-direction: column;
      gap: 6px;
      min-height: 80px;
    }

    .info-bar .info-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      width: 100%;
    }

    .info-bar .icon {
      font-size: 18px;
      opacity: 0.6;
    }

    .info-bar .badge {
      background: #4f46e5;
      color: white;
      padding: 2px 14px;
      border-radius: 40px;
      font-size: 12px;
      font-weight: 600;
    }

    .info-bar .status-msg {
      color: #facc15;
      font-weight: 500;
      font-size: 13px;
      background: rgba(250, 204, 21, 0.08);
      padding: 2px 16px;
      border-radius: 40px;
      border: 1px solid rgba(250, 204, 21, 0.08);
      transition: all 0.3s ease;
    }

    .info-bar .next-date {
      color: #e2e8f0;
      font-weight: 500;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 16px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.5s ease;
    }

    .info-bar .next-date .date-highlight {
      color: #facc15;
      font-weight: 600;
    }

    .info-bar .next-date.hidden {
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
    }

    .info-bar .next-date.visible {
      opacity: 1;
      transform: scale(1);
    }

    .info-bar .hint-text {
      color: #64748b;
      font-size: 13px;
      opacity: 0.7;
    }

    @media (max-width: 380px) {
      .card-back .amount {
        font-size: 34px;
        padding: 4px 20px;
      }
      .card-front .card-suit {
        font-size: 40px;
        width: 60px;
        height: 60px;
      }
      .info-bar {
        font-size: 12px;
        padding: 10px 14px;
        min-height: 70px;
      }
      .info-bar .next-date {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card-grid" id="cardGrid"></div>

  <div class="info-bar">
    <div class="info-row">
      <span class="icon">🗓️</span>
      <span class="hint-text" id="hintText">Откройте карточку, чтобы узнать дату</span>
      <span class="next-date hidden" id="nextDate">
                    Следующее открытие: <span class="date-highlight" id="dateValue">—</span>
                </span>
    </div>
    <div class="info-row">
      <span class="status-msg" id="statusMsg">● готова</span>
    </div>
  </div>
</div>

<script>
  (function() {
    const BASE_SUMS = [10000, 15000, 10000, 10000, 15000];
    const STORAGE_KEY = 'card_reveal_state_v7';
    const MONTH_MS = 30 * 24 * 60 * 60 * 1000;

    function shuffleArray(arr) {
      const shuffled = [...arr];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function getDefaultState() {
      const shuffled = shuffleArray(BASE_SUMS);
      return {
        lastReset: Date.now(),
        revealed: new Array(shuffled.length).fill(false),
        revealedSum: null,
        cardOrder: shuffled,
        // Флаг, показывать ли дату следующего открытия
        showNextDate: false
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const defaultState = getDefaultState();
          saveState(defaultState);
          return defaultState;
        }

        const parsed = JSON.parse(raw);

        if (!parsed.cardOrder || !Array.isArray(parsed.cardOrder) || parsed.cardOrder.length !== BASE_SUMS
                .length) {
          const defaultState = getDefaultState();
          saveState(defaultState);
          return defaultState;
        }

        if (!parsed.revealed || !Array.isArray(parsed.revealed) || parsed.revealed.length !== BASE_SUMS
                .length) {
          parsed.revealed = new Array(BASE_SUMS.length).fill(false);
        }

        if (typeof parsed.lastReset !== 'number') {
          parsed.lastReset = Date.now();
        }

        if (typeof parsed.showNextDate !== 'boolean') {
          parsed.showNextDate = false;
        }

        const anyRevealed = parsed.revealed.some(v => v === true);
        if (anyRevealed && parsed.revealedSum === null) {
          const idx = parsed.revealed.indexOf(true);
          if (idx !== -1 && idx < parsed.cardOrder.length) {
            parsed.revealedSum = parsed.cardOrder[idx];
          }
        }

        return parsed;
      } catch (_) {
        const defaultState = getDefaultState();
        saveState(defaultState);
        return defaultState;
      }
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function isMonthPassed(lastReset) {
      return (Date.now() - lastReset) >= MONTH_MS;
    }

    function getNextDate(lastReset) {
      return new Date(lastReset + MONTH_MS);
    }

    function formatDate(date) {
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${day}.${month}.${year} ${hours}:${minutes}`;
    }

    function resetAllCards() {
      const shuffled = shuffleArray(BASE_SUMS);
      const newState = {
        lastReset: Date.now(),
        revealed: new Array(shuffled.length).fill(false),
        revealedSum: null,
        cardOrder: shuffled,
        showNextDate: false
      };
      saveState(newState);
      return newState;
    }

    function tryRevealCard(index, state) {
      if (state.revealed[index]) return null;

      let currentState = state;
      if (isMonthPassed(state.lastReset)) {
        currentState = resetAllCards();
      }

      if (currentState.revealed[index]) return null;

      const anyRevealed = currentState.revealed.some(v => v === true);
      if (anyRevealed) return null;

      const newRevealed = [...currentState.revealed];
      newRevealed[index] = true;
      const newState = {
        ...currentState,
        revealed: newRevealed,
        revealedSum: currentState.cardOrder[index],
        showNextDate: true // Показываем дату после открытия
      };
      saveState(newState);
      return newState;
    }

    function renderCards(state) {
      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';

      const anyRevealed = state.revealed.some(v => v === true);
      const cardOrder = state.cardOrder;

      cardOrder.forEach((sum, index) => {
        const isRevealed = state.revealed[index] || false;
        const disabled = !isRevealed && anyRevealed;

        const card = document.createElement('div');
        card.className = 'card' + (isRevealed ? ' flipped' : '') + (disabled ? ' disabled' : '');
        card.dataset.index = index;

        const inner = document.createElement('div');
        inner.className = 'card-inner';

        const front = document.createElement('div');
        front.className = 'card-front';

        const suit = document.createElement('div');
        suit.className = 'card-suit';
        suit.textContent = '₽';
        front.appendChild(suit);

        const ornament = document.createElement('div');
        ornament.className = 'ornament';
        ornament.textContent = '✧ ✧ ✧';
        front.appendChild(ornament);

        const back = document.createElement('div');
        back.className = 'card-back';

        const amountSpan = document.createElement('div');
        amountSpan.className = 'amount';

        if (isRevealed && state.revealedSum !== null) {
          amountSpan.textContent = state.revealedSum.toLocaleString('ru-RU') + ' ₽';
        } else {
          amountSpan.textContent = sum.toLocaleString('ru-RU') + ' ₽';
        }

        back.appendChild(amountSpan);

        inner.appendChild(front);
        inner.appendChild(back);
        card.appendChild(inner);

        card.addEventListener('click', function(e) {
          e.stopPropagation();

          if (this.classList.contains('flipped') || this.classList.contains('disabled')) {
            return;
          }

          const index = parseInt(this.dataset.index, 10);
          let currentState = loadState();

          if (isMonthPassed(currentState.lastReset)) {
            currentState = resetAllCards();
          }

          const newState = tryRevealCard(index, currentState);
          if (newState) {
            renderCards(newState);
            updateInfo(newState);
          } else {
            const freshState = loadState();
            updateInfo(freshState);
          }
        });

        grid.appendChild(card);
      });

      updateInfo(state);
    }

    function updateInfo(state) {
      const msg = document.getElementById('statusMsg');
      const nextDateEl = document.getElementById('nextDate');
      const dateValueEl = document.getElementById('dateValue');
      const hintText = document.getElementById('hintText');

      if (!msg || !nextDateEl || !dateValueEl || !hintText) return;

      const anyRevealed = state.revealed.some(v => v === true);
      const monthPassed = isMonthPassed(state.lastReset);

      // Обновляем статус
      if (anyRevealed && state.revealedSum !== null) {
        msg.innerHTML = `✅ ${state.revealedSum.toLocaleString('ru-RU')} ₽`;
        msg.style.color = '#facc15';
      } else if (monthPassed) {
        msg.innerHTML = `✨ можно открыть`;
        msg.style.color = '#a7f3d0';
      } else {
        msg.innerHTML = `🔒 ожидание`;
        msg.style.color = '#94a3b8';
      }

      // Показываем/скрываем дату следующего открытия
      if (state.showNextDate && anyRevealed) {
        const nextDate = getNextDate(state.lastReset);
        const formattedDate = formatDate(nextDate);
        dateValueEl.textContent = formattedDate;
        nextDateEl.classList.remove('hidden');
        nextDateEl.classList.add('visible');
        hintText.style.display = 'none';
      } else {
        nextDateEl.classList.remove('visible');
        nextDateEl.classList.add('hidden');
        hintText.style.display = 'inline';
      }

      // Если месяц прошёл и карточка открыта, показываем "доступно сейчас"
      if (anyRevealed && monthPassed && state.showNextDate) {
        dateValueEl.textContent = '✅ доступно сейчас';
        dateValueEl.style.color = '#a7f3d0';
      } else if (anyRevealed && state.showNextDate) {
        dateValueEl.style.color = '#facc15';
      }
    }

    function init() {
      let state = loadState();

      if (isMonthPassed(state.lastReset)) {
        state = resetAllCards();
      } else {
        const anyRevealed = state.revealed.some(v => v === true);
        if (anyRevealed) {
          const idx = state.revealed.indexOf(true);
          if (idx !== -1 && idx < state.cardOrder.length) {
            if (state.revealedSum !== state.cardOrder[idx]) {
              state.revealedSum = state.cardOrder[idx];
              saveState(state);
            }
          }
          // Если карточка открыта, но showNextDate false - исправляем
          if (!state.showNextDate) {
            state.showNextDate = true;
            saveState(state);
          }
        }
      }

      renderCards(state);
    }

    init();
  })();
</script>
</body>
</html>
