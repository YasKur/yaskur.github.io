<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Софья Эдуардовна · крутая игра и вера в тебя ✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Comfortaa:wght@400;600;700&family=Lobster&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 20px;
            font-family: 'Comfortaa', cursive;
            position: relative;
            overflow-x: hidden;
            background: #0d111c;
        }

        /* ========== ФОН: БИРЮЗА, КОРАЛЛ, ЗОЛОТО + СЕТКА ========== */
        .padel-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background-image: url('./1sss.jpg');
            background-size: cover;
            background-position: center center;
        }

        /* Глубокие ауры */
        .aura {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.55;
            pointer-events: none;
            mix-blend-mode: screen;
            animation: auraPulse var(--a-dur, 26s) ease-in-out infinite alternate;
        }

        .aura-teal {
            width: 70vmax;
            height: 70vmax;
            background: radial-gradient(circle, rgba(0, 220, 200, 0.7), rgba(0, 140, 140, 0.2) 55%, transparent 72%);
            top: -25vmax;
            left: -20vmax;
            --a-dur: 30s;
        }

        .aura-coral {
            width: 65vmax;
            height: 65vmax;
            background: radial-gradient(circle, rgba(255, 100, 90, 0.6), rgba(255, 70, 60, 0.15) 55%, transparent 72%);
            bottom: -25vmax;
            right: -18vmax;
            --a-dur: 34s;
            animation-delay: -9s;
        }

        .aura-gold {
            width: 50vmax;
            height: 50vmax;
            background: radial-gradient(circle, rgba(255, 210, 100, 0.55), transparent 68%);
            top: 30%;
            left: 50%;
            --a-dur: 28s;
            animation-delay: -16s;
        }

        .aura-lavender {
            width: 45vmax;
            height: 45vmax;
            background: radial-gradient(circle, rgba(160, 140, 255, 0.4), transparent 68%);
            top: 5%;
            right: 10%;
            --a-dur: 32s;
            animation-delay: -6s;
        }

        @keyframes auraPulse {
            0%   { transform: translate(0, 0) scale(1); opacity: 0.4; }
            50%  { transform: translate(3vmax, -2.5vmax) scale(1.15); opacity: 0.7; }
            100% { transform: translate(-2vmax, 3vmax) scale(1.05); opacity: 0.5; }
        }

        /* Лучи */
        .light-ray {
            position: absolute;
            width: 180%;
            height: 60vh;
            pointer-events: none;
            filter: blur(60px);
            opacity: 0.3;
            mix-blend-mode: screen;
            animation: rayShift var(--r-dur, 36s) ease-in-out infinite alternate;
        }

        .ray-1 {
            top: 0%;
            left: -40%;
            transform: rotate(-25deg);
            background: linear-gradient(90deg,
            transparent 10%,
            rgba(0, 220, 200, 0.55) 30%,
            rgba(255, 210, 100, 0.45) 55%,
            rgba(255, 100, 90, 0.35) 75%,
            transparent 95%);
            --r-dur: 32s;
        }

        .ray-2 {
            top: 45%;
            left: -30%;
            transform: rotate(-20deg);
            background: linear-gradient(90deg,
            transparent 8%,
            rgba(255, 100, 90, 0.45) 32%,
            rgba(0, 220, 200, 0.45) 58%,
            rgba(255, 210, 100, 0.35) 80%,
            transparent 96%);
            --r-dur: 38s;
            animation-delay: -12s;
        }

        .ray-3 {
            top: 80%;
            left: -35%;
            transform: rotate(-30deg);
            background: linear-gradient(90deg,
            transparent 12%,
            rgba(160, 140, 255, 0.4) 35%,
            rgba(0, 220, 200, 0.4) 60%,
            rgba(255, 210, 100, 0.35) 82%,
            transparent 97%);
            --r-dur: 44s;
            animation-delay: -22s;
        }

        @keyframes rayShift {
            0%   { transform: translateX(-8%) rotate(-27deg) scaleY(1); opacity: 0.2; }
            50%  { opacity: 0.45; }
            100% { transform: translateX(8%) rotate(-18deg) scaleY(1.15); opacity: 0.25; }
        }

        /* Сетка корта */
        .court-lines {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            opacity: 0.12;
            background-image:
                    linear-gradient(90deg, rgba(255, 255, 255, 0.09) 1px, transparent 1px),
                    linear-gradient(0deg, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
            background-size: 90px 90px;
            animation: gridShift 40s linear infinite;
        }

        @keyframes gridShift {
            0%   { background-position: 0 0; }
            100% { background-position: 180px 180px; }
        }

        /* ========== ЛЕТЯЩИЕ ЭЛЕМЕНТЫ ========== */
        .spark {
            position: absolute;
            top: -8vh;
            pointer-events: none;
            z-index: 4;
            opacity: 0;
            will-change: transform, opacity;
            animation: sparkFall var(--s-dur, 16s) linear infinite;
            filter: drop-shadow(0 0 10px rgba(0, 220, 200, 0.7));
        }

        @keyframes sparkFall {
            0% { transform: translate3d(0, 0, 0) rotate(0deg) scale(0.6); opacity: 0; }
            8%  { opacity: 0.95; }
            30% { transform: translate3d(40px, 30vh, 0) rotate(120deg) scale(1); opacity: 0.85; }
            60% { transform: translate3d(-50px, 65vh, 0) rotate(280deg) scale(0.95); opacity: 0.7; }
            90% { opacity: 0.35; }
            100% { transform: translate3d(30px, 112vh, 0) rotate(460deg) scale(0.8); opacity: 0; }
        }

        .ball {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            animation: ballFloat var(--b-dur, 18s) ease-in-out infinite;
            background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.9), rgba(0, 220, 200, 0.3) 28%, transparent 62%);
            border: 1px solid rgba(0, 255, 230, 0.5);
            box-shadow: inset 0 0 14px rgba(0, 255, 230, 0.5), 0 0 18px rgba(0, 220, 200, 0.4);
        }

        @keyframes ballFloat {
            0%   { transform: translateY(20vh) translateX(0) scale(0.4); opacity: 0; }
            15%  { opacity: 0.75; }
            50%  { transform: translateY(-25vh) translateX(35px) scale(1); opacity: 0.55; }
            85%  { opacity: 0.25; }
            100% { transform: translateY(-70vh) translateX(-30px) scale(1.15); opacity: 0; }
        }

        .glint {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            animation: glintTwinkle var(--g-dur, 5s) ease-in-out infinite;
            filter: drop-shadow(0 0 8px currentColor);
        }

        @keyframes glintTwinkle {
            0%, 100% { transform: scale(0.3) rotate(0deg); opacity: 0; }
            50%      { transform: scale(1.2) rotate(90deg); opacity: 1; }
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            animation: orbFloat var(--o-dur, 15s) ease-in-out infinite;
        }

        @keyframes orbFloat {
            0%   { transform: translate(0, 0) scale(0.5); opacity: 0; }
            25%  { opacity: 0.85; }
            50%  { transform: translate(30px, -40px) scale(1.2); opacity: 0.6; }
            75%  { opacity: 0.9; }
            100% { transform: translate(-20px, -90px) scale(0.6); opacity: 0; }
        }

        /* ========== КАРТОЧКА ========== */
        .padel-card {
            position: relative;
            z-index: 30;
            backdrop-filter: blur(28px) saturate(1.6);
            -webkit-backdrop-filter: blur(28px) saturate(1.6);
            background: rgba(18, 38, 48, 0.78);
            border-radius: 32px;
            padding: 22px 26px 26px;
            max-width: 500px;
            width: 100%;
            box-shadow:
                    0 30px 100px rgba(0, 0, 0, 0.55),
                    0 0 0 1px rgba(0, 220, 200, 0.3),
                    0 0 80px rgba(0, 200, 190, 0.2),
                    0 0 160px rgba(255, 100, 90, 0.1),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 220, 200, 0.3);
            transition: all 0.3s ease;
            animation: cardIn 1.2s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }

        @keyframes cardIn {
            0%   { opacity: 0; transform: translateY(70px) scale(0.85) rotate(-2deg); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
        }

        /* ===== ТАНЦУЮЩИЙ КОТ (GIF) ===== */
        .cat-gif-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 2px;
            position: relative;
            z-index: 35;
            filter: drop-shadow(0 0 25px rgba(0, 220, 200, 0.7)) drop-shadow(0 0 45px rgba(255, 100, 90, 0.3));
            animation: catDance 2.4s ease-in-out infinite;
        }

        .cat-gif {
            width: 210px;
            height: 210px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(0, 220, 200, 0.7);
            background: rgba(10, 30, 38, 0.5);
            box-shadow:
                    0 0 34px rgba(0, 220, 200, 0.6),
                    0 0 70px rgba(255, 100, 90, 0.35),
                    0 0 110px rgba(255, 210, 100, 0.25);
        }

        @keyframes catDance {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            25%  { transform: translateY(-7px) rotate(-5deg) scale(1.05); }
            50%  { transform: translateY(-11px) rotate(5deg) scale(1.08); }
            75%  { transform: translateY(-5px) rotate(-3deg) scale(1.04); }
        }

        /* Уголки */
        .cozy-corner {
            position: absolute;
            font-size: 1.6rem;
            opacity: 0.85;
            filter: drop-shadow(0 0 18px rgba(0, 220, 200, 0.8));
            user-select: none;
            pointer-events: none;
            animation: decorFloat 7.5s ease-in-out infinite;
            z-index: 32;
        }
        .cozy-corner:nth-child(1) { top: 14px; left: 16px; animation-delay: 0s; }
        .cozy-corner:nth-child(2) { top: 14px; right: 16px; animation-delay: 1.9s; }
        .cozy-corner:nth-child(3) { bottom: 14px; left: 16px; animation-delay: 3.8s; }
        .cozy-corner:nth-child(4) { bottom: 14px; right: 16px; animation-delay: 5.6s; }

        @keyframes decorFloat {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.55; }
            50%      { transform: translateY(-10px) rotate(9deg) scale(1.18); opacity: 1; }
        }

        /* Контент */
        .content-screen {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: center;
        }

        .cheer-subtitle {
            font-family: 'Lobster', cursive;
            font-size: 1.9rem;
            color: #7fffe0;
            text-shadow:
                    0 0 30px rgba(0, 255, 230, 0.8),
                    0 0 60px rgba(255, 100, 90, 0.5),
                    0 0 90px rgba(255, 210, 100, 0.3);
            margin-bottom: 2px;
            transform: rotate(-2deg);
            letter-spacing: 1px;
        }

        .cheer-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 6px 0;
            color: #ffb3a0;
            font-size: 1rem;
            letter-spacing: 4px;
            font-weight: 700;
        }

        .cheer-divider::before,
        .cheer-divider::after {
            content: '';
            flex: 1;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, rgba(0, 220, 200, 0.7), rgba(255, 100, 90, 0.5), transparent);
            max-width: 80px;
        }

        /* ===== КНОПКА ПОП-АПА ===== */
        .kiss-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 18px auto 4px;
            padding: 16px 32px;
            font-family: 'Comfortaa', cursive;
            font-size: 1.2rem;
            font-weight: 700;
            color: #0d1e24;
            background: linear-gradient(135deg, #7fffe0, #ffd966 50%, #ffb3a0);
            background-size: 200% 200%;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            letter-spacing: 0.8px;
            box-shadow:
                    0 10px 30px rgba(0, 220, 200, 0.5),
                    0 0 60px rgba(255, 210, 100, 0.4),
                    0 0 100px rgba(255, 100, 90, 0.25);
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            animation: btnGlow 3s ease-in-out infinite alternate, btnFloat 4s ease-in-out infinite;
            position: relative;
            z-index: 40;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.4);
        }

        @keyframes btnGlow {
            0%   { background-position: 0% 50%; box-shadow: 0 10px 30px rgba(0, 220, 200, 0.5), 0 0 60px rgba(255, 210, 100, 0.4), 0 0 100px rgba(255, 100, 90, 0.25); }
            100% { background-position: 100% 50%; box-shadow: 0 12px 40px rgba(0, 220, 200, 0.7), 0 0 80px rgba(255, 210, 100, 0.6), 0 0 120px rgba(255, 100, 90, 0.4); }
        }

        @keyframes btnFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50%      { transform: translateY(-5px) scale(1.02); }
        }

        .kiss-btn:hover {
            transform: scale(1.07) translateY(-4px);
            box-shadow: 0 16px 50px rgba(0, 220, 200, 0.8), 0 0 100px rgba(255, 210, 100, 0.7);
        }

        .kiss-btn:active {
            transform: scale(0.96);
        }

        /* ===== ПОП-АП ===== */
        .popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 15, 20, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .popup-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .popup-card {
            background: rgba(18, 38, 48, 0.92);
            border: 2px solid rgba(0, 220, 200, 0.6);
            border-radius: 40px;
            padding: 36px 42px 34px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow:
                    0 30px 100px rgba(0, 0, 0, 0.7),
                    0 0 0 1px rgba(0, 220, 200, 0.4),
                    0 0 80px rgba(0, 220, 200, 0.5),
                    0 0 160px rgba(255, 100, 90, 0.3),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform: scale(0.7) rotate(-4deg);
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
            opacity: 0;
            position: relative;
            overflow: hidden;
        }

        .popup-overlay.active .popup-card {
            transform: scale(1) rotate(0deg);
            opacity: 1;
        }

        .popup-emoji-row {
            font-size: 2.6rem;
            letter-spacing: 10px;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 18px rgba(255, 210, 100, 0.8));
            animation: emojiPop 1.8s ease-in-out infinite;
        }

        @keyframes emojiPop {
            0%, 100% { transform: scale(1) rotate(0deg); }
            30%  { transform: scale(1.1) rotate(-3deg); }
            60%  { transform: scale(0.95) rotate(3deg); }
        }

        .popup-title {
            font-family: 'Lobster', cursive;
            font-size: 2rem;
            color: #7fffe0;
            text-shadow:
                    0 0 30px rgba(0, 255, 230, 0.9),
                    0 0 60px rgba(255, 100, 90, 0.6),
                    0 0 100px rgba(255, 210, 100, 0.4);
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .popup-sub {
            font-size: 1rem;
            color: #ffd966;
            font-weight: 600;
            letter-spacing: 0.8px;
            line-height: 1.6;
            text-shadow: 0 0 20px rgba(255, 210, 100, 0.7);
            margin-bottom: 6px;
        }

        .popup-sub strong {
            color: #ffb3a0;
            font-weight: 700;
        }

        .popup-close {
            margin-top: 22px;
            padding: 12px 38px;
            font-family: 'Comfortaa', cursive;
            font-size: 1rem;
            font-weight: 700;
            color: #0d1e24;
            background: linear-gradient(135deg, #7fffe0, #ffd966);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 220, 200, 0.5);
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            letter-spacing: 0.5px;
        }

        .popup-close:hover {
            transform: scale(1.06);
            box-shadow: 0 12px 35px rgba(0, 220, 200, 0.8);
        }

        .popup-close:active {
            transform: scale(0.95);
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 420px) {
            .padel-card { padding: 18px 14px 22px; border-radius: 24px; }
            .cat-gif { width: 88px; height: 88px; }
            .cheer-subtitle { font-size: 1.6rem; }
            .cozy-corner { font-size: 1.3rem; }
            .kiss-btn { padding: 14px 24px; font-size: 1.05rem; }
            .popup-card { padding: 28px 22px 26px; }
            .popup-title { font-size: 1.8rem; }
            .popup-emoji-row { font-size: 2rem; letter-spacing: 6px; }
            .popup-sub { font-size: 0.9rem; }
            .spark, .ball, .glint, .orb, .aura, .light-ray, .court-lines { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .spark, .ball, .glint, .orb, .aura, .light-ray, .court-lines,
            .cat-gif-wrapper, .cozy-corner, .padel-card, .kiss-btn, .popup-emoji-row {
                animation: none !important;
            }
            .popup-card { transition: none; }
        }
    </style>
</head>
<body>

<!-- ===== ФОН ===== -->
<div class="padel-bg">
    <div class="aura aura-teal"></div>
    <div class="aura aura-coral"></div>
    <div class="aura aura-gold"></div>
    <div class="aura aura-lavender"></div>
    <div class="light-ray ray-1"></div>
    <div class="light-ray ray-2"></div>
    <div class="light-ray ray-3"></div>
    <div class="court-lines"></div>
</div>

<!-- ===== КАРТОЧКА ===== -->
<div class="padel-card" id="appContainer">
    <span class="cozy-corner">🎾</span>
    <span class="cozy-corner">✨</span>
    <span class="cozy-corner">💖</span>
    <span class="cozy-corner">🌟</span>

    <div id="mainScreen" class="content-screen">
        <!-- ТАНЦУЮЩИЙ КОТ (GIF) -->
        <div class="cat-gif-wrapper">
            <img
                    class="cat-gif"
                    src="./1.gif"
                    alt="Танцующий кот"
                    loading="eager"
            >
        </div>

        <div class="cheer-subtitle">крутой игры, Софья!</div>

        <div class="cheer-divider">✦ ✦ ✦</div>

        <!-- КНОПКА ПОП-АПА -->
        <button class="kiss-btn" id="kissButton">
            🎮 Пожелание для тебя
        </button>
    </div>
</div>

<!-- ===== ПОП-АП ===== -->
<div class="popup-overlay" id="popupOverlay">
    <div class="popup-card">
        <div class="popup-emoji-row">🎮✨🍀🏆🔥</div>
        <div class="popup-title">Пусть всё получится!</div>
        <div class="popup-sub">
            <strong>Софья Эдуардовна</strong>, желаю тебе крутой игры,<br>
            чтобы всё удары были на вылет!<br>
            <br>
            ✨ Я в тебя верю — и всё обязательно получится! ✨
        </div>
        <button class="popup-close" id="popupCloseBtn">Обнимаю 🤗</button>
    </div>
</div>

<script>
    (function() {
        // ===== ДАТА =====

        const bg = document.querySelector('.padel-bg');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // ===== ИСКОРКИ =====
        const sparkColors = ['#7fffe0', '#ffb3a0', '#ffd966', '#a0e0ff', '#ff9a8a', '#80ffe8'];
        const sparkShapes = ['✦', '✧', '❋', '✺', '⋆', '✶'];

        for (let i = 0; i < 20; i++) {
            const spark = document.createElement('div');
            spark.className = 'spark';
            if (i % 3 === 0) {
                spark.textContent = sparkShapes[Math.floor(Math.random() * sparkShapes.length)];
                spark.style.fontSize = (Math.random() * 1.3 + 0.8) + 'rem';
                spark.style.color = sparkColors[Math.floor(Math.random() * sparkColors.length)];
            } else {
                const w = Math.random() * 12 + 8;
                const h = w * (Math.random() * 0.5 + 0.55);
                spark.style.width = w + 'px';
                spark.style.height = h + 'px';
                spark.style.borderRadius = '60% 40% 55% 45% / 65% 55% 45% 35%';
                spark.style.background = `radial-gradient(circle at 35% 30%, ${
                    sparkColors[Math.floor(Math.random() * sparkColors.length)]
                }, rgba(0, 220, 200, 0.25) 70%, transparent)`;
            }
            spark.style.left = (Math.random() * 96 + 2) + '%';
            const dur = Math.random() * 10 + 14;
            spark.style.setProperty('--s-dur', dur + 's');
            spark.style.animationDelay = (Math.random() * 24) + 's';
            bg.appendChild(spark);
        }

        // ===== МЯЧИКИ =====
        for (let i = 0; i < 15; i++) {
            const ball = document.createElement('div');
            ball.className = 'ball';
            const size = Math.random() * 24 + 10;
            ball.style.width = size + 'px';
            ball.style.height = size + 'px';
            ball.style.left = (Math.random() * 94 + 3) + '%';
            ball.style.bottom = (Math.random() * 40 - 10) + 'vh';
            const dur = Math.random() * 10 + 14;
            ball.style.setProperty('--b-dur', dur + 's');
            ball.style.animationDelay = (Math.random() * 20) + 's';
            bg.appendChild(ball);
        }

        // ===== ЗВЁЗДОЧКИ =====
        const glintChars = ['✦', '✧', '✶', '⋆', '✺', '❋'];
        const glintColors = ['#7fffe0', '#ffd966', '#ffb3a0', '#a0e0ff', '#80ffe8'];

        for (let i = 0; i < 32; i++) {
            const glint = document.createElement('div');
            glint.className = 'glint';
            glint.textContent = glintChars[Math.floor(Math.random() * glintChars.length)];
            const size = Math.random() * 0.9 + 0.5;
            glint.style.fontSize = size + 'rem';
            glint.style.left = (Math.random() * 98 + 1) + '%';
            glint.style.top = (Math.random() * 95 + 2) + '%';
            glint.style.color = glintColors[Math.floor(Math.random() * glintColors.length)];
            const dur = Math.random() * 3.5 + 2.5;
            glint.style.setProperty('--g-dur', dur + 's');
            glint.style.animationDelay = (Math.random() * 12) + 's';
            bg.appendChild(glint);
        }

        // ===== СВЕТЯЩИЕСЯ ТОЧКИ =====
        const orbColors = ['#7fffe0', '#ffb3a0', '#ffd966', '#a0e0ff'];

        for (let i = 0; i < 18; i++) {
            const orb = document.createElement('div');
            orb.className = 'orb';
            const size = Math.random() * 5 + 2.5;
            orb.style.width = size + 'px';
            orb.style.height = size + 'px';
            orb.style.left = (Math.random() * 96 + 2) + '%';
            orb.style.top = (Math.random() * 90 + 5) + '%';
            const color = orbColors[Math.floor(Math.random() * orbColors.length)];
            orb.style.background = color;
            orb.style.boxShadow = `0 0 12px 4px ${color}99, 0 0 26px 10px ${color}40`;
            const dur = Math.random() * 8 + 8;
            orb.style.setProperty('--o-dur', dur + 's');
            orb.style.animationDelay = (Math.random() * 14) + 's';
            bg.appendChild(orb);
        }

        // ===== ПАРАЛЛАКС =====
        if (!reducedMotion) {
            let targetX = 0, targetY = 0;
            let curX = 0, curY = 0;

            document.addEventListener('mousemove', (e) => {
                targetX = (e.clientX / window.innerWidth - 0.5) * 2;
                targetY = (e.clientY / window.innerHeight - 0.5) * 2;
            });

            const auras = document.querySelectorAll('.aura');
            const rays = document.querySelectorAll('.light-ray');
            const sparks = document.querySelectorAll('.spark');

            function smoothLoop() {
                curX += (targetX - curX) * 0.045;
                curY += (targetY - curY) * 0.045;

                auras.forEach((a, i) => {
                    const f = (i + 1) * 8;
                    a.style.marginLeft = (curX * f) + 'px';
                    a.style.marginTop = (curY * f) + 'px';
                });

                rays.forEach((r, i) => {
                    const f = (i + 1) * 6;
                    r.style.marginLeft = (curX * f) + 'px';
                });

                sparks.forEach((s, i) => {
                    const f = (i % 4 + 1) * 2.5;
                    s.style.marginLeft = (curX * f) + 'px';
                });

                requestAnimationFrame(smoothLoop);
            }
            smoothLoop();
        }

        // ===== ПОП-АП =====
        const overlay = document.getElementById('popupOverlay');
        const kissBtn = document.getElementById('kissButton');
        const closeBtn = document.getElementById('popupCloseBtn');

        function openPopup() {
            overlay.classList.add('active');
        }

        function closePopup() {
            overlay.classList.remove('active');
        }

        kissBtn.addEventListener('click', openPopup);
        closeBtn.addEventListener('click', closePopup);

        // Закрытие по клику на фон
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                closePopup();
            }
        });

        // Закрытие по Esc
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && overlay.classList.contains('active')) {
                closePopup();
            }
        });
    })();
</script>

</body>
</html>
