<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>RELAX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Pacifico', sans-serif;
            position: relative;
            overflow: hidden;
            background: #1a1410;
        }

        /* ===== ЯРКИЙ СПА-ФОН С ГРАДИЕНТАМИ ===== */
        .spa-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                    radial-gradient(ellipse at 20% 50%, rgba(255, 180, 100, 0.25) 0%, transparent 60%),
                    radial-gradient(ellipse at 80% 30%, rgba(255, 120, 80, 0.20) 0%, transparent 50%),
                    radial-gradient(ellipse at 50% 80%, rgba(200, 140, 200, 0.15) 0%, transparent 50%),
                    linear-gradient(145deg, #2d2018 0%, #4a3428 30%, #5e4a3a 60%, #3d2c22 100%);
        }

        /* ===== АНИМАЦИОННЫЙ СЛОЙ ===== */
        .spa-animation-layer {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .wave-ring {
            position: absolute;
            border-radius: 50%;
            border: 3px solid rgba(255, 200, 150, 0.15);
            box-shadow: 0 0 80px rgba(255, 180, 120, 0.05), inset 0 0 80px rgba(255, 180, 120, 0.02);
            animation: wavePulse 16s ease-in-out infinite;
            transform-origin: center;
        }
        .wave-ring:nth-child(1) {
            width: 500px; height: 500px; top: -5%; left: -10%;
            animation-delay: 0s;
            border-color: rgba(255, 200, 150, 0.20);
        }
        .wave-ring:nth-child(2) {
            width: 600px; height: 600px; bottom: -15%; right: -10%;
            animation-delay: 4s;
            border-color: rgba(255, 170, 130, 0.15);
        }
        .wave-ring:nth-child(3) {
            width: 450px; height: 450px; top: 20%; left: 55%;
            animation-delay: 8s;
            border-color: rgba(255, 190, 160, 0.12);
        }
        .wave-ring:nth-child(4) {
            width: 550px; height: 550px; top: 50%; left: -15%;
            animation-delay: 12s;
            border-color: rgba(255, 210, 170, 0.10);
        }
        .wave-ring:nth-child(5) {
            width: 400px; height: 400px; top: 5%; right: 5%;
            animation-delay: 2s;
            border-color: rgba(255, 180, 140, 0.18);
        }

        @keyframes wavePulse {
            0% { transform: scale(0.6) rotate(0deg); opacity: 0.3; }
            50% { transform: scale(1.8) rotate(180deg); opacity: 0.9; }
            100% { transform: scale(0.6) rotate(360deg); opacity: 0.3; }
        }

        .oil-drop-glow {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 25%, rgba(255, 220, 180, 0.35), rgba(200, 150, 100, 0.05));
            filter: blur(8px);
            animation: dropGlide 20s ease-in-out infinite;
            box-shadow: 0 0 100px rgba(255, 180, 100, 0.08), inset 0 0 80px rgba(255, 200, 150, 0.05);
            pointer-events: none;
        }
        .oil-drop-glow::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 25%;
            width: 35%;
            height: 25%;
            background: radial-gradient(circle, rgba(255, 255, 240, 0.4), transparent 70%);
            border-radius: 50%;
            transform: rotate(-25deg);
        }

        .oil-drop-glow:nth-child(1) { width: 180px; height: 180px; top: 3%; left: 8%; animation-delay: 0s; background: radial-gradient(circle at 30% 25%, rgba(255, 200, 150, 0.40), rgba(180, 120, 80, 0.05)); }
        .oil-drop-glow:nth-child(2) { width: 220px; height: 220px; bottom: 5%; right: 5%; animation-delay: 5s; background: radial-gradient(circle at 30% 25%, rgba(255, 180, 140, 0.35), rgba(160, 110, 80, 0.04)); }
        .oil-drop-glow:nth-child(3) { width: 150px; height: 150px; top: 40%; left: 2%; animation-delay: 9s; background: radial-gradient(circle at 30% 25%, rgba(255, 210, 170, 0.30), rgba(170, 130, 90, 0.04)); }
        .oil-drop-glow:nth-child(4) { width: 200px; height: 200px; top: 65%; left: 75%; animation-delay: 3s; background: radial-gradient(circle at 30% 25%, rgba(255, 190, 160, 0.35), rgba(150, 110, 80, 0.04)); }
        .oil-drop-glow:nth-child(5) { width: 160px; height: 160px; top: 15%; right: 20%; animation-delay: 12s; background: radial-gradient(circle at 30% 25%, rgba(255, 220, 180, 0.30), rgba(180, 140, 100, 0.04)); }
        .oil-drop-glow:nth-child(6) { width: 250px; height: 250px; bottom: 25%; left: 40%; animation-delay: 7s; background: radial-gradient(circle at 30% 25%, rgba(255, 200, 170, 0.25), rgba(160, 120, 90, 0.03)); filter: blur(12px); }

        @keyframes dropGlide {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 0.4; }
            25% { transform: translate(60px, -60px) scale(1.3) rotate(12deg); opacity: 0.9; }
            50% { transform: translate(-40px, -100px) scale(0.85) rotate(-10deg); opacity: 0.7; }
            75% { transform: translate(80px, -30px) scale(1.2) rotate(18deg); opacity: 1; }
            100% { transform: translate(-30px, -80px) scale(1) rotate(-6deg); opacity: 0.4; }
        }

        .sparkle-bright {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 240, 210, 0.8), rgba(255, 200, 150, 0.1) 70%);
            filter: blur(1px);
            animation: sparkleDance 12s ease-in-out infinite;
            box-shadow: 0 0 40px rgba(255, 200, 150, 0.15);
        }
        .sparkle-bright:nth-child(1) { width: 14px; height: 14px; top: 8%; left: 12%; animation-delay: 0s; }
        .sparkle-bright:nth-child(2) { width: 10px; height: 10px; top: 22%; left: 85%; animation-delay: 2.5s; }
        .sparkle-bright:nth-child(3) { width: 18px; height: 18px; top: 55%; left: 8%; animation-delay: 5s; }
        .sparkle-bright:nth-child(4) { width: 12px; height: 12px; top: 40%; left: 60%; animation-delay: 7.5s; }
        .sparkle-bright:nth-child(5) { width: 16px; height: 16px; top: 78%; left: 80%; animation-delay: 10s; }
        .sparkle-bright:nth-child(6) { width: 8px; height: 8px; top: 5%; left: 45%; animation-delay: 1.5s; }
        .sparkle-bright:nth-child(7) { width: 20px; height: 20px; top: 35%; left: 30%; animation-delay: 4s; }
        .sparkle-bright:nth-child(8) { width: 11px; height: 11px; top: 70%; left: 20%; animation-delay: 9s; }
        .sparkle-bright:nth-child(9) { width: 15px; height: 15px; top: 12%; left: 70%; animation-delay: 6s; }
        .sparkle-bright:nth-child(10) { width: 9px; height: 9px; top: 90%; left: 45%; animation-delay: 11s; }

        @keyframes sparkleDance {
            0% { transform: translate(0, 0) scale(0.3); opacity: 0.2; }
            25% { transform: translate(80px, -50px) scale(1.8); opacity: 1; }
            50% { transform: translate(-50px, -90px) scale(0.6); opacity: 0.5; }
            75% { transform: translate(100px, -20px) scale(1.5); opacity: 0.9; }
            100% { transform: translate(-30px, -60px) scale(0.3); opacity: 0.2; }
        }

        .light-ray {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(255, 200, 150, 0.06), transparent 70%);
            filter: blur(40px);
            animation: rayPulse 10s ease-in-out infinite;
            pointer-events: none;
        }
        .light-ray:nth-child(1) { width: 400px; height: 400px; top: -10%; left: 20%; animation-delay: 0s; }
        .light-ray:nth-child(2) { width: 500px; height: 500px; bottom: -20%; right: 10%; animation-delay: 5s; background: radial-gradient(ellipse at center, rgba(255, 180, 130, 0.05), transparent 70%); }

        @keyframes rayPulse {
            0% { transform: scale(0.8); opacity: 0.3; }
            50% { transform: scale(1.4); opacity: 0.8; }
            100% { transform: scale(0.8); opacity: 0.3; }
        }

        /* ===== ОСНОВНОЙ КОНТЕЙНЕР ===== */
        .container {
            position: relative;
            z-index: 20;
            backdrop-filter: blur(16px) saturate(1.1);
            -webkit-backdrop-filter: blur(16px) saturate(1.1);
            background: rgba(40, 30, 22, 0.30);
            border-radius: 60px 60px 40px 40px;
            padding: 32px 30px 28px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.40), 0 0 0 1px rgba(255, 215, 180, 0.12), inset 0 1px 0 rgba(255, 215, 180, 0.08);
            border: 1px solid rgba(255, 215, 180, 0.06);
        }

        .corner-decor {
            position: absolute;
            font-size: 1.8rem;
            opacity: 0.35;
            filter: drop-shadow(0 0 30px rgba(255, 200, 150, 0.08));
            user-select: none;
            pointer-events: none;
            animation: decorFloat 14s ease-in-out infinite;
            color: #f2e0d0;
        }
        .corner-decor:nth-child(1) { top: 18px; left: 22px; animation-delay: 0s; }
        .corner-decor:nth-child(2) { top: 18px; right: 22px; animation-delay: 3s; }
        .corner-decor:nth-child(3) { bottom: 18px; left: 22px; animation-delay: 5.5s; }
        .corner-decor:nth-child(4) { bottom: 18px; right: 22px; animation-delay: 2.2s; }

        @keyframes decorFloat {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.2; }
            30% { transform: translateY(-16px) rotate(6deg) scale(1.15); opacity: 0.5; }
            70% { transform: translateY(10px) rotate(-4deg) scale(0.85); opacity: 0.3; }
            90% { transform: translateY(-8px) rotate(10deg) scale(1.08); opacity: 0.45; }
        }

        .content-screen {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: center;
            animation: fadeCozy 1.2s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }

        @keyframes fadeCozy {
            0% { opacity: 0; transform: translateY(25px) scale(0.94); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .content-title {
            font-family: 'Pacifico', sans-serif;
            font-weight: 400;
            font-size: 2.4rem;
            color: #f5ede6;
            text-shadow: 0 0 60px rgba(255, 200, 150, 0.06);
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .content-title small {
            font-size: 1.2rem;
            letter-spacing: 10px;
            opacity: 0.5;
            display: block;
            font-weight: 300;
            margin-top: -4px;
            color: #e8d5c0;
        }

        .spa-icon-line {
            font-size: 2.4rem;
            letter-spacing: 12px;
            color: #f2e0d0;
            opacity: 0.4;
            margin: 2px 0 6px;
        }

        .message-text {
            font-size: 1rem;
            color: #f2ede6;
            line-height: 1.8;
            max-width: 360px;
            margin: 0 auto;
            text-align: center;
            font-weight: 300;
            backdrop-filter: blur(6px);
            background: rgba(20, 15, 10, 0.25);
            border-radius: 40px;
            padding: 24px 22px 20px;
            border: 1px solid rgba(255, 215, 180, 0.06);
            box-shadow: inset 0 1px 0 rgba(255, 215, 180, 0.03);
        }

        .message-text p {
            margin-bottom: 12px;
            font-weight: 300;
            color: #f2ede6;
            text-shadow: 0 2px 30px rgba(0, 0, 0, 0.2);
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }
        .message-text p:last-of-type {
            margin-bottom: 0;
        }
        .message-text .spa-quote {
            font-family: 'Pacifico', sans-serif;
            font-style: italic;
            font-size: 1.1rem;
            color: #faf2e8;
            opacity: 0.8;
        }

        .wish-text {
            font-family: 'Great Vibes', cursive;
            font-size: 1.6rem;
            color: #f2e0d0;
            text-align: center;
            margin-top: 6px;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.12);
            border-radius: 60px;
            border: 1px solid rgba(255, 215, 180, 0.04);
            backdrop-filter: blur(4px);
            letter-spacing: 2px;
            opacity: 0.7;
        }

        .btn-support {
            margin-top: 20px;
            padding: 16px 28px;
            font-family: 'Pacifico', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            color: #2d1f16;
            background: linear-gradient(135deg, #f2e0d0, #dcc8b5);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 8px 40px rgba(255, 200, 150, 0.10), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            letter-spacing: 3px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 215, 180, 0.15);
            width: 100%;
            max-width: 280px;
            margin-left: auto;
            margin-right: auto;
            text-transform: uppercase;
        }

        .btn-support:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 50px rgba(255, 200, 150, 0.20);
            background: linear-gradient(135deg, #f5eadc, #e0cebc);
        }

        .btn-support:active {
            transform: scale(0.97);
        }

        /* ===== ПОПАП С ИЗОБРАЖЕНИЕМ ===== */
        .popup-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(20, 15, 10, 0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: none;
            justify-content: center;
            align-items: center;
            animation: fadeInPopup 0.5s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
            padding: 30px;
        }

        .popup-overlay.active {
            display: flex;
        }

        @keyframes fadeInPopup {
            0% { opacity: 0; transform: scale(0.92) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .popup {
            background: linear-gradient(160deg, rgba(50, 38, 30, 0.85), rgba(35, 28, 22, 0.80));
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: 50px 50px 40px 40px;
            padding: 44px 36px 38px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 215, 180, 0.15);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 215, 180, 0.05);
            position: relative;
            animation: popupBounce 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
        }

        @keyframes popupBounce {
            0% { opacity: 0; transform: scale(0.8) translateY(30px); }
            60% { transform: scale(1.02) translateY(-4px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .popup-icon {
            font-size: 3.4rem;
            display: block;
            margin-bottom: 4px;
            letter-spacing: 10px;
            opacity: 0.7;
        }

        .popup-title {
            font-family: 'Pacifico', sans-serif;
            font-weight: 400;
            font-size: 2.6rem;
            color: #f5ede6;
            margin-bottom: 4px;
            letter-spacing: 6px;
            text-transform: uppercase;
        }
        .popup-subtitle {
            font-family: 'Great Vibes', cursive;
            font-size: 1.8rem;
            color: #e8d5c0;
            margin-top: -6px;
            margin-bottom: 12px;
            opacity: 0.8;
        }

        /* ===== БЛОК ДЛЯ КАРТИНКИ ===== */
        .popup-image-area {
            border-radius: 28px;
            overflow: hidden;
            margin: 14px 0 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 0 0 1px rgba(255, 215, 180, 0.1);
            background: rgba(0,0,0,0.15);
            line-height: 0;
        }

        .popup-image-area img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.4s ease;
        }

        .popup-image-area img:hover {
            transform: scale(1.02);
        }

        /* ===== ЗАМЕСТИТЕЛЬ ЕСЛИ КАРТИНКИ НЕТ ===== */
        .popup-image-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 180px;
            padding: 30px 20px;
            background: radial-gradient(ellipse at center, rgba(255,215,180,0.08), rgba(0,0,0,0.15));
            color: #c4b2a0;
            font-size: 0.9rem;
            letter-spacing: 1px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 300;
        }

        .popup-image-placeholder span {
            font-size: 3.4rem;
            margin-bottom: 10px;
            opacity: 0.4;
        }

        .popup-btn-close {
            padding: 14px 40px;
            font-family: 'Pacifico', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            color: #2d1f16;
            background: linear-gradient(135deg, #f2e0d0, #dcc8b5);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 30px rgba(255, 200, 150, 0.05);
            border: 1px solid rgba(255, 215, 180, 0.10);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .popup-btn-close:hover {
            transform: scale(1.04);
            box-shadow: 0 10px 40px rgba(255, 200, 150, 0.15);
            background: linear-gradient(135deg, #f5eadc, #e0cebc);
        }

        .popup-btn-close:active {
            transform: scale(0.95);
        }

        @media (max-width: 420px) {
            .container { padding: 24px 16px 20px; border-radius: 44px; }
            .content-title { font-size: 2rem; }
            .content-title small { font-size: 1rem; }
            .message-text { font-size: 0.85rem; padding: 18px 16px; }
            .spa-icon-line { font-size: 2rem; }
            .popup { padding: 30px 20px 28px; }
            .popup-title { font-size: 2.2rem; }
            .popup-subtitle { font-size: 1.4rem; }
            .popup-image-placeholder { min-height: 140px; padding: 20px; }
        }
    </style>
</head>
<body>

<!-- ФОН -->
<div class="spa-bg"></div>

<!-- АНИМАЦИИ -->
<div class="spa-animation-layer">
    <div class="light-ray"></div>
    <div class="light-ray"></div>
    <div class="wave-ring"></div>
    <div class="wave-ring"></div>
    <div class="wave-ring"></div>
    <div class="wave-ring"></div>
    <div class="wave-ring"></div>
    <div class="oil-drop-glow"></div>
    <div class="oil-drop-glow"></div>
    <div class="oil-drop-glow"></div>
    <div class="oil-drop-glow"></div>
    <div class="oil-drop-glow"></div>
    <div class="oil-drop-glow"></div>
    <div class="sparkle-bright"></div>
    <div class="sparkle-bright"></div>
    <div class="sparkle-bright"></div>
    <div class="sparkle-bright"></div>
    <div class="sparkle-bright"></div>
    <div class="sparkle-bright"></div>
    <div class="sparkle-bright"></div>
    <div class="sparkle-bright"></div>
    <div class="sparkle-bright"></div>
    <div class="sparkle-bright"></div>
</div>

<!-- ОСНОВНОЙ КОНТЕЙНЕР -->
<div class="container" id="appContainer">
    <span class="corner-decor">🪷</span>
    <span class="corner-decor">🌿</span>
    <span class="corner-decor">🕯️</span>
    <span class="corner-decor">✨</span>

    <div id="mainScreen" class="content-screen">
        <div class="content-title">
            <small>релаксация</small>
        </div>
        <div class="spa-icon-line">༄  𓆩♡𓆪  ༄</div>

        <div class="message-text">
            <p>Погрузитесь в атмосферу безмятежности, всё для вашего восстановления.</p>
            <p class="spa-quote">«Забота о себе — это не роскошь, а необходимость»</p>
        </div>
        <button class="btn-support" id="supportBtn">Забрать</button>
    </div>
</div>

<div class="popup-overlay" id="popupOverlay">
    <div class="popup">
        <span class="popup-icon">🧖‍♀️  𓆩♡𓆪  🧖</span>
        <div class="popup-image-area">
            <img src="./spas.jpg" alt="Спа-сертификат">

        </div>

        <button class="popup-btn-close" id="popupCloseBtn">🌟 принять</button>
    </div>
</div>

<script>
    (function() {
        const supportBtn = document.getElementById('supportBtn');
        const popupOverlay = document.getElementById('popupOverlay');
        const popupCloseBtn = document.getElementById('popupCloseBtn');

        function openPopup() {
            popupOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closePopup() {
            popupOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        supportBtn.addEventListener('click', openPopup);
        popupCloseBtn.addEventListener('click', closePopup);

        popupOverlay.addEventListener('click', function(e) {
            if (e.target === popupOverlay) {
                closePopup();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && popupOverlay.classList.contains('active')) {
                closePopup();
            }
        });
    })();
</script>

</body>
</html>
